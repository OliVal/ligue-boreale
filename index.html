<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ligue Boréale">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <title>Ligue Boréale — Hockey 3D</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" crossorigin>
</head>
<body>
  <div id="boot"><b>LIGUE <span>BORÉALE</span></b><small>Chargement…</small></div>
  <script>
    // navigateur trop ancien (les « import maps » arrivent avec iOS 16.4, Chrome 89, Firefox 108) : on le dit clairement
    if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
      document.querySelector('#boot small').textContent = 'Ton navigateur est trop ancien pour ce jeu : mets à jour ton iPhone ou iPad (iOS 16.4 ou plus récent) ou ton navigateur.';
      document.querySelector('#boot small').style.animation = 'none';
    } else setTimeout(() => { const b = document.querySelector('#boot small'); if (b) b.textContent = 'Le chargement est long : vérifie ta connexion Internet (la 3D se charge en ligne).'; }, 15000);
  </script>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="screen"></div>
  <div id="rotate"><i>📱</i>Tourne ton téléphone à l'horizontale<small>Ligue Boréale se joue en mode paysage.</small></div>
  <noscript>Ce jeu nécessite JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
