<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligue Boréale — Hockey 3D</title>
<!-- L'ancienne version mobile est maintenant le jeu principal : on y renvoie (en gardant un code d'invitation ?partie=…) -->
<meta http-equiv="refresh" content="2; url=../">
<link rel="canonical" href="../">
<style>
  html, body { margin: 0; height: 100%; background: #07090d; color: #fff; font: 600 17px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #ffd21f; }
</style>
</head>
<body>
<p>Le jeu a déménagé : la version pour téléphone est maintenant le jeu principal.<br><br><a id="go" href="../">Ouvrir Ligue Boréale</a></p>
<script>
  (function () {
    var dest = '../' + location.search + location.hash;
    document.getElementById('go').href = dest;
    var go = function () { location.replace(dest); };
    // on retire l'ancien service worker de /mobile/ (il ne sert plus à rien)
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.filter(function (r) { return /\/mobile\/$/.test(r.scope); }).map(function (r) { return r.unregister(); }));
        }).then(go, go);
        setTimeout(go, 800);
        return;
      }
    } catch (e) { /* on redirige quand même */ }
    go();
  })();
</script>
</body>
</html>
