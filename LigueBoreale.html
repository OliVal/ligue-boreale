miné)\nexport function fromMatch(f, m) {\n  const g = nextGame(f), playoff = f.phase === 'playoffs';\n  const ui = g.home ? 0 : 1, U = m.teams[ui], O = m.teams[1 - ui];\n  if (!playoff) for (const [mt, t] of [[U, f.teams[f.user]], [O, f.teams[g.opp]]]) {\n    for (const pl of mt.roster) {\n      const p = byId(t, pl.d.id), s = pl.st; if (!p) continue;\n      if (p.pos === 'G') { if (s.sa > 0) { p.st.gs++; p.st.gp++; p.st.sa += s.sa; p.st.ga += s.ga; if (m.winner === mt) p.st.w++; if (!s.ga) p.st.so++; } continue; }\n      p.st.g += s.g; p.st.a += s.a; p.st.sog += s.sog; p.st.pim += s.pim; p.st.hits += s.hits;\n    }\n  }\n  return { gf: U.score, ga: O.score, ot: m.period > 3 };\n}\n\n// Joue la journée (saison) ou le prochain match de chaque série; mine = { gf, ga, ot } si le joueur a joué son match\nexport function advance(f, mine = null) {\n  const g = nextGame(f);\n  let res = null;\n  if (f.phase === 'season') {\n    for (const [h, a] of f.rounds[f.round]) {\n      if (mine && (h === f.user || a === f.user)) {\n        const home = h === f.user, gh = home ? mine.gf : mine.ga, ga = home ? mine.ga : mine.gf;\n        tableAdd(f, h, a, gh, ga, mine.ot);\n        postGame(f, f.teams[h], gh > ga, false); postGame(f, f.teams[a], ga > gh, false);\n        res = { gf: mine.gf, ga: mine.ga, ot: mine.ot };\n      } else {\n        const r = simGame(f, h, a, false);\n        if (h === f.user || a === f.user) res = h === f.user ? { gf: r.gh, ga: r.ga, ot: r.ot } : { gf: r.ga, ga: r.gh, ot: r.ot };\n      }\n    }\n    f.log.push({ opp: f.teams[g.opp].abbr, home: g.home, ...res });\n    f.round++;\n    for (const p of f.draft) p.seen += f.scouts.filter((s) => s === p.region).length;\n    if (f.round >= f.rounds.length) startPlayoffs(f);\n  } else if (f.phase === 'playoffs') {\n    for (const s of f.po.series) {\n      if (s.done) continue;\n      const h = seriesHome(s), a = h === s.a ? s.b : s.a;\n      let wa;\n      if (mine && (s.a === f.user || s.b === f.user)) {\n        wa = (mine.gf > mine.ga) === (s.a === f.user);\n        postGame(f, f.teams[s.a], wa, true); postGame(f, f.teams[s.b], !wa, true);\n        res = { gf: mine.gf, ga: mine.ga, ot: mine.ot };\n      } else {\n        const r = simGame(f, h, a, true); wa = (r.gh > r.ga) === (h === s.a);\n        if (s.a === f.user || s.b === f.user) res = h === f.user ? { gf: r.gh, ga: r.ga, ot: r.ot } : { gf: r.ga, ga: r.gh, ot: r.ot };\n      }\n      if (wa) s.wa++; else s.wb++;\n      if (s.wa === 3 || s.wb === 3) s.done = true;\n    }\n    if (f.po.series.every((s) => s.done)) nextPlayoffRound(f);\n  }\n  return res;\n}\n\n// ---------- séries éliminatoires (3 de 5) ----------\nconst seriesHome = (s) => ([0, 1, 4].includes(s.wa + s.wb) ? s.a : s.b);\nexport const PO_ROUNDS = ['Demi-finales d\\'association', 'Finales d\\'association', `Finale de la ${CUP}`];\nfunction startPlayoffs(f) {\n  f.finalRank = standings(f).map((r) => r.i);\n  const series = [];\n  for (const conf of ['Est', 'Ouest']) {\n    const s = standings(f, conf).map((r) => r.i);\n    series.push({ a: s[0], b: s[3], wa: 0, wb: 0, done: false }, { a: s[1], b: s[2], wa: 0, wb: 0, done: false });\n  }\n  f.po = { round: 0, series, past: [] };\n  f.phase = 'playoffs';\n  for (const t of f.teams) for (const p of t.players) if (p.inj > 3) p.inj = 3;\n  note(f, `La saison est terminée. ${f.po.series.some((s) => s.a === f.user || s.b === f.user) ? 'Ton équipe participe aux séries !' : 'Ton équipe rate les séries.'}`);\n}\nconst winner = (s) => (s.wa > s.wb ? s.a : s.b);\nfunction nextPlayoffRound(f) {\n  const po = f.po, w = po.series.map(winner);\n  po.past.push(po.series);\n  if (w.length === 1) { f.champ = w[0]; makeAwards(f); return; }\n  const better = (x, y) => (f.finalRank.indexOf(x) < f.finalRank.indexOf(y) ? [x, y] : [y, x]);\n  po.series = [];\n  for (let i = 0; i < w.length; i += 2) { const [a, b] = better(w[i], w[i + 1]); po.series.push({ a, b, wa: 0, wb: 0, done: false }); }\n  po.round++;\n}\n\n// ---------- meneurs et trophées ----------\nexport function allPlayers(f) { return f.teams.flatMap((t) => t.players.map((p) => ({ p, t }))); }\nexport function leaders(f, key, n = 10) {\n  const val = { pts: (p) => p.st.g + p.st.a, g: (p) => p.st.g, a: (p) => p.st.a, pm: (p) => p.st.pm, hits: (p) => p.st.hits, w: (p) => p.st.w,\n    svp: (p) => (p.st.sa ? 1 - p.st.ga / p.st.sa : 0), so: (p) => p.st.so }[key];\n  const minGs = Math.max(1, f.round * 0.3);\n  return allPlayers(f).filter(({ p }) => (key === 'svp' || key === 'w' || key === 'so' ? p.pos === 'G' && p.st.gs >= (key === 'svp' ? minGs : 1) : p.pos !== 'G' && p.st.gp > 0))\n    .map((x) => ({ ...x, v: val(x.p) })).sort((x, y) => y.v - x.v).slice(0, n);\n}\nfunction makeAwards(f) {\n  const all = allPlayers(f), sk = all.filter((x) => x.p.pos !== 'G' && x.p.st.gp > 0), pts = (p) => p.st.g + p.st.a;\n  const best = (list, score) => list.reduce((b, x) => (!b || score(x) > score(b) ? x : b), null);\n  const rk = (t) => 17 - (f.finalRank.indexOf(t.id) + 1);\n  const win = {\n    mvp: best(sk, (x) => pts(x.p) + rk(x.t) * 0.6 + x.p.st.pm * 0.2),\n    pts: best(sk, (x) => pts(x.p) + x.p.st.g * 0.01),\n    gk: best(all.filter((x) => x.p.pos === 'G' && x.p.st.gs >= 10), (x) => (1 - x.p.st.ga / x.p.st.sa) * 100 + x.p.st.w * 0.05),\n    def: best(sk.filter((x) => x.p.pos === 'D'), (x) => pts(x.p) + x.p.st.pm * 0.4 + x.p.ovr * 0.2),\n    rook: best(sk.filter((x) => x.p.car.gp === 0 && x.p.age <= 22), (x) => pts(x.p)),\n  };\n  const list = [];\n  for (const k of Object.keys(TROPHIES)) {\n    const x = win[k]; if (!x) continue;\n    x.p.aw.push(`${TROPHIES[k].split(' (')[0]} (an ${f.year})`);\n    list.push({ k, name: x.p.name, team: x.t.abbr, mine: x.t.id === f.user,\n      line: x.p.pos === 'G' ? `${x.p.st.w} V, ${(1 - x.p.st.ga / x.p.st.sa).toFixed(3).slice(1)}` : `${x.p.st.g} B, ${x.p.st.a} A` });\n  }\n  const c = f.teams[f.champ];\n  for (const p of c.players) p.aw.push(`${CUP} (an ${f.year})`);\n  f.history.unshift({ year: f.year, champ: c.abbr, champName: `${c.city} ${c.name}`, mine: f.champ === f.user, awards: list, rank: f.finalRank.indexOf(f.user) + 1 });\n  note(f, `Les ${c.name} de ${c.city} remportent la ${CUP} !`);\n  f.phase = 'awards';\n}\n\n// ---------- intersaison ----------\nfunction develop(p) {\n  const room = p.pot - p.ovr;\n  let d = p.age <= 22 ? rnd.r(0.5, 4) * (room > 0 ? 1 : 0.2) : p.age <= 26 ? rnd.r(0, 2.2) * (room > 0 ? 1 : 0.3) : p.age <= 30 ? rnd.r(-1, 1) : -rnd.r(0.3, 3) * (p.age >= 34 ? 1.4 : 1);\n  if (d > room && d > 0) d = Math.max(room, 0.3);\n  const keys = p.pos === 'G' ? ['ref', 'pos'] : ATTRS;\n  for (const k of keys) p.a[k] = Math.round(clamp(p.a[k] + d + rnd.g() * 0.7 + (p.age >= 31 && (k === 'spd' || k === 'acc') ? -0.6 : 0), 35, 99));\n  p.ovr = calcOvr(p); p.pot = Math.max(p.pot, p.ovr);\n}\nfunction archive(p, year, abbr) {\n  if (p.st.gp > 0) {\n    p.hist.push({ y: year, t: abbr, gp: p.st.gp, g: p.st.g, a: p.st.a, pm: p.st.pm, pim: p.st.pim, w: p.st.w, sa: p.st.sa, ga: p.st.ga });\n    for (const k of ST_KEYS) p.car[k] += p.st[k];\n  }\n}\nfunction hofWorthy(p) {\n  const solo = p.aw.filter((x) => !x.startsWith(CUP)).length;\n  return solo >= 2 || (p.pos === 'G' ? p.car.w >= 230 : p.car.g + p.car.a >= (p.pos === 'D' ? 270 : 440));\n}\n// Lance l'intersaison : carrières, progression, retraites, contrats échus\nexport function beginOffseason(f) {\n  f.retired = [];\n  for (const t of f.teams) {\n    for (const p of t.players) { archive(p, f.year, t.abbr); p.age++; develop(p); p.inj = 0; p.con.yrs--; }\n    const gone = t.players.filter((p) => (p.age >= 35 && rnd.chance((p.age - 33) * 0.22)) || (p.age >= 31 && p.ovr < 63));\n    for (const p of gone) {\n      const hof = hofWorthy(p);\n      f.retired.push({ name: p.name, team: t.abbr, age: p.age, pos: p.pos, mine: t.id === f.user, hof });\n      if (hof) f.hof.unshift({ name: p.name, pos: p.pos, team: t.abbr, year: f.year, gp: p.car.gp, g: p.car.g, a: p.car.a, w: p.car.w, aw: p.aw.length });\n    }\n    t.players = t.players.filter((p) => !gone.includes(p));\n    if (t.id === f.user) continue;\n    // DG adverses : ils gardent leurs bons joueurs si le plafond le permet\n    for (const p of t.players.filter((q) => q.con.yrs <= 0).sort((x, y) => y.ovr - x.ovr)) {\n      const sal = ask(p), others = payroll(t) - p.con.sal;\n      if (p.ovr >= 66 && others + sal <= f.cap - 4) p.con = { sal, yrs: rnd.i(1, 4) };\n      else { t.players = t.players.filter((q) => q !== p); p.con = { sal, yrs: 0 }; f.fa.push(p); }\n    }\n  }\n  for (const p of f.fa) { p.age++; develop(p); }\n  f.fa = f.fa.filter((p) => p.age < 36 && p.ovr >= 58);\n  f.phase = 'resign';\n}\nexport const expiring = (f) => f.teams[f.user].players.filter((p) => p.con.yrs <= 0);\nexport function resign(f, id, yrs) {\n  const t = f.teams[f.user], p = byId(t, id), sal = ask(p);\n  if (!p || payroll(t) - p.con.sal + sal > f.cap) return false;\n  p.con = { sal, yrs }; p.morale = clamp(p.morale + 10, 0, 100);\n  return true;\n}\nexport function release(f, id) {\n  const t = f.teams[f.user], p = byId(t, id);\n  if (!p) return false;\n  t.players = t.players.filter((q) => q !== p); p.con = { sal: ask(p), yrs: 0 }; f.fa.push(p);\n  if (f.phase === 'season' || f.phase === 'playoffs') setLines(f, t, true);\n  return true;\n}\nexport function endResign(f) {\n  for (const p of expiring(f)) release(f, p.id);\n  // ordre du repêchage : inverse du classement, deux rondes\n  const order = [...f.finalRank].reverse();\n  f.dr = { order: [...order, ...order], pick: 0, log: [] };\n  f.phase = 'draft';\n  draftAuto(f);\n}\n\n// ---------- repêchage et dépisteurs ----------\nfunction genDraftClass(f) {\n  f.draft = [];\n  for (let i = 0; i < 40; i++) {\n    const p = mkPlayer(f, rnd.pick(['C', 'LW', 'RW', 'D', 'D', 'G']), rnd.r(52, 66) - i * 0.12, 18);\n    p.pot = Math.round(clamp(p.ovr + rnd.r(6, 26), 60, 96)); p.con = { sal: 0.9, yrs: 3 }; p.car = zeroSt();\n    p.region = rnd.i(0, 3); p.seen = 0; p.bias = rnd.r(-1, 1);\n    f.draft.push(p);\n  }\n}\n// Fourchette estimée par les dépisteurs : elle se resserre à mesure que la région est suivie\nexport function estimate(p) {\n  const err = Math.max(1, Math.round(9 - p.seen * 0.3));\n  const mid = (v) => Math.round(v + p.bias * err * 0.6);\n  return { ovr: [mid(p.ovr) - err, mid(p.ovr) + err], pot: [mid(p.pot) - err, mid(p.pot) + err], err };\n}\nconst aiDraftScore = (p) => p.pot * 0.65 + p.ovr * 0.35 + rnd.g() * 3;\nfunction doPick(f, teamIdx, p) {\n  const t = f.teams[teamIdx];\n  f.draft = f.draft.filter((q) => q !== p);\n  const { region, seen, bias, ...pl } = p;\n  t.players.push(pl); fixNum(t, pl);\n  f.dr.log.push({ n: f.dr.pick + 1, team: t.abbr, name: p.name, pos: p.pos, mine: teamIdx === f.user });\n  f.dr.pick++;\n}\n// Les autres équipes choisissent jusqu'au tour du joueur\nfunction draftAuto(f) {\n  const d = f.dr;\n  while (d.pick < d.order.length && d.order[d.pick] !== f.user) doPick(f, d.order[d.pick], f.draft.reduce((b, p) => (aiDraftScore(p) > aiDraftScore(b) ? p : b)));\n  if (d.pick >= d.order.length) f.phase = 'fa';\n}\nexport const onClock = (f) => f.phase === 'draft' && f.dr.order[f.dr.pick] === f.user;\nexport function draftPick(f, id) {\n  const p = f.draft.find((q) => q.id === id);\n  if (!onClock(f) || !p) return false;\n  doPick(f, f.user, p); draftAuto(f);\n  return true;\n}\n\n// ---------- agents libres ----------\nexport function signFA(f, id) {\n  const t = f.teams[f.user], p = f.fa.find((q) => q.id === id);\n  if (!p) return 'Joueur introuvable.';\n  if (t.players.length >= MAX_ROSTER) return `Effectif complet (${MAX_ROSTER} joueurs).`;\n  const sal = ask(p);\n  if (payroll(t) + sal > f.cap) return 'Pas assez d\\'espace sous le plafond salarial.';\n  p.con = { sal, yrs: p.age >= 32 ? 1 : 2 }; p.morale = 70;\n  f.fa = f.fa.filter((q) => q !== p); t.players.push(p); fixNum(t, p);\n  if (f.phase === 'season') setLines(f, t, true);\n  return null;\n}\nfunction aiFreeAgency(f) {\n  f.fa.sort((x, y) => y.ovr - x.ovr);\n  for (let pass = 0; pass < 3; pass++) for (const t of f.teams) {\n    if (t.id === f.user) continue;\n    const need = ['F', 'D', 'G'].find((g) => t.players.filter((p) => group(p) === g).length < { F: 14, D: 7, G: 3 }[g]);\n    const cand = f.fa.find((p) => (need ? group(p) === need : p.ovr >= 72) && payroll(t) + ask(p) <= f.cap && t.players.length < MAX_ROSTER);\n    if (!cand) continue;\n    cand.con = { sal: ask(cand), yrs: rnd.i(1, 3) }; f.fa = f.fa.filter((q) => q !== cand); t.players.push(cand); fixNum(t, cand);\n  }\n}\n// Termine l'intersaison et lance la saison suivante\nexport function newSeason(f) {\n  aiFreeAgency(f);\n  for (const t of f.teams) {\n    while (t.players.length > MAX_ROSTER) { const w = [...t.players].sort((x, y) => x.ovr - y.ovr)[0]; t.players = t.players.filter((p) => p !== w); f.fa.push(w); }\n    while (t.id !== f.user && payroll(t) > f.cap) { const w = [...t.players].sort((x, y) => y.con.sal - x.con.sal)[0]; t.players = t.players.filter((p) => p !== w); w.con.yrs = 0; f.fa.push(w); }\n    for (const p of t.players) p.morale = clamp(p.morale + (65 - p.morale) * 0.4, 0, 100);\n  }\n  f.fa = f.fa.sort((x, y) => y.ovr - x.ovr).slice(0, 40);\n  while (f.fa.length < 16) f.fa.push(mkPlayer(f, rnd.pick(['C', 'LW', 'RW', 'D', 'D', 'G']), rnd.r(58, 68), rnd.i(22, 31)));\n  for (const p of f.fa) p.con = { sal: ask(p), yrs: 0 };\n  f.year++; f.dr = null; f.retired = null;\n  startSeason(f);\n  note(f, `Début de la saison ${f.year}. Plafond salarial : ${f.cap} M$.`);\n}\nexport const overCap = (f) => payroll(f.teams[f.user]) > f.cap;\n\n// ---------- échanges : IA de directeur général ----------\n// Valeur d'un joueur pour une équipe donnée : les aspirants paient pour le présent, les équipes en reconstruction pour l'avenir\nexport function tradeValue(f, p, t) {\n  const rk = rankOf(f, t.id), contender = rk <= 6, rebuild = rk >= 11;\n  const ageF = p.age <= 24 ? 1.15 : p.age <= 29 ? 1 : p.age <= 32 ? 0.8 : 0.5;\n  let v = Math.pow(Math.max(0, p.ovr - 60), 1.5) * ageF * (contender ? 1.15 : rebuild && p.age >= 29 ? 0.7 : 1);\n  v += Math.max(0, p.pot - p.ovr) * (p.age <= 23 ? 2.2 : 0.6) * (rebuild ? 1.5 : contender ? 0.7 : 1);\n  v -= Math.max(0, p.con.sal - salFor(p.ovr, p.age)) * 6 * Math.max(1, p.con.yrs); // contrat trop cher\n  if (p.con.yrs <= 1 && rebuild) v *= 0.85;\n  const depth = t.players.filter((q) => group(q) === group(p) && q.ovr > p.ovr).length;\n  if (depth < { F: 3, D: 2, G: 1 }[group(p)]) v *= 1.12; // comble un besoin\n  if (p.inj > 5) v *= 0.8;\n  return Math.max(0, v);\n}\nexport function proposeTrade(f, other, give, get) {\n  const U = f.teams[f.user], O = f.teams[other];\n  const G = give.map((id) => byId(U, id)).filter(Boolean), R = get.map((id) => byId(O, id)).filter(Boolean);\n  if (!G.length || !R.length) return { ok: false, why: 'Choisis au moins un joueur de chaque côté.' };\n  const sum = (l) => l.reduce((s, p) => s + p.con.sal, 0);\n  const after = (t, out, inn) => t.players.filter((p) => !out.includes(p)).concat(inn);\n  const fits = (list) => ['F', 'D', 'G'].every((g) => list.filter((p) => group(p) === g).length >= { F: 12, D: 6, G: 2 }[g]) && list.length <= MAX_ROSTER;\n  if (!fits(after(U, G, R))) return { ok: false, why: 'Ton effectif ne serait plus valide (12 attaquants, 6 défenseurs, 2 gardiens, 26 joueurs au plus).' };\n  if (!fits(after(O, R, G))) return { ok: false, why: `L'effectif de ${O.city} ne serait plus valide.` };\n  if (payroll(U) - sum(G) + sum(R) > f.cap) return { ok: false, why: 'Cet échange te ferait dépasser le plafond salarial.' };\n  if (payroll(O) - sum(R) + sum(G) > f.cap) return { ok: false, why: `${O.city} dépasserait le plafond salarial.` };\n  const vin = G.reduce((s, p) => s + tradeValue(f, p, O), 0), vout = R.reduce((s, p) => s + tradeValue(f, p, O), 0);\n  if (vin < vout * 1.06 + 2) {\n    const gap = vout ? vin / vout : 0;\n    return { ok: false, why: gap > 0.85 ? `Le DG de ${O.city} hésite : il veut un petit quelque chose de plus.` : gap > 0.5 ? `Le DG de ${O.city} refuse : il estime perdre au change.` : `Le DG de ${O.city} refuse net : l'offre est loin du compte.` };\n  }\n  U.players = after(U, G, R); O.players = after(O, R, G);\n  for (const p of R) { p.morale = 62; fixNum(U, p); } for (const p of G) { p.morale = 60; fixNum(O, p); }\n  setLines(f, U, true); setLines(f, O, false);\n  f.trades++;\n  note(f, `Échange conclu avec ${O.city} : ${G.map((p) => p.name).join(', ')} contre ${R.map((p) => p.name).join(', ')}.`);\n  return { ok: true, why: `Le DG de ${O.city} accepte l'échange.` };\n}\n", "js/game/human.js": "// Contrôle du joueur humain : traduit les touches en actions sur le corps contrôlé\n// side : équipe contrôlée (par défaut celle de l'utilisateur local; en ligne, l'hôte contrôle aussi celle de l'invité)\nimport { hyp, clamp } from '../core/util.js';\nimport { interceptPoint } from '../sim/ai.js';\nimport { goalieFreeze, goalieDive } from '../sim/goalie.js';\nimport { RINK } from '../core/config.js';\n\n// direction demandée : joystick tactile (analogique) ou touches\nconst stickOf = (input) => (input.stick ? input.stick()\n  : [(input.down('right') ? 1 : 0) - (input.down('left') ? 1 : 0), (input.down('up') ? 1 : 0) - (input.down('down') ? 1 : 0)]);\n\n// assist : aide tactile (au doigt seulement; 0 aucune, 1 normale, 2 forte) — on préfère un coéquipier démarqué, sans adversaire sur la trajectoire\nfunction pickPassTarget(m, b, mx, mz, assist = 0) {\n  const has = hyp(mx, mz) > 0.3;\n  const dx = has ? mx : Math.cos(b.face), dz = has ? mz : Math.sin(b.face);\n  let best = null, bs = -1e9;\n  for (const o of b.team.skaters) {\n    if (!o.active || o === b || o.stun > 0) continue;\n    const d = hyp(o.x - b.x, o.z - b.z) || 1;\n    const dot = ((o.x - b.x) * dx + (o.z - b.z) * dz) / d;\n    let s = dot * 1.5 - d * 0.015 - (has && dot < 0.15 ? 2 : 0);\n    if (assist) s += (assist > 1 ? 1.5 : 1) * ((dot > 0.35 ? 0.6 : 0) - 1.6 * laneBlock(m, b, o));\n    if (s > bs) { bs = s; best = o; }\n  }\n  return best;\n}\n\n// 1 si un adversaire coupe la ligne de passe (à moins de 1,3 m), moins s'il en est plus loin\nfunction laneBlock(m, b, o) {\n  const ax = o.x - b.x, az = o.z - b.z, L2 = ax * ax + az * az || 1;\n  let worst = 0;\n  for (const e of m.other(b.team).skaters) {\n    if (!e.active) continue;\n    const u = ((e.x - b.x) * ax + (e.z - b.z) * az) / L2;\n    if (u <= 0.05 || u >= 0.95) continue;\n    const dd = hyp(b.x + ax * u - e.x, b.z + az * u - e.z);\n    worst = Math.max(worst, clamp((1.9 - dd) / 0.6, 0, 1));\n  }\n  return worst;\n}\n\n// Aide à la visée (tactile) : vise le côté du filet que le gardien couvre le moins, sans la pénalité de précision du tir « automatique »\nfunction assistAim(m, b) {\n  const p = m.puck, og = m.other(b.team).goalie, gx = b.team.dir * RINK.goalX;\n  if (!og || !og.active) return 0;\n  const k = (og.x - p.x) / ((gx - p.x) || 1e-6), lineZ = p.z + (0 - p.z) * k;\n  return (og.z > lineZ ? -1 : 1) * 0.8;\n}\n\n// Changement de joueur automatique (au doigt seulement) : quand l'adversaire a la rondelle ou qu'elle est libre,\n// on passe au coéquipier nettement plus près — jamais pendant que le pouce guide le joueur, sauf s'il est très loin du jeu\nfunction autoSwitch(m, t, b, len, level = 1) {\n  const p = m.puck;\n  if (p.carrier && p.carrier.team === t) return;\n  if (m.time < (t.autoSwT || 0)) return;\n  const dMe = hyp(b.x - p.x, b.z - p.z);\n  if (len > 0.1 && dMe < 16) return;\n  let best = null, bd = dMe - (level > 1 ? 3 : 4.5);\n  for (const o of t.skaters) {\n    if (!o.active || o === b || o.stun > 0 || o.changing) continue;\n    const d = hyp(o.x - p.x, o.z - p.z);\n    if (d < bd) { bd = d; best = o; }\n  }\n  if (best) { m.setUser(best); t.autoSwT = m.time + (level > 1 ? 0.9 : 1.2); }\n}\n\nexport function switchPlayer(m, t = m.teams[m.userTeam]) {\n  if (m.lockPl || !t) return;\n  const p = m.puck;\n  if (p.carrier && p.carrier.team === t && !p.carrier.isGoalie) { m.setUser(p.carrier); return; }\n  const list = t.skaters.filter((b) => b.active && b.stun <= 0 && b !== t.ub)\n    .sort((a, b) => hyp(a.x - p.x, a.z - p.z) - hyp(b.x - p.x, b.z - p.z));\n  if (list.length) m.setUser(list[0]);\n}\n\nexport function updateHuman(m, input, basis, side = m.userTeam) {\n  if (side == null || m.autoUser) return;\n  const t = m.teams[side];\n  if (m.state === 'fight') {\n    if (input.pressed('wrist') || input.pressed('slap')) m.fightInput('punch');\n    if (input.pressed('pass') || input.pressed('check')) m.fightInput('block');\n    return;\n  }\n  let b = t.ub;\n  if (b && b.isGoalie) { updateGoalieHuman(m, b, input, basis); return; }\n  if (m.special && m.special.team !== t) return;\n  if (!b || !b.active) {\n    if (m.special || m.lockPl) return;\n    switchPlayer(m, t); b = t.ub;\n    if (!b || !b.active) return;\n  }\n  const [ix, iy] = stickOf(input);\n  let mx = ix * basis.rx + iy * basis.fx, mz = ix * basis.rz + iy * basis.fz;\n  const len = hyp(mx, mz);\n  if (len > 1) { mx /= len; mz /= len; }\n  b.ctrl.mx = mx; b.ctrl.mz = mz; b.ctrl.sprint = input.down('sprint');\n  if (m.state === 'faceoff') {\n    if (input.pressed('slap') || input.pressed('wrist') || input.pressed('pass')) m.faceoffPress(side);\n    return;\n  }\n  if (m.state !== 'play') return;\n  if (input.pressed('ability')) m.useAbility(b);\n  const p = m.puck, has = p.carrier === b;\n  const assist = +input.assist || 0; // true (ancienne valeur) compte comme « normale »\n  const aim = () => (Math.abs(mz) > 0.3 ? Math.sign(mz) * 0.85 : assist ? assistAim(m, b) : null);\n\n  if (has) {\n    if (m.special && m.special.phase !== 'live') { b.ctrl.mx = b.ctrl.mz = 0; return; }\n    if (input.pressed('slap')) b.windup = { t: 0, type: 'slap', need: 99 };\n    else if (b.windup && !input.down('slap')) m.shoot(b, 'slap', clamp(b.windup.t / 0.8, 0.15, 1), aim());\n    if (p.carrier === b && input.pressed('wrist')) m.shoot(b, 'wrist', 0, aim());\n    if (p.carrier === b && (input.pressed('pass') || input.pressed('saucer'))) {\n      const target = pickPassTarget(m, b, mx, mz, assist);\n      if (target) m.pass(b, target, input.pressed('saucer'));\n    }\n    if (p.carrier === b && input.pressed('dump')) m.dump(b, mx, mz);\n    if (p.carrier === b && input.pressed('deke')) m.deke(b, mx, mz);\n  } else {\n    b.windup = null;\n    const incoming = !p.carrier && p.pass && p.pass.to === b;\n    if (incoming && len < 0.1) { // aide à la réception\n      const ip = interceptPoint(m, b), dx = ip[0] - b.x, dz = ip[1] - b.z, d = hyp(dx, dz);\n      if (d > 0.3) { b.ctrl.mx = dx / d * Math.min(1, d / 2); b.ctrl.mz = dz / d * Math.min(1, d / 2); }\n    }\n    if (incoming && (input.pressed('wrist') || input.pressed('slap'))) {\n      b.oneTimer = { type: input.pressed('slap') ? 'slap' : 'wrist', exp: m.time + 1.0, aim: aim() };\n    }\n    if (input.pressed('check')) m.check(b);\n    if (input.pressed('deke')) m.deke(b, mx, mz);\n    if (input.pressed('switch')) switchPlayer(m, t);\n    else if (assist && !incoming && !m.lockPl) autoSwitch(m, t, b, len, assist);\n    if (input.pressed('pass') && p.carrier && p.carrier.team === t) { t.callFor = b; t.callT = 0.9; }\n  }\n  if (input.pressed('line') && !m.special && m.mode === 'game' && !m.lockPl) m.lineChange(t);\n}\n\n// Gardien contrôlé (Carrière) : peu de touches, toutes réutilisées du patineur\n//   déplacer = glisser · Sprint = poussée rapide · Lancer frappé (maintenir) = papillon\n//   Mise en échec = plongeon · Lancer du poignet = geler la rondelle · Passe / Dégager quand il a la rondelle\nfunction updateGoalieHuman(m, g, input, basis) {\n  const [ix, iy] = stickOf(input);\n  let mx = ix * basis.rx + iy * basis.fx, mz = ix * basis.rz + iy * basis.fz;\n  const len = hyp(mx, mz);\n  if (len > 1) { mx /= len; mz /= len; }\n  g.gc = { mx, mz, fast: input.down('sprint'), fly: input.down('slap') };\n  if (m.state !== 'play') return;\n  if (input.pressed('ability')) m.useAbility(g);\n  if (m.puck.carrier === g) {\n    if (input.pressed('pass')) { const to = pickPassTarget(m, g, mx, mz); if (to) m.pass(g, to, false); }\n    else if (input.pressed('saucer')) { const to = pickPassTarget(m, g, mx, mz); if (to) m.pass(g, to, true); }\n    else if (input.pressed('dump')) m.dump(g, mx, mz);\n    else if (input.pressed('wrist')) goalieFreeze(m, g);\n    return;\n  }\n  if (input.pressed('wrist')) goalieFreeze(m, g);\n  if (input.pressed('check')) goalieDive(m, g, mx, mz);\n}\n", "js/net/peer.js": "// Connexion entre deux joueurs, avec un code de partie de 5 lettres.\n// 1) Connexion directe entre les deux navigateurs (WebRTC, avec PeerJS pour se trouver).\n// 2) Plan B automatique si un réseau bloque la connexion directe (réseau d'école, LTE…) : les messages passent par\n//    un relais public (MQTT sur WebSocket, port web 443). Le relais ajoute un peu de délai mais passe presque partout.\nconst PEER_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';\nconst MQTT_URL = 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';\n// deux relais publics : l'hôte écoute sur les deux, l'invité essaie les deux en même temps\nconst BROKERS = [\n  { url: 'wss://public.cloud.shiftr.io', opts: { username: 'public', password: 'public' } }, // port 443\n  { url: 'wss://test.mosquitto.org:8081', opts: {} },\n];\nconst PREFIX = 'ligueboreale-hockey-v1-';\nconst TOPIC = 'ligueboreale-hockey/v1/';\nconst ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sans O/0 ni I/1, faciles à confondre\nconst DIRECT_WAIT = 7000;   // délai accordé à la connexion directe avant de passer au relais\nconst JOIN_TIMEOUT = 30000; // abandon complet\n\nconst loaded = {};\nfunction load(url, global) {\n  if (window[global]) return Promise.resolve();\n  if (!loaded[url]) loaded[url] = new Promise((ok, fail) => {\n    const s = document.createElement('script');\n    s.src = url; s.onload = () => ok(); s.onerror = () => { loaded[url] = null; fail(new Error('net')); };\n    document.head.appendChild(s);\n  });\n  return loaded[url];\n}\nconst rand = (n) => Array.from({ length: n }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join('');\nexport const cleanCode = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);\n\nconst ERRORS = {\n  'browser-incompatible': 'Ce navigateur ne permet pas le jeu en ligne. Essaie Chrome, Edge ou Firefox.',\n};\n\n// Lien avec l'autre joueur : send(msg), onMessage, onClose, close(), ping (ms), via ('direct' ou 'relais')\nclass Link {\n  constructor(via) { this.via = via; this.onMessage = () => {}; this.onClose = () => {}; this.ping = 0; this.closed = false; this.lastRx = 0; }\n  start() {\n    this.lastRx = performance.now();\n    // battement de cœur : sans nouvelles depuis 9 s, l'autre ordinateur est parti\n    this.pingT = setInterval(() => { this.send({ k: 'ping', t: performance.now() }); if (performance.now() - this.lastRx > 9000) this.end(); }, 1000);\n  }\n  deliver(msg) {\n    this.lastRx = performance.now();\n    if (!msg || typeof msg !== 'object') return;\n    if (msg.k === 'ping') return this.send({ k: 'pong', t: msg.t });\n    if (msg.k === 'pong') { const p = performance.now() - msg.t; this.ping = this.ping ? this.ping * 0.7 + p * 0.3 : p; return; }\n    this.onMessage(msg);\n  }\n  end() { if (!this.closed) { this.closed = true; clearInterval(this.pingT); this.dispose(); this.onClose(); } }\n  close() { if (!this.closed) { this.closed = true; clearInterval(this.pingT); this.dispose(); } }\n}\n\nclass DirectLink extends Link {\n  constructor(conn, peer) { super('direct'); this.conn = conn; this.peer = peer; }\n  send(msg) { if (this.conn.open) try { this.conn.send(msg); } catch { /* canal fermé */ } }\n  dispose() { try { this.conn.close(); } catch { /* déjà fermée */ } }\n}\n\nclass RelayLink extends Link {\n  constructor(client, outTopic) { super('relais'); this.client = client; this.out = outTopic; }\n  send(msg) { if (this.client.connected) this.client.publish(this.out, JSON.stringify(msg), { qos: 0 }); }\n  dispose() { /* le client MQTT est fermé par la session */ }\n}\n\nasync function relayClients() {\n  await load(MQTT_URL, 'mqtt');\n  return BROKERS.map((b) => window.mqtt.connect(b.url, { connectTimeout: 8000, reconnectPeriod: 2000, clean: true, keepalive: 30,\n    clientId: 'lbh-' + rand(12).toLowerCase(), ...b.opts }));\n}\nconst endAll = (list, keep) => { for (const r of list) if (r !== keep) try { r.end(true); } catch { /* rien */ } };\n\n// ---------- créer une partie ----------\n// h.code(code), h.connected(link), h.error(texte)\nexport async function hostGame(h) {\n  let bound = null, peer = null, relays = [], cancelled = false, shown = false, tries = 0;\n  const c = { code: rand(5) };\n  const cleanup = (keep) => {\n    if (peer && keep !== 'direct') try { peer.destroy(); } catch { /* rien */ }\n    endAll(relays);\n  };\n  const bind = (link) => {\n    if (bound || cancelled) { link.close(); return; }\n    bound = link; link.start();\n    const close0 = link.dispose.bind(link);\n    link.dispose = () => { close0(); cleanup(); };\n    // l'autre moyen de connexion n'est plus utile\n    if (link.via === 'direct') endAll(relays); else endAll(relays, link.client);\n    h.connected(link);\n  };\n  const show = () => { if (!shown && !cancelled) { shown = true; h.code(c.code); } };\n\n  // connexion directe\n  const startPeer = () => {\n    peer = new window.Peer(PREFIX + c.code, { debug: 0 });\n    peer.on('open', show);\n    peer.on('connection', (conn) => {\n      if (bound) { conn.on('open', () => { conn.send({ k: 'full' }); setTimeout(() => conn.close(), 500); }); return; }\n      const link = new DirectLink(conn, peer);\n      conn.on('data', (d) => link.deliver(d));\n      conn.on('close', () => link.end());\n      conn.on('error', () => link.end());\n      conn.on('open', () => bind(link)); // une tentative ratée ne bloque plus les suivantes\n    });\n    peer.on('error', (e) => {\n      if (e.type === 'unavailable-id' && tries++ < 5 && !shown) { peer.destroy(); c.code = rand(5); startPeer(); return; }\n      if (e.type === 'browser-incompatible' && !bound) h.error(ERRORS['browser-incompatible']);\n      // les autres erreurs (serveur de connexion injoignable…) : le relais prend le relais\n    });\n    peer.on('disconnected', () => { if (!bound && !cancelled) try { peer.reconnect(); } catch { /* rien */ } });\n  };\n  // relais\n  const startRelay = async () => {\n    try { relays = await relayClients(); } catch { return; }\n    if (cancelled || bound) { endAll(relays); return; }\n    const inbox = TOPIC + c.code + '/hote';\n    for (const relay of relays) {\n      relay.on('connect', () => { relay.subscribe(inbox, { qos: 0 }); setTimeout(show, 1500); });\n      relay.on('message', (topic, buf) => {\n        let msg; try { msg = JSON.parse(buf.toString()); } catch { return; }\n        if (bound && bound.via === 'relais' && bound.client === relay && msg.gid === bound.gid) { bound.deliver(msg); return; }\n        if (msg.k !== 'hello' || !msg.gid) return;\n        const out = TOPIC + c.code + '/invite/' + msg.gid;\n        if (bound) { if (!(bound.via === 'relais' && msg.gid === bound.gid)) relay.publish(out, JSON.stringify({ k: 'full' })); return; }\n        const link = new RelayLink(relay, out);\n        link.gid = msg.gid;\n        relay.publish(out, JSON.stringify({ k: 'welcome' }));\n        bind(link);\n      });\n    }\n  };\n\n  try { await load(PEER_URL, 'Peer'); startPeer(); } catch { /* PeerJS injoignable : relais seulement */ }\n  startRelay();\n  setTimeout(() => { if (!shown && !cancelled) h.error('Impossible de joindre les serveurs de connexion. Vérifie ta connexion Internet.'); }, 15000);\n  return { cancel: () => { cancelled = true; if (bound) bound.close(); cleanup(); } };\n}\n\n// ---------- rejoindre une partie ----------\n// h.status(texte), h.connected(link), h.error(texte)\nexport async function joinGame(code, h) {\n  let done = false, peer = null, relays = [], relayStarted = false;\n  const ent\n  const ROWS = quality === 'low' ? 6 : 11, STEP = 0.74;\n  const standMat = new THREE.MeshLambertMaterial({ color: 0x191d26, side: THREE.DoubleSide });\n  const seats = [];\n  const sides = [ // centre, axe le long de la bande, direction vers l'extérieur, longueur\n    [0, -W - 1.6, 1, 0, 0, -1, 60], [0, W + 1.6, 1, 0, 0, 1, 60], [-L - 1.6, 0, 0, 1, -1, 0, 24], [L + 1.6, 0, 0, 1, 1, 0, 24],\n  ];\n  for (const [cx0, cz0, ax, az, ox, oz, len] of sides) {\n    const depth = ROWS * 0.95 + 0.6, y0 = boardH + 0.1, y1 = y0 + ROWS * 0.62 + 0.3;\n    const h = len / 2, P = (a, o, y) => [cx0 + ax * a + ox * o, y, cz0 + az * a + oz * o];\n    const q = [P(-h, 0, y0), P(h, 0, y0), P(h, depth, y1), P(-h, depth, y1)];\n    const sg = new THREE.BufferGeometry();\n    sg.setAttribute('position', new THREE.Float32BufferAttribute([...q[0], ...q[1], ...q[2], ...q[0], ...q[2], ...q[3]], 3));\n    sg.computeVertexNormals();\n    g.add(new THREE.Mesh(sg, standMat));\n    for (let r = 0; r < ROWS; r++) for (let a = -h + 0.5; a < h - 0.4; a += STEP) {\n      if (Math.random() < 0.07) continue;\n      seats.push(cx0 + ax * a + ox * (0.5 + r * 0.95), y0 + 0.62 + r * 0.62, cz0 + az * a + oz * (0.5 + r * 0.95));\n    }\n  }\n  const n = seats.length / 3;\n  const fans = new THREE.InstancedMesh(new THREE.BoxGeometry(0.48, 0.78, 0.42), new THREE.MeshLambertMaterial({ color: 0xffffff }), n);\n  const dm = new THREE.Matrix4(), col = new THREE.Color();\n  const phase = new Float32Array(n), baseY = new Float32Array(n);\n  const fanCols = ['#c9ccd4', '#8a8f9c', '#d8b89a', '#3c4a66', '#7a2a30', '#e9e2d0', '#2c2f38'];\n  for (let i = 0; i < n; i++) {\n    dm.makeTranslation(seats[i * 3], seats[i * 3 + 1], seats[i * 3 + 2]); fans.setMatrixAt(i, dm);\n    col.set(home && Math.random() < 0.45 ? home.colors[Math.random() < 0.75 ? 0 : 1] : fanCols[(Math.random() * fanCols.length) | 0]);\n    col.multiplyScalar(0.55 + Math.random() * 0.3);\n    fans.setColorAt(i, col);\n    phase[i] = Math.random(); ba tion.set(0, 1.9, -0.9); z.add(b3);\n    const b4 = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.25, 0.5), new THREE.MeshLambertMaterial({ color: 0x33363d })); b4.position.set(0, 0.15, 0); z.add(b4);\n    z.visible = false; g.add(z); zambonis.push(z);\n  }\n  scene.add(g);\n  return { group: g, nets, crowd, marks, zambonis, cube, iceCanvas: cv, iceTex: tex };\n}\n\n// Niveau d'excitation de la foule : 0 = assise, > 1.2 = debout et en liesse\nexport function updateCrowd(crowd, time, ex) {\n  if (crowd.still) return;\n  if (ex < 0.03 && crowd.level < 0.03) return; // rien à animer\n  crowd.level = ex;\n  const arr = crowd.fans.instanceMatrix.array, { phase, baseY, n } = crowd;\n  const amp = Math.min(0.55, ex * 0.3), stand = ex > 1.2 ? 0.28 : 0;\n  for (let i = 0; i < n; i++) {\n    const ph = phase[i];\n    const k = ph < 0.25 && ex < 1.2 ? 0.2 : 1; // certains restent calmes sauf sur un but\n    arr[i * 16 + 13] = baseY[i] + stand * k + Math.abs(Math.sin(time * (5 + ph * 3) + ph * 40)) * amp * k;\n  }\n  crowd.fans.instanceMatrix.needsUpdate = true;\n}\n\n// Trace de patin entre deux points (en mètres); snow = arrêt brusque / virage serré\nexport function addMark(marks, x0, z0, x1, z1, snow) {\n  if (!marks.on) return;\n  const c = marks.ctx, k = marks.k;\n  const X = (x) => (x + 30.5) * k, Z = (z) => (z + 13) * k;\n  c.lineCap = 'round';\n  if (snow) { c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 2.6; }\n  else { c.strokeStyle = 'rgba(105,135,170,0.16)'; c.lineWidth = 1.1; }\n  c.beginPath(); c.moveTo(X(x0), Z(z0)); c.lineTo(X(x1), Z(z1)); c.stroke();\n  marks.dirty = true;\n}\n\n// Efface les traces à gauche de x (passage de la resurfaceuse); x = Infinity pour tout effacer\nexport function wipeMarks(marks, x) {\n  const px = x === Infinity ? marks.w : Math.max(0, Math.min(marks.w, (x + 30.5) * marks.k));\n  marks.ctx.clearRect(0, 0, px, marks.h);\n  marks.dirty = true;\n}\n", "js/save/profile.js": "// Profil du joueur : succès obtenus et objets débloqués (communs à tous les modes)\nconst KEY = 'hockeyweb.profile.v1';\n\n// Objets cosmétiques par catégorie. Le premier de chaque catégorie est offert au départ.\nexport const ITEMS = {\n  stick: { label: 'Bâton', list: { classic: { name: 'Composite noir', color: '#2b2b30' }, wood: { name: 'Bois d\\'érable', color: '#b98a4e' }, neon: { name: 'Néon', color: '#39ff9c' },\n    blue: { name: 'Bleu glacier', color: '#3aa0ff' }, gold: { name: 'Doré', color: '#e2b93b' } } },\n  gloves: { label: 'Gants', list: { classic: { name: 'Noirs', color: '#1a1a1e' }, white: { name: 'Blancs', color: '#f2f2f2' }, red: { name: 'Rouges', color: '#c8281e' }, gold: { name: 'Dorés', color: '#d4a92a' } } },\n  celeb: { label: 'Célébration de but', list: { classic: { name: 'Poing levé' }, spin: { name: 'Toupie' }, knee: { name: 'Glissade sur un genou' }, jump: { name: 'Sauts de joie' } } },\n  rink: { label: 'Patinoire', list: { classic: { name: 'Aréna de l\\'équipe' }, winter: { name: 'Classique hivernale', ice: '#dbe9f5', boards: '#8a5a33' },\n    night: { name: 'Glace de nuit', ice: '#2b3d57', boards: '#111418' }, aurora: { name: 'Aurore boréale', ice: '#d6f5e8', boards: '#3b2a6b' } } },\n  jersey: { label: 'Chandail', list: { regular: { name: 'Régulier' }, retro: { name: 'Rétro' }, black: { name: 'Noir intégral' }, gold: { name: 'Édition dorée' }, champion: { name: 'Chandail des champions' } } },\n};\nconst FREE = { stick: ['classic'], gloves: ['classic'], celeb: ['classic'], rink: ['classic'], jersey: ['regular', 'retro'] };\n\n// Succès : chacun débloque un objet [catégorie, identifiant]\nexport const ACH = [\n  { id: 'firstWin', name: 'Première victoire', desc: 'Gagne un match.', item: ['stick', 'wood'] },\n  { id: 'hat', name: 'Tour du chapeau', desc: 'Un joueur de ton équipe marque 3 buts dans un match.', item: ['celeb', 'spin'] },\n  { id: 'shutout', name: 'Jeu blanc', desc: 'Gagne sans accorder de but.', item: ['gloves', 'white'] },\n  { id: 'so', name: 'Sang-froid', desc: 'Gagne un match en tirs de barrage.', item: ['celeb', 'knee'] },\n  { id: 'fight', name: 'Dur à cuire', desc: 'Gagne une bagarre.', item: ['gloves', 'red'] },\n  { id: 'five', name: 'Avalanche', desc: 'Marque 5 buts ou plus dans un match.', item: ['stick', 'neon'] },\n  { id: 'wins10', name: 'Dix de suite, ou presque', desc: 'Cumule 10 victoires.', item: ['jersey', 'black'] },\n  { id: 'hard', name: 'Légende', desc: 'Gagne un match au niveau de difficulté le plus élevé.', item: ['jersey', 'gold'] },\n  { id: 'drafted', name: 'Espoir', desc: 'Carrière : fais-toi repêcher.', item: ['stick', 'blue'] },\n  { id: 'ability', name: 'Talent spécial', desc: 'Carrière : débloque une capacité spéciale.', item: ['celeb', 'jump'] },\n  { id: 'bigLeague', name: 'La cour des grands', desc: 'Carrière : atteins la grande ligue.', item: ['rink', 'winter'] },\n  { id: 'level10', name: 'Aguerri', desc: 'Carrière : atteins le niveau 10.', item: ['gloves', 'gold'] },\n  { id: 'trade', name: 'Fin négociateur', desc: 'Franchise : conclus un échange.', item: ['stick', 'gold'] },\n  { id: 'playoffs', name: 'Fièvre du printemps', desc: 'Franchise : qualifie ton équipe pour les séries.', item: ['rink', 'night'] },\n  { id: 'cup', name: 'Champion', desc: 'Franchise : remporte la Coupe Boréale.', item: ['jersey', 'champion'] },\n  { id: 'dynasty', name: 'Dynastie', desc: 'Franchise : remporte deux Coupes Boréale.', item: ['rink', 'aurora'] },\n];\n\nlet P = null;\nconst listeners = [];\nfunction load() {\n  if (P) return P;\n  let raw = null;\n  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { /* stockage indisponible */ }\n  P = { ach: {}, wins: 0, cups: 0, equip: {}, ...(raw && typeof raw === 'object' ? raw : {}) };\n  for (const k of Object.keys(ITEMS)) if (!ITEMS[k].list[P.equip[k]] || !owned(k, P.equip[k])) P.equip[k] = FREE[k][0];\n  return P;\n}\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch { /* stockage indisponible */ } }\n\nexport const profile = () => load();\nexport function owned(cat, id) {\n  if (FREE[cat].includes(id)) return true;\n  const a = ACH.find((x) => x.item[0] === cat && x.item[1] === id);\n  return !!(a && (P || load()).ach[a.id]);\n}\nexport const sourceOf = (cat, id) => ACH.find((x) => x.item[0] === cat && x.item[1] === id) || null;\nexport const equipped = () => ({ ...load().equip });\nexport function equip(cat, id) { if (!owned(cat, id)) return false; load().equip[cat] = id; save(); return true; }\nexport const item = (cat) => ITEMS[cat].list[load().equip[cat]];\nexport const ownedList = (cat) => Object.keys(ITEMS[cat].list).filter((id) => owned(cat, id));\n\n// Débloque un succès (une seule fois) et prévient l'interface\nexport function unlock(id) {\n  const p = load(), a = ACH.find((x) => x.id === id);\n  if (!a || p.ach[id]) return false;\n  p.ach[id] = Date.now(); save();\n  for (const fn of listeners) fn(a, ITEMS[a.item[0]].list[a.item[1]], ITEMS[a.item[0]].label);\n  return true;\n}\nexport function bump(key) { const p = load(); p[key] = (p[key] || 0) + 1; save(); return p[key]; }\nexport const onUnlock = (fn) => listeners.push(fn);\n", "js/save/storage.js": "// Sauvegarde locale (localStorage). Les emplacements de Carrière/Franchise s'ajouteront aux étapes 4 et 5.\nimport { DEFAULT_SETTINGS, DEFAULT_KEYS } from '../core/config.js';\n\nconst KEY = 'hockeyweb.settings.v1';\n\nexport function loadSettings() {\n  try {\n    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');\n    return { ...DEFAULT_SETTINGS, ...raw, keys: { ...DEFAULT_KEYS, ...(raw.keys || {}) } };\n  } catch { return { ...DEFAULT_SETTINGS, keys: { ...DEFAULT_KEYS } }; }\n}\n\n// Équipes modifiées et équipes créées (éditeur d'équipe)\nconst TEAMS_KEY = 'hockeyweb.teams.v1';\nexport function loadTeamData() {\n  try { return JSON.parse(localStorage.getItem(TEAMS_KEY) || 'null'); } catch { return null; }\n}\nexport function saveTeamData(d) {\n  try { localStorage.setItem(TEAMS_KEY, JSON.stringify(d)); return true; } catch { return false; }\n}\n\nexport function saveSettings(s) {\n  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch { /* stockage indisponible */ }\n}\n\n// Carrière : trois emplacements, sauvegarde automatique après chaque match et chaque décision\nexport const CAREER_SLOTS = 3;\nconst careerKey = (slot) => `hockeyweb.career.v1.${slot}`;\nexport function loadCareer(slot) {\n  try { const c = JSON.parse(localStorage.getItem(careerKey(slot)) || 'null'); return c && c.v === 1 && c.season ? c : null; } catch { return null; }\n}\nexport function saveCareer(slot, c) {\n  try { localStorage.setItem(careerKey(slot), JSON.stringify(c)); return true; } catch { return false; }\n}\nexport function deleteCareer(slot) {\n  try { localStorage.removeItem(careerKey(slot)); } catch { /* stockage indisponible */ }\n}\n\n// Franchise : trois emplacements\nexport const SAVE_SLOTS = 3;\nconst franchiseKey = (slot) => `hockeyweb.franchise.v1.${slot}`;\nexport function loadFranchise(slot) {\n  try { const f = JSON.parse(localStorage.getItem(franchiseKey(slot)) || 'null'); return f && f.v === 1 && f.teams ? f : null; } catch { return null; }\n}\nexport function saveFranchise(slot, f) {\n  try { localStorage.setItem(franchiseKey(slot), JSON.stringify(f)); return true; } catch { return false; }\n}\nexport function deleteFranchise(slot) {\n  try { localStorage.removeItem(franchiseKey(slot)); } catch { /* stockage indisponible */ }\n}\n", "js/sim/ai.js": "// IA des patineurs : systèmes d'équipe (échec avant 1-2-2, trappe, homme à homme, sorties de zone,\n// attaque en zone, avantage/désavantage numérique) et décisions du porteur.\nimport { RINK } from '../core/config.js';\nimport { R, hyp, clamp, segDist } from '../core/util.js';\nimport { benchPos } from './entities.js';\n\nconst B = RINK.blueX, GX = RINK.goalX;\nconst PAIR = { LD: 'RW', RD: 'LW', C: 'C', LW: 'RD', RW: 'LD', X: 'X' };\nconst isDef = (b) => b.role === 'LD' || b.role === 'RD';\nconst sideOf = (b) => (b.role === tion nearestOpp(m, team, x, z) {\n  let bd = 1e9;\n  for (const b of m.other(team).skaters) if (b.active) bd = Math.min(bd, hyp(b.x - x, b.z - z));\n  return bd;\n}\n\nexport function updateGoalie(m, g, dt) {\n  const t = g.team, p = m.puck, a = g.p.a;\n  const { goalX, netHW } = RINK;\n  const s = -t.dir, nx = s * goalX;\n  const sk = m.gkBonus(g);\n  const hu = g.human && g.gc; // gardien contrôlé par le joueur (Carrière)\n  g.down = Math.max(0, g.down - dt);\n  g.dive = Math.max(0, g.dive - dt);\n  g.diveCd = Math.max(0, (g.diveCd || 0) - dt);\n  // papillon tenu : à genoux tant que la touche est enfoncée; relâchée : il se relève vite\n  if (hu && g.dive <= 0) { if (g.gc.fly) g.down = Math.max(g.down, 0.5); else if (g.down > 0.2 && g.down <= 0.5) g.down = 0.2; }\n  g.saveAnim = Math.max(0, g.saveAnim - dt);\n  g.pickupCd = Math.max(0, g.pickupCd - dt);\n  g.vx = g.vz = 0;\n\n  if (p.carrier === g) {\n    g.holdT += dt;\n    const od = nearestOpp(m, t, g.x, g.z);\n    if (m.special) { if (g.holdT > 0.3) m.attemptOver('save'); return; }\n    if (hu) { // le joueur choisit : passe, dégagement ou geler; sinon on gèle quand ça presse\n      if (g.holdT > 3 || (g.holdT > 1.2 && od < 1.6)) goalieFreeze(m, g);\n      return;\n    }\n    if (g.holdT > 0.5 && od < 3.4) { goalieFreeze(m, g); return; }\n    if (g.holdT > 0.9) {\n      let best = null, bs = -1e9;\n      for (const b of t.skaters) {\n        if (!b.active || b.stun > 0) continue;\n        const d = hyp(b.x - g.x, b.z - g.z);\n        if (d < 3 || d > 22) continue;\n        const sc = Math.min(6, nearestOpp(m, t, b.x, b.z)) - d * 0.12;\n        if (sc > bs) { bs = sc; best = b; }\n      }\n      if (best && bs > 1.5) m.pass(g, best, false);\n      else if (g.holdT > 2) goalieFreeze(m, g);\n    }\n    return;\n  }\n  g.holdT = 0;\n\n  const sp = hyp(p.vx, p.vz);\n  let tx, tz, spd = 3 + 2.6 * (a.pos + sk) / 100;\n  let threat = null;\n  if (!p.carrier && sp > 9 && p.vx * s > 0.2 * sp) {\n    const tt = (nx - p.x) / p.vx;\n    if (tt > 0 && tt < 1.6) {\n      const zc = p.z + p.vz * tt;\n      if (Math.abs(zc) < netHW + 0.7) threat = { tt, zc, yc: Math.max(0, p.y + p.vy * tt - 0.5 * G * tt * tt) };\n    }\n  }\n  if (threat) {\n    if (!g.track || g.track.seq !== p.seq) {\n      let screens = 0;\n      for (const tm of m.teams) for (const b of tm.skaters) {\n        if (!b.active || (p.shot && b === p.shot.by)) continue;\n        if (segDist(b.x, b.z, p.x, p.z, nx, 0) < 0.55 && hyp(b.x - p.x, b.z - p.z) > 1.2) screens++;\n      }\n      const react = (0.085 + 0.19 * (1 - (a.ref + sk) / 100)) * R.r(0.75, 1.4) + Math.min(2, screens) * 0.05;\n      g.track = { seq: p.seq, at: m.time + react, d0: hyp(p.x - nx, p.z) };\n    }\n    if (m.time >= g.track.at) {\n      const tp = (g.x - p.x) / p.vx;\n      const zg = clamp(p.z + p.vz * tp, -netHW - 0.2, netHW + 0.2);\n      // gardien humain : ses réflexes l'aident un peu à suivre le tir, mais le placement reste le sien\n      const ls = (4 + 3.5 * (a.ref + sk) / 100) * (g.down > 0 ? 0.6 : 1) * (hu ? (m.abOn(g.p, 'wall') ? 0.9 : 0.4) : 1);\n      const dz = zg - g.z;\n      g.z += clamp(dz, -ls * dt, ls * dt);\n      if (!hu && g.down <= 0 && (threat.yc < 0.75 || g.track.d0 < 9)) g.down = 1.0;\n    }\n    if (!hu) { g.face = Math.atan2(p.z - g.z, p.x - g.x); return; }\n  } else g.track = null;\n\n  if (hu) { humanMove(m, g, dt); return; }\n\n  [tx, tz] = anglePoint(m, g);\n  // sortie pour jouer une rondelle libre\n  if (!p.carrier && sp < 4.5 && p.y < 0.3 && m.state === 'play' && !m.special) {\n    const dn = hyp(p.x - nx, p.z), dg = hyp(p.x - g.x, p.z - g.z);\n    const od = nearestOpp(m, t, p.x, p.z);\n    if (dn < 5.5 && od > 4.5 && dg < od - 1.5 && Math.abs(p.x) < RINK.L - 1) { tx = p.x; tz = p.z; spd *= 1.3; }\n  }\n  if (g.down > 0) spd *= 0.5;\n  const dx = tx - g.x, dz = tz - g.z, d = hyp(dx, dz);\n  if (d > 0.01) {\n    const st = Math.min(d, spd * dt);\n    g.vx = (dx / d) * st / dt; g.vz = (dz / d) * st / dt;\n    g.x += (dx / d) * st; g.z += (dz / d) * st;\n  }\n  g.face = Math.atan2(p.z - g.z, p.x - g.x);\n  // couvrir une rondelle lente à portée\n  if (!p.carrier && g.pickupCd <= 0 && sp < 8 && p.y < 0.5 && hyp(p.x - g.x, p.z - g.z) < 0.8) m.gain(g);\n}\n\n// Point idéal sur l'angle (entre la rondelle et le centre du filet)\nfunction anglePoint(m, g) {\n  const p = m.puck, s = -g.team.dir, nx = s * RINK.goalX;\n  const front = (p.x - nx) * -s; // distance de la rondelle devant la ligne de but\n  if (front < 0.3) return [nx - s * 0.3, Math.abs(p.z) > RINK.netHW ? sign(p.z) * 0.7 : p.z * 0.5];\n  const dx = p.x - nx, dz = p.z, d = hyp(dx, dz) || 1, depth = clamp(0.45 + d * 0.05, 0.6, 1.5);\n  return [nx + (dx / d) * depth, (dz / d) * depth];\n}\n\n// Déplacement du gardien humain : il suit l'angle de lui-même; les touches le décalent\n// (sortir au-devant du tireur, tricher d'un côté) et Sprint + direction l'envoie jouer la rondelle plus loin.\nfunction humanMove(m, g, dt) {\n  const c = g.gc, a = g.p.a, p = m.puck, s = -g.team.dir, nx = s * RINK.goalX;\n  let vx = 0, vz = 0;\n  if (g.dive > 0) {\n    const v = 3 + 6.5 * (g.dive / 0.45);\n    vx = g.diveX * v; vz = g.diveZ * v;\n  } else {\n    const [ax, az] = anglePoint(m, g), reach = c.fast ? 4 : 1.3;\n    const tx = ax + c.mx * reach, tz = az + c.mz * reach;\n    const spd = (3 + 2.6 * (a.pos + m.gkBonus(g)) / 100 + (a.acc - 50) * 0.012) * (c.fast ? 1.6 : 1) * (g.down > 0 ? 0.55 : 1);\n    const dx = tx - g.x, dz = tz - g.z, d = hyp(dx, dz);\n    if (d > 0.01) { const v = Math.min(spd, d / dt); vx = (dx / d) * v; vz = (dz / d) * v; }\n  }\n  let fx = (g.x + vx * dt - nx) * -s, z = g.z + vz * dt;\n  // devant sa ligne de but (jamais dans le filet), à moins de 6 m du filet\n  const r = hyp(fx, z);\n  if (r > 6) { fx *= 6 / r; z *= 6 / r; }\n  z = clamp(z, -RINK.W + 1, RINK.W - 1);\n  fx = Math.abs(z) < RINK.netHW + 0.35 ? Math.max(0.15, fx) : Math.max(-0.4, fx);\n  const x = nx - s * fx;\n  g.vx = (x - g.x) / dt; g.vz = (z - g.z) / dt;\n  g.x = x; g.z = z;\n  g.face = Math.atan2(p.z - g.z, p.x - g.x);\n  if (!p.carrier && g.pickupCd <= 0 && hyp(p.vx, p.vz) < 8 && p.y < 0.5 && hyp(p.x - g.x, p.z - g.z) < 0.8) m.gain(g);\n}\n\n// Geler la rondelle (ou couvrir une rondelle libre tout près) : arrêt de jeu, mise au jeu dans la zone\nexport function goalieFreeze(m, g) {\n  const p = m.puck;\n  if (m.state !== 'play') return false;\n  if (p.carrier !== g) {\n    if (p.carrier || p.y > 0.6 || hyp(p.vx, p.vz) > 12 || hyp(p.x - g.x, p.z - g.z) > 1.4) return false;\n    m.gain(g);\n    if (p.carrier !== g) return false;\n  }\n  if (m.special) { m.attemptOver('save'); return true; }\n  g.p.st.fz = (g.p.st.fz || 0) + 1;\n  m.stopPlay('freeze', zoneDot(-g.team.dir, g.z));\n  return true;\n}\n\n// Plongeon latéral (direction = touches; sinon vers la rondelle)\nexport function goalieDive(m, g, mx, mz) {\n  if (g.dive > 0 || g.diveCd > 0 || m.puck.carrier === g) return false;\n  let dx = mx, dz = mz;\n  if (hyp(dx, dz) < 0.2) { dx = 0; dz = sign(m.puck.z - g.z) || 1; }\n  const d = hyp(dx, dz);\n  g.diveX = dx / d; g.diveZ = dz / d; g.dive = 0.45; g.diveCd = 1.3; g.down = 1.0;\n  // côté du plongeon vu par le gardien (pour l'animation)\n  const side = -g.diveX * Math.sin(g.face) + g.diveZ * Math.cos(g.face);\n  g.saveAnim = 0.6; g.saveSide = sign(side) || 1; g.diveSide = side;\n  return true;\n}\n\n// Appelé à chaque pas de la rondelle : tente l'arrêt quand elle traverse le plan du gardien\nexport function trySave(m, g, x0, y0, z0) {\n  const p = m.puck;\n  if (p.carrier) return;\n  const s = -g.team.dir;\n  if (p.vx * s <= 0) return;\n  if (!((x0 - g.x) * s < 0 && (p.x - g.x) * s >= 0)) return;\n  const t = (g.x - x0) / (p.x - x0 || 1e-9);\n  const zc = z0 + (p.z - z0) * t, yc = y0 + (p.y - y0) * t;\n  const dz = zc - g.z, adz = Math.abs(dz);\n  if (adz > 1.6 || yc > 2.1) return;\n  const sp = Math.hypot(p.vx, p.vy, p.vz);\n  const a = g.p.a, sk = m.gkBonus(g);\n  if (sp < 9) {\n    if (adz < 0.7 && yc < 0.6 && g.pickupCd <= 0) { p.x = g.x - s * 0.2; p.z = zc; m.gain(g); }\n    return;\n  }\n  const { goalX, netHW, netH } = RINK;\n  const tg = (s * goalX - g.x) / p.vx;\n  const zl = zc + p.vz * tg, yl = Math.max(0, yc + p.vy * tg - 0.5 * G * tg * tg);\n  const onNet = Math.abs(zl) < netHW && yl < netH;\n  const since = g.track && g.track.seq === p.seq ? m.time - g.track.at : -0.1;\n  const limb = 3.2 + 3.2 * (a.ref + sk) / 100;\n  const ext = clamp(since * limb, 0, 0.7);\n  const down = g.down > 0;\n  let cover;\n  if (down) cover = yc < 0.5 ? 0.64 + ext * 0.5 : yc < 1.05 ? 0.34 + ext : yc < 1.35 ? ext * 0.9 : -1;\n  else cover = yc < 0.35 ? 0.3 + ext * 0.85 : yc < 1.5 ? 0.34 + ext : yc < 1.85 ? 0.2 : -1;\n  cover += R.g() * 0.07 + (a.pos + sk - 70) * 0.004;\n  const wall = m.abOn(g.p, 'wall');\n  if (g.dive > 0 && yc < 1.1 && sign(dz) === sign(g.diveZ)) cover += 0.5; // plongeon du bon côté\n  if (wall) cover += 0.25;\n  if (!down && !wall && yc < 0.3 && adz < 0.16 && R.chance(0.12)) cover = -1; // entre les jambières\n  if (adz > cover) return;\n\n  // ARRÊT\n  const shooter = p.shot ? p.shot.by : null;\n  if (onNet) m.creditShot(shooter, g);\n  const gloveZ = g.p.d.hand;\n  const type = yc < 0.45 ? 'jambières' : adz < 0.3 ? 'corps' : sign(dz) === gloveZ ? 'mitaine' : 'bouclier';\n  g.saveAnim = 0.6; g.saveSide = sign(dz);\n  p.x = g.x - s * 0.35; p.z = zc; p.y = yc;\n  p.shot = null; p.pass = null; p.rel = null; p.seq++;\n  const caught = (m.abOn(g.p, 'glue') && R.chance(0.92)) || (type === 'mitaine' && R.chance(0.75)) || (type === 'corps' && R.chance(0.5 + a.pos / 400)) || (sp < 15 && R.chance(0.5));\n  if (caught) {\n    p.vx = p.vy = p.vz = 0;\n    m.emit('save', { goalie: g, type, shooter, caught: true, onNet });\n    m.gain(g);\n    return;\n  }\n  const controlled = R.chance(0.3 + (a.pos + sk) / 260);\n  const ang = (controlled ? R.r(0.95, 1.45) : R.r(0, 0.8)) * (R.chance(0.75) ? sign(dz) : -sign(dz));\n  const out = sp * R.r(0.12, 0.3);\n  p.vx = -s * Math st t of this.teams) if (t.goalie.active) { updateGoalie(this, t.goalie, dt); if (this.state !== 'play') return; }\n    this.physics(dt);\n    if (this.state !== 'play') return;\n    this.puckStep(dt);\n    if (this.state !== 'play') return;\n    if (sp) { this.stepSpecial(dt); return; }\n    if (this.mode === 'practice') return;\n    this.checkOffside(); if (this.state !== 'play') return;\n    this.checkIcing(); if (this.state !== 'play') return;\n    this.lineLogic(dt);\n    if (this.clock <= 60 && !this.lmFlag) { this.lmFlag = true; this.emit('lastMinute', { period: this.period }); }\n    // échappée : porteur lancé sans défenseur devant lui\n    this.bkT = (this.bkT || 0) - dt;\n    if (this.bkT <= 0) {\n      this.bkT = 0.25;\n      const c = this.puck.carrier;\n      if (c && !c.isGoalie && !c.bk) {\n        const t = c.team, fx = c.x * t.dir;\n        if (fx > 1 && fx < 18 && hyp(c.vx, c.vz) > 5 && !this.other(t).skaters.some((q) => q.active && (q.x * t.dir > fx + 0.5 || hyp(q.x - c.x, q.z - c.z) < 4.5))) {\n          c.bk = true; this.emit('breakaway', { by: c });\n        }\n      }\n    }\n    if (this.clock <= 0) { this.clock = 0; this.endPeriod(); }\n  }\n\n  step(dt) {\n    this.time += dt;\n    const st = this.state;\n    if (st === 'play') this.stepPlay(dt);\n    else if (st === 'faceoff') this.stepFaceoff(dt);\n    else if (st === 'fight') this.stepFight(dt);\n    else if (st === 'final') this.coast(dt);\n    else {\n      this.coast(dt);\n      this.stateT -= dt;\n      if (this.stateT <= 0 && this.next) { const n = this.next; this.next = null; n(); }\n    }\n    if (this.lockPl) this.setUser(null); // suit le joueur verrouillé au fil des changements\n  }\n}\n", "js/sim/puck.js": "// Physique de la rondelle : glisse, vol, rebonds (bandes, baie vitrée, poteaux, filet), buts\nimport { RINK, G } from '../core/config.js';\nimport { R, hyp } from '../core/util.js';\nimport { constrain, isOutside } from './rink.js';\nimport { trySave } from './goalie.js';\n\nexport function makePuck() {\n  return {\n    x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,\n    carrier: null, shot: null, pass: null, rel: null, lastTeam: null,\n    rolling: 0, curl: 0, inNet: 0, seq: 0, spin: 0,\n  };\n}\n\nexport function setRolling(p, t) {\n  p.rolling = t; p.curl = R.r(-0.5, 0.5);\n}\n\nexport function stepPuck(m, dt) {\n  const p = m.puck;\n  const { goalX, netHW, netH, netD, boardH, glassH } = RINK;\n  const x0 = p.x, y0 = p.y, z0 = p.z;\n  const live = m.state === 'play' || m.live;\n\n  if (p.y > 0 || p.vy > 0) {\n    p.vy -= G * dt;\n    const k = 1 - 0.03 * dt; p.vx *= k; p.vz *= k;\n  } else {\n    const sp = hyp(p.vx, p.vz);\n    if (sp > 0) {\n      const dec = (p.rolling > 0 ? 0.55 : 1.25) + 0.0035 * sp * sp;\n      const ns = Math.max(0, sp - dec * dt);\n      p.vx *= ns / sp; p.vz *= ns / sp;\n      if (p.rolling > 0) { // rondelle sur la tranche : trajectoire qui courbe\n        const a = p.curl * dt, c = Math.cos(a), s = Math.sin(a);\n        const vx = p.vx * c - p.vz * s; p.vz = p.vx * s + p.vz * c; p.vx = vx;\n        p.rolling -= dt; if (ns < 1.5) p.rolling = 0;\n      }\n    }\n  }\n  p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;\n  p.spin += hyp(p.vx, p.vz) * dt * 3;\n  if (p.y < 0) {\n    p.y = 0;\n    if (p.vy < -2.2) { p.vy = -p.vy * 0.28; p.vx *= 0.9; p.vz *= 0.9; if (R.chance(0.2)) setRolling(p, R.r(0.8, 2)); }\n    else p.vy = 0;\n  }\n\n  if (p.inNet) { // rondelle prise dans le filet\n    const s = p.inNet, ax = p.x * s;\n    if (ax > goalX + netD - 0.08) { p.x = s * (goalX + netD - 0.08); p.vx *= -0.1; p.vz *= 0.3; }\n    if (ax < goalX + 0.02) { p.x = s * (goalX + 0.02); p.vx *= -0.1; }\n    if (Math.abs(p.z) > netHW - 0.06) { p.z = Math.sign(p.z) * (netHW - 0.06); p.vz *= -0.1; p.vx *= 0.3; }\n    if (p.y > netH - 0.1) { p.y = netH - 0.1; p.vy = 0; }\n    return;\n  }\n\n  // arrêts des gardiens (avant la ligne de but)\n  if (live) for (const t of m.teams) if (t.goalie.active) trySave(m, t.goalie, x0, y0, z0);\n\n  // franchissement de la ligne de but\n  for (const s of [-1, 1]) {\n    const gx = s * goalX;\n    if ((x0 - gx) * s < 0 && (p.x - gx) * s >= 0) {\n      const t = (gx - x0) / (p.x - x0 || 1e-9);\n      const zc = z0 + (p.z - z0) * t, yc = y0 + (p.y - y0) * t, az = Math.abs(zc);\n      if (az < netHW - 0.04 && yc < netH - 0.04) {\n        p.inNet = s; p.vx *= 0.4; p.vz *= 0.4; p.vy *= 0.4;\n        if (live) m.onGoal(s);\n      } else if (az < netHW + 0.1 && yc < netH + 0.07) {\n        // poteau ou barre horizontale\n        const bar = az < netHW - 0.04;\n        p.x = gx - s * 0.03; p.z = zc; p.y = yc;\n        p.vx = -p.vx * R.r(0.35, 0.65);\n        if (bar) p.vy = R.r(1, 5); else p.vz += Math.sign(zc) * R.r(2, 7);\n        p.seq++; p.shot = null;\n        if (R.chance(0.5)) setRolling(p, R.r(1, 2.5));\n        m.emit('post', { bar });\n      } else if (p.shot && live) { // lancer raté\n        m.emit('miss', { by: p.shot.by, high: yc >= netH });\n      }\n    }\n  }\n\n  // côtés, dessus et arrière du filet (de l'extérieur)\n  const ax = Math.abs(p.x), sgn = p.x < 0 ? -1 : 1;\n  if (ax > goalX && ax < goalX + netD && Math.abs(p.z) < netHW && p.y < netH) {\n    const ax0 = Math.abs(x0);\n    if (Math.abs(z0) >= netHW) { p.z = Math.sign(z0) * (netHW + 0.01); p.vz = -p.vz * 0.25; p.vx *= 0.7; }\n    else if (ax0 >= goalX + netD) { p.x = sgn * (goalX + netD + 0.01); p.vx = -p.vx * 0.25; p.vz *= 0.7; }\n    else if (y0 >= netH) { p.y = netH; p.vy = Math.abs(p.vy) * 0.2; p.vx *= 0.8; p.vz *= 0.8; }\n    else { p.x = x0; p.z = z0; p.vx *= -0.2; p.vz *= -0.2; }\n    p.seq++;\n  }\n\n  // bandes et baie vitrée\n  if (p.y > glassH) {\n    if (isOutside(p.x, p.z, 0)) { if (live) m.puckOut(); else { p.vx = p.vz = 0; p.x = x0; p.z = z0; } }\n  } else {\n    const hit = constrain(p, 0.05, p.y > boardH ? 0.72 : 0.55);\n    if (hit > 1.5) {\n      p.seq++;\n      if (hit > 4) m.emit('board', { v: hit, glass: p.y > boardH });\n      if (hit > 10 && R.chance(0.25)) setRolling(p, R.r(1, 2.5));\n    }\n  }\n}\n", "js/sim/rink.js": "// Géométrie de la patinoire : collisions avec les bandes, zones, points de mise au jeu\nimport { RINK, DOTS } from '../core/config.js';\n\n// Contraint un objet {x,z,vx,vz} de rayon r à l'intérieur des bandes. Retourne la vitesse d'impact.\nexport function constrain(o, r, e) {\n  const { L, W, R: CR } = RINK;\n  let hit = 0;\n  const sx = o.x < 0 ? -1 : 1, sz = o.z < 0 ? -1 : 1;\n  const ax = Math.abs(o.x), az = Math.abs(o.z);\n  const cx = L - CR, cz = W - CR;\n  if (ax > cx && az > cz) {\n    const dx = ax - cx, dz = az - cz;\n    const d = Math.hypot(dx, dz);\n    if (d > CR - r) {\n      const nx = -(dx / d) * sx, nz = -(dz / d) * sz;\n      const k = (CR - r) / d;\n      o.x = sx * (cx + dx * k); o.z = sz * (cz + dz * k);\n      const vn = o.vx * nx + o.vz * nz;\n      if (vn < 0) { o.vx -= (1 + e) * vn * nx; o.vz -= (1 + e) * vn * nz; hit = -vn; }\n    }\n  } else {\n    if (ax > L - r) { o.x = sx * (L - r); if (o.vx * sx > 0) { hit = Math.abs(o.vx); o.vx = -o.vx * e; } }\n    if (az > W - r) { o.z = sz * (W - r); if (o.vz * sz > 0) { hit = Math.max(hit, Math.abs(o.vz)); o.vz = -o.vz * e; } }\n  }\n  return hit;\n}\n\nexport function isOutside(x, z, r = 0) {\n  const { L, W, R: CR } = RINK;\n  const ax = Math.abs(x), az = Math.abs(z);\n  const cx = L - CR, cz = W - CR;\n  if (ax > cx && az > cz) return Math.hypot(ax - cx, az - cz) > CR - r;\n  return ax > L - r || az > W - r;\n}\n\n// Distance approximative à la bande la plus proche\nexport function boardDist(x, z) {\n  const { L, W, R: CR } = RINK;\n  const ax = Math.abs(x), az = Math.abs(z);\n  const cx = L - CR, cz = W - CR;\n  if (ax > cx && az > cz) return CR - Math.hypot(ax - cx, az - cz);\n  return Math.min(L - ax, W - az);\n}\n\n// Empêche un patineur d'entrer dans le filet\nexport function keepOutOfNet(b, r) {\n  const { goalX, netD, netHW } = RINK;\n  const ax = Math.abs(b.x), s = b.x < 0 ? -1 : 1;\n  const x0 = goalX - r * 0.3, x1 = goalX + netD + r, zw = netHW + r;\n  if (ax > x0 && ax < x1 && Math.abs(b.z) < zw) {\n    const pf = ax - x0, pb = x1 - ax, pz = zw - Math.abs(b.z);\n    if (pz <= pf && pz <= pb) { b.z = (b.z < 0 ? -1 : 1) * zw; b.vz *= 0.3; }\n    else if (pf < pb) { b.x = s * x0; b.vx *= 0.3; }\n    else { b.x = s * x1; b.vx *= 0.3; }\n  }\n}\n\nexport function nearestDot(list, x, z) {\n  let best = list[0], bd = 1e9;\n  for (const d of list) { const q = Math.hypot(d.x - x, d.z - z); if (q < bd) { bd = q; best = d; } }\n  return best;\n}\n\n// Point de mise au jeu dans une zone d'extrémité (side = signe de x) du côté de z\nexport const zoneDot = (side, z) => ({ x: side * 20.5, z: z < 0 ? -6.7 : 6.7 });\nexport const neutralDot = (side, z) => ({ x: side * 6.1, z: z < 0 ? -6.7 : 6.7 });\nexport { DOTS };\n", "js/ui/careerui.js": "// Écrans du mode Carrière : emplacements, création du joueur, tableau de bord, repêchage, contrats\nimport * as C from '../career/career.js';\nimport { leagueTeams, LEAGUES } from '../career/leagues.js';\nimport { loadCareer, saveCareer, deleteCareer, CAREER_SLOTS } from '../save/storage.js';\nimport { F_STYLES, D_STYLES, G_STYLES, POS_LABELS, ATTRS, ATTR_LABELS } from '../data/teams.js';\n\n// Attributs montrés pour un gardien\nconst G_SHOW = ['ref', 'pos', 'acc', 'end', 'pas'];\nconst svLine = (st) => `${st.sv || 0} arrêts sur ${st.sa || 0} tirs (${C.fmtSv(st)}) · ${st.ga || 0} but${st.ga > 1 ? 's' : ''} accordé${st.ga > 1 ? 's' : ''}`;\nimport { kitFor, logoCanvas, logoImg } from '../data/kit.js';\nimport { Preview3D } from '../render/preview.js';\nimport { unlock } from '../save/profile.js';\nimport { TOUCH } from '../engine/input.js';\n\nconst esc = (s) => String(s).replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst money = (x) => `${x.toFixed(2).replace('.', ',')} M$`;\nconst ord = (n) => (n === 1 ? '1er' : n + 'e');\nconst mmss = (s) => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };\nconst bar = (v, cls = '') => `<div class=\"cbar ${cls}\"><i style=\"width:${Math.round(Math.max(0, Math.min(1, v)) * 100)}%\"><\/i><\/div>`;\nconst LG = ['JUN', 'MIN', 'GDE'];\n\nexport class CareerUI {\n  constructor(ui) { this.ui = ui; this.c = null; this.slot = 0; this.tab = 'home'; }\n  save() { saveCareer(this.slot, this.c); }\n\n  // ---------- emplacements de sauvegarde ----------\n  slots() {\n    const ui = this.ui;\n    ui.back = () => ui.main();\n    const cards = [];\n    for (let i = 0; i < CAREER_SLOTS; i++) {\n      const c = loadCareer(i);\n      if (!c) { cards.push(`<div class=\"slot empty\"><h3>Emplacement ${i + 1}<\/h3><p class=\"dim\">Vide<\/p><button data-new=\"${i}\">Nouvelle carrière<\/button><\/div>`); continue; }\n      const t = leagueTeams(c.season.lg)[c.season.team], T = C.totals(c);\n      cards.push(`<div class=\"slot\" style=\"--c1:${t.colors[0]}\"><h3>${esc(c.name)} <small>#${c.num} · ${c.pos}<\/small><\/h3>\n        <p>${logoImg(t, 'lg-s')} ${esc(t.city)} ${esc(t.name)}<\/p>\n        <p class=\"dim\">${LEAGUES[c.season.lg].short} · saison ${c.year} · ${c.age} ans · cote ${C.ovr(c)}<\/p>\n        <p class=\"dim\">${T.gp} PJ · ${c.pos === 'G' ? `${C.fmtSv(T)} · ${T.so} BL` : `${T.g} B · ${T.a} A`}<\/p>\n        <button data-load=\"${i}\" ${cards.some((x) => x.includes('data-focus')) ? '' : 'data-focus'} class=\"primary\">Continuer<\/button><button data-del=\"${i}\">Effacer<\/button><\/div>`);\n    }\n    ui.show(`<h1>Carrière<\/h1><div class=\"slots\">${cards.join('')}<\/div>\n      <div class=\"row\"><button data-a=\"back\">Retour<\/button><\/div>\n      <div class=\"foot\">La carrière est sauvegardée automatiquement après chaque match et chaque décision.<\/div>`, 'career');\n    ui.on('[data-new]', (n) => this.create(+n.dataset.new));\n    ui.on('[data-load]', (n) => { this.slot = +n.dataset.load; this.c = loadCareer(this.slot); this.tab = 'home'; this.route(); });\n    ui.on('[data-del]', (n) => {\n      if (n.dataset.sure) { deleteCareer(+n.dataset.del); this.slots(); } else { n.dataset.sure = 1; n.textContent = 'Confirmer l\\'effacement'; }\n    });\n    ui.on('[data-a]', () => ui.main());\n  }\n\n  // ---------- création du joueur ----------\n  create(slot, f) {\n    const ui = this.ui, teams = leagueTeams(0);\n    f = f || { name: '', num: 9, pos: 'C', style: 'Marqueur', hand: -1, team: 0, skin: 1, tape: 0, h: 1, w: 1 };\n    ui.back = () => this.slots();\n    const styles = f.pos === 'G' ? G_STYLES : f.pos === 'D' ? D_STYLES : F_STYLES;\n    if (!styles.includes(f.style)) f.style = styles[0];\n    const look = () => ({ skin: C.LOOKS.skin[f.skin][0], tape: C.LOOKS.tape[f.tape][0], h: C.LOOKS.h[f.h][0], w: C.LOOKS.w[f.w][0] });\n    const sel = (k, opts) => `<select data-f=\"${k}\">${opts.map(([v, l]) => `<option value=\"${esc(v)}\" ${String(v) === String(f[k]) ? 'selected' : ''}>${esc(l)}<\/option>`).join('')}<\/select>`;\n    const idx = (k) => C.LOOKS[k].map((o, i) => [i, o[1]]);\n    const t = teams[f.team];\n    ui.show(`<h1>Crée ton joueur<\/h1>\n      <div class=\"create\">\n        <div class=\"col\">\n          <h4>Identité<\/h4>\n          <label>Nom <input type=\"text\" data-t=\"name\" maxlength=\"22\" placeholder=\"Prénom Nom\" value=\"${esc(f.name)}\" data-focus><\/label>\n          <label>Numéro <input type=\"number\" data-t=\"num\" min=\"1\" max=\"99\" value=\"${f.num}\"><\/label>\n          <label>Position ${sel('pos', ['C', 'LW', 'RW', 'D', 'G'].map((p) => [p, POS_LABELS[p]]))}<\/label>\n          <label>Style ${sel('style', styles.map((s) => [s, s]))}<\/label>\n          <label>${f.pos === 'G' ? 'Mitaine' : 'Lancer'} ${sel('hand', f.pos === 'G' ? [[-1, 'Main gauche'], [1, 'Main droite']] : [[-1, 'Gaucher'], [1, 'Droitier']])}<\/label>\n          <h4>Apparence<\/h4>\n          <label>Teint ${sel('skin', idx('skin'))}<\/label>\n          <label>Taille ${sel('h', idx('h'))}<\/label>\n          <label>Gabarit ${sel('w', idx('w'))}<\/label>\n          <label>Ruban du bâton ${sel('tape', idx('tape'))}<\/label>\n        <\/div>\n        <div class=\"col mid\"><div data-pv class=\"pv\"><\/div><p class=\"dim\">${esc(f.style)} · ${POS_LABELS[f.pos]}<\/p><\/div>\n        <div class=\"col\">\n          <h4>Équipe junior<\/h4>\n          <label>Équipe ${sel('team', teams.map((q, i) => [i, `${q.city} ${q.name}`]))}<\/label>\n          <p>${logoImg(t, 'lg-l')}<\/p>\n          <p class=\"dim\">${LEAGUES[0].name} · 14 matchs. ${f.pos === 'G' ? 'Tu commences à 17 ans comme gardien partant. Fais des arrêts pour te faire repêcher en fin de saison.' : `Tu commences à 17 ans sur le 2e ${f.pos === 'D' ? 'duo' : 'trio'}. Joue bien pour monter dans l'alignement et te faire repêcher en fin de saison.`}<\/p>\n          <p class=\"dim\">${f.pos === 'G' ? 'Tu contrôles ton gardien, vu de derrière le filet : glisse, papillon, plongeon, geler la rondelle et relances.' : `Dans ce mode, tu ne contrôles que ton joueur. Sur le banc, le match avance en accéléré; ${TOUCH.on ? 'le bouton ⏩' : 'une touche'} te permet de sauter jusqu'à ta prochaine présence.`}<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"row\"><button data-a=\"go\" class=\"primary\">Commencer la carrière<\/button><button data-a=\"back\">Retour<\/button><\/div>`, 'career');\n    try {\n      this.pv = this.pv || new Preview3D();\n      ui.el.querySelector('[data-pv]').appendChild(this.pv.canvas);\n      this.pv.setKit({ ...kitFor(t, 'home'), logo: logoCanvas(t) }, f.num, look(), f.pos === 'G');\n    } catch { ui.el.querySelector('[data-pv]').textContent = 'Aperçu 3D indisponible sur cet appareil.'; }\n    const read = () => {\n      f.name = ui.el.querySelector('[data-t=\"name\"]').value;\n      f.num = Math.max(1, Math.min(99, Math.round(+ui.el.querySelector('[data-t=\"num\"]').value) || 9));\n    };\n    ui.on('[data-f]', (n) => {\n      read();\n      const k = n.dataset.f; f[k] = k === 'pos' || k === 'style' ? n.value : +n.value;\n      if (k === 'pos' && n.value === 'G' && f.num === 9) f.num = 30;\n      this.create(slot, f);\n      const again = ui.el.querySelector(`[data-f=\"${k}\"]`); if (again) again.focus();\n    }, 'change');\n    ui.on('[data-t=\"num\"]', () => { read(); this.create(slot, f); const n = ui.el.querySelector('[data-t=\"num\"]'); n.focus(); }, 'change');\n    ui.on('[data-a]', (n) => {\n      if (n.dataset.a === 'back') return this.slots();\n      read();\n      const name = f.name.trim().replace(/\\s+/g, ' ') || 'Alex Recrue';\n      this.slot = slot; this.tab = 'home';\n      this.c = C.newCareer({ name, num: f.num, pos: f.pos, style: f.style, hand: f.hand, look: look(), team: f.team });\n      this.save(); this.route();\n    });\n  }\n\n  // Affiche l'écran qui correspond à la phase de la carrière\n  route() {\n    const p = this.c.phase, c = this.c;\n    // succès\n    if (c.drafted) unlock('drafted');\n    if (c.season.lg === 2) unlock('bigLeague');\n    if (c.level >= 10) unlock('level10');\n    if (C.unlocked(c).length) unlock('ability');\n    if (p === 'end') this.seasonEnd(); else if (p === 'draft') this.draft(); else if (p === 'contract') this.contract(); else this.hub();\n  }\n\n  head() {\n    const c = this.c, t = C.myTeam(c), ct = c.contract;\n    const deal = ct.type === 'junior' ? 'Junior · admissible au repêchage' : `${money(ct.salary)} · ${ct.years} an${ct.years > 1 ? 's' : ''} restant${ct.years > 1 ? 's' : ''}`;\n    return `<div class=\"chead\" style=\"--c1:${t.colors[0]}\">\n      <div class=\"who\">${logoImg(t, 'lg-l')}<div><b>#${c.num} ${esc(c.name)}<\/b><span>${POS_LABELS[c.pos]} · ${esc(c.style)} · ${c.age} ans<\/span>\n        <span>${esc(t.city)} ${esc(t.name)} · ${LEAGUES[c.season.lg].short} · saison ${c.year}<\/span><\/div><\/div>\n      <div class=\"kpi\"><b>${C.ovr(c)}<\/b><span>Cote<\/span><\/div>\n      <div class=\"kpi wide\"><b>Niveau ${c.level}<\/b>${bar(c.xp / C.xpNeed(c))}<span>${c.xp} / ${C.xpNeed(c)} XP<\/span><\/div>\n      <div class=\"kpi wide\"><b>${C.lineName(c)}<\/b>${bar(c.trust / 100, c.trust >= 65 ? 'good' : c.trust <= 35 ? 'bad' : '')}<span>Confiance de l'entraîneur<\/span><\/div>\n      <div class=\"kpi wide\"><b>Contrat<\/b><span>${deal}<\/span><span>Gains : ${money(c.earned)}<\/span><\/div>\n    <\/div>`;\n  }\n\n  // ---------- tableau de bord ----------\n  hub() {\n    const c = this.c, ui = this.ui, g = C.nextGame(c), tab = this.tab;\n    ui.back = () => ui.main();\n    const tabs = [['home', 'Aperçu'], ['tree', `Compétences${c.sp ? ` (${c.sp})` : ''}`], ['stats', 'Statistiques'], ['table', 'Classement'], ['sched', 'Calendrier']];\n    const body = tab === 'tree' ? this.treeHtml() : tab === 'stats' ? this.statsHtml() : tab === 'table' ? this.tableHtml() : tab === 'sched' ? this.schedHtml() : this.homeHtml(g);\n    ui.show(`${this.head()}\n      <div class=\"tabs\">${tabs.map(([k, l]) => `<button data-tab=\"${k}\" class=\"${k === tab ? 'cur' : ''}\">${l}<\/button>`).join('')}<\/div>\n      <div class=\"cbody\">${body}<\/div>\n      <div class=\"row\">\n        <button data-a=\"play\" class=\"primary\" data-focus>Jouer le match<\/button>\n        <button data-a=\"sim\">Simuler ce match<\/button>\n        <button data-a=\"simAll\">Simuler le reste de la saison<\/button>\n        <button data-a=\"menu\">Menu principal<\/button>\n      <\/div>`, 'career');\n    ui.on('[data-tab]', (n) => { this.tab = n.dataset.tab; this.hub(); });\n    ui.on('[data-buy]', (n) => { if (C.buy(c, n.dataset.buy)) { this.save(); if (C.unlocked(c).length) unlock('ability'); this.hub(); } });\n    ui.on('[data-eq]', (n) => { c.equip = n.dataset.eq; this.save(); this.hub(); });\n    ui.on('[data-a]', (n) => {\n      const a = n.dataset.a;\n      if (a === 'menu') return ui.main();\n      if (a === 'play') { ui.hide(); ui.app.startMatch({ mode: 'game', career: c, teams: C.matchTeams(c) }); return; }\n      if (a === 'sim') return this.afterMatch(C.simMyGame(c));\n      if (n.dataset.sure) {\n        const year = c.year, lg = c.season.lg;\n        while (c.phase === 'season' && c.year === year && c.season.lg === lg) C.recordGame(c, C.simMyGame(c));\n        this.save(); this.route();\n      } else { n.dataset.sure = 1; n.textContent = `Confirmer : simuler ${C.gamesLeft(c)} matchs`; }\n    });\n  }\n\n  homeHtml(g) {\n    const c = this.c, t = C.myTeam(c), a = C.effAttrs(c), s = c.season, rec = (r) => `${r.w}-${r.l}-${r.otl}`;\n    const mine = s.table[s.team], theirs = s.table[g.opp], last = s.log[s.log.length - 1];\n    const ab = c.equip ? C.ABILITIES[c.equip] : null;\n    return `<div class=\"cols3\">\n      <div><h4>Prochain match · ${s.round + 1} de ${s.rounds.length}<\/h4>\n        <div class=\"next\">${logoImg(g.home ? g.team : t, 'lg-l')}<span>à<\/span>${logoImg(g.home ? t : g.team, 'lg-l')}<\/div>\n        <p><b>${g.home ? 'À domicile contre' : 'En visite chez'} ${esc(g.team.city)}<\/b><br>${esc(g.team.name)} (${rec(theirs)}) · cote ${g.team.rating}<\/p>\n        <p class=\"dim\">${esc(t.name)} : ${rec(mine)} · ${ord(C.myRank(c))} rang<\/p>\n        ${last ? `<p class=\"dim\">Dernier match : ${last.gf > last.ga ? 'victoire' : 'défaite'} ${last.gf}-${last.ga} ${last.home ? 'c.' : 'à'} ${esc(last.opp)} · ${c.pos === 'G' ? `${last.sv || 0} arrêts sur ${last.sa || 0}` : `${last.g} B, ${last.a} A`} · note ${last.rating.toFixed(1)}<\/p>` : ''}\n      <\/div>\n      <div><h4>Attributs<\/h4><table class=\"attrs\">${(c.pos === 'G' ? G_SHOW : ATTRS).map((k) => `<tr><td>${ATTR_LABELS[k]}<\/td><td>${bar((a[k] - 30) / 69)}<\/td><td><b>${a[k]}<\/b>${a[k] > c.a[k] ? ` <i>+${a[k] - c.a[k]}<\/i>` : ''}<\/td><\/tr>`).join('')}<\/table>\n        <p class=\"dim\">Capacité : ${ab ? `<b>${ab.name}<\/b>` : 'aucune (à débloquer dans l\\'arbre de compétences)'}<\/p><\/div>\n      <div><h4>Nouvelles<\/h4><ul class=\"news\">${c.news.map((n) => `<li>${esc(n)}<\/li>`).join('') || '<li class=\"dim\">Rien à signaler.<\/li>'}<\/ul>\n        ${c.drafted ? `<p class=\"dim\">Repêché en ${ord(c.drafted.round)} ronde (${ord(c.drafted.pick)} au total) par ${esc(leagueTeams(2)[c.drafted.team].city)}.<\/p>` : ''}<\/div>\n    <\/div>`;\n  }\n\n  treeHtml() {\n    const c = this.c;\n    const col = (b) => {\n      const pts = C.branchPts(c, b);\n      return `<div class=\"branch\"><h4>${esc(b.name)} <small>${pts} pt${pts > 1 ? 's' : ''}<\/small><\/h4>${b.nodes.map((n) => {\n        const r = C.rank(c, n.id), can = C.canBuy(c, n.id), full = r >= n.max;\n        const eff = n.ability ? C.ABILITIES[n.ability].desc + (r ? '' : ` Exige ${C.ABILITY_NEED} points dans la branche; coûte 2 points.`)\n          : Object.keys(n.eff).map((k) => `+${n.eff[k]} ${ATTR_LABELS[k]}`).join(', ') + ' par rang';\n        const eq = n.ability && r ? (c.equip === n.ability ? '<em>Équipée<\/em>' : `<button data-eq=\"${n.ability}\">Équiper<\/button>`) : '';\n        return `<div class=\"node${full ? ' full' : ''}${n.ability ? ' abil' : ''}\"><div><b>${esc(n.name)}<\/b> <span class=\"pips\">${'●'.repeat(r)}${'○'.repeat(n.max - r)}<\/span><p>${eff}<\/p><\/div>\n          ${full ? eq : `<button data-buy=\"${n.id}\" ${can ? '' : 'disabled'}>${n.ability ? 'Débloquer' : 'Améliorer'}<\/button>`}<\/div>`;\n      }).join('')}<\/div>`;\n    };\n    return `<p class=\"pts\">Points de compétence à dépenser : <b>${c.sp}<\/b> <span class=\"dim\">· un point par niveau gagné<\/span><\/p><div class=\"tree\">${C.treeOf(c).map(col).join('')}<\/div>`;\n  }\n\n  statsHtml() {\n    const c = this.c, T = c.season.st, tot = C.totals(c), t = C.myTeam(c);\n    if (c.pos === 'G') return this.statsG();\n    const row = (h, cur) => `<tr class=\"${cur ? 'me' : ''}\"><td>${h.year}<\/td><td>${h.age}<\/td><td>${LG[h.lg]}<\/td><td>${esc(h.team)}<\/td><td>${h.gp}<\/td><td>${h.g}<\/td><td>${h.a}<\/td><td>${h.g + h.a}<\/td><td>${h.pm > 0 ? '+' : ''}${h.pm}<\/td><td>${h.pim}<\/td><td>${h.rating.toFixed(1)}<\/td><td>${h.rank ? ord(h.rank) : ''}<\/td><\/tr>`;\n    const cur = { year: c.year, age: c.age, lg: c.season.lg, team: t.abbr, gp: T.gp, g: T.g, a: T.a, pm: T.pm, pim: T.pim, rating: C.avgRating(c), rank: C.myRank(c) };\n    return `<h4>Saison en cours<\/h4>\n      <p>${T.gp} PJ · <b>${T.g}<\/b> buts · <b>${T.a}<\/b> aides · <b>${T.g + T.a}<\/b> points · ${T.sog} tirs · ${T.hits} mises en échec · ${T.blk} tirs bloqués · ${T.pim} min de pénalité · temps de glace moyen ${T.gp ? mmss(T.toi / T.gp) : '—'}<\/p>\n      <h4>Carrière<\/h4>\n      <table class=\"ctable\"><tr><th>Saison<\/th><th>Âge<\/th><th>Ligue<\/th><th>Équipe<\/th><th>PJ<\/th><th>B<\/th><th>A<\/th><th>PTS<\/th><th>+/-<\/th><th>PUN<\/th><th>Note<\/th><th>Rang<\/th><\/tr>\n        ${c.history.map((h) => row(h)).join('')}${row(cur, true)}\n        <tr class=\"tot\"><td colspan=\"4\">Total<\/td><td>${tot.gp}<\/td><td>${tot.g}<\/td><td>${tot.a}<\/td><td>${tot.g + tot.a}<\/td><td>${tot.pm > 0 ? '+' : ''}${tot.pm}<\/td><td>${tot.pim}<\/td><td><\/td><td><\/td><\/tr><\/table>\n      <p class=\"dim\">JUN : junior · MIN : ligue mineure · GDE : grande ligue<\/p>`;\n  }\n\n  // Statistiques d'un gardien : arrêts, buts accordés, % d'arrêts, blanchissages\n  statsG() {\n    const c = this.c, T = c.season.st, tot = C.totals(c), t = C.myTeam(c);\n    const gaa = (h) => (h.gp ? ((h.ga || 0) / h.gp).toFixed(2).replace('.', ',') : '—');\n    const row = (h, cur) => `<tr class=\"${cur ? 'me' : ''}\"><td>${h.year}<\/td><td>${h.age}<\/td><td>${LG[h.lg]}<\/td><td>${esc(h.team)}<\/td><td>${h.gp}<\/td><td>${h.sa || 0}<\/td><td>${h.sv || 0}<\/td><td>${h.ga || 0}<\/td><td>${C.fmtSv(h)}<\/td><td>${gaa(h)}<\/td><td>${h.so || 0}<\/td><td>${h.rating.toFixed(1)}<\/td><td>${h.rank ? ord(h.rank) : ''}<\/td><\/tr>`;\n    const cur = { year: c.year, age: c.age, lg: c.season.lg, team: t.abbr, gp: T.gp, sa: T.sa, sv: T.sv, ga: T.ga, so: T.so, rating: C.avgRating(c), rank: C.myRank(c) };\n    return `<h4>Saison en cours<\/h4>\n      <p>${T.gp} PJ · ${svLine(T)} · moyenne ${gaa(T)} · <b>${T.so || 0}<\/b> blanchissage${T.so > 1 ? 's' : ''}<\/p>\n      <h4>Carrière<\/h4>\
