n      <table class=\"ctable\"><tr><th>Saison<\/th><th>Âge<\/th><th>Ligue<\/th><th>Équipe<\/th><th>PJ<\/th><th>TC<\/th><th>ARR<\/th><th>BA<\/th><th>%ARR<\/th><th>MOY<\/th><th>BL<\/th><th>Note<\/th><th>Rang<\/th><\/tr>\n        ${c.history.map((h) => row(h)).join('')}${row(cur, true)}\n        <tr class=\"tot\"><td colspan=\"4\">Total<\/td><td>${tot.gp}<\/td><td>${tot.sa}<\/td><td>${tot.sv}<\/td><td>${tot.ga}<\/td><td>${C.fmtSv(tot)}<\/td><td>${gaa(tot)}<\/td><td>${tot.so}<\/td><td><\/td><td><\/td><\/tr><\/table>\n      <p class=\"dim\">TC : tirs contre · ARR : arrêts · BA : buts accordés · MOY : buts accordés par match · BL : blanchissages<\/p>`;\n  }\n\n  tableHtml() {\n    const c = this.c;\n    return `<h4>${LEAGUES[c.season.lg].name}<\/h4><table class=\"ctable\"><tr><th><\/th><th>Équipe<\/th><th>PJ<\/th><th>V<\/th><th>D<\/th><th>DP<\/th><th>PTS<\/th><th>BP<\/th><th>BC<\/th><\/tr>\n      ${C.standings(c).map((r, i) => `<tr class=\"${r.me ? 'me' : ''}\"><td>${i + 1}<\/td><td class=\"l\">${logoImg(r.team, 'lg-s')} ${esc(r.team.city)} ${esc(r.team.name)}<\/td><td>${r.gp}<\/td><td>${r.w}<\/td><td>${r.l}<\/td><td>${r.otl}<\/td><td><b>${r.pts}<\/b><\/td><td>${r.gf}<\/td><td>${r.ga}<\/td><\/tr>`).join('')}<\/table>\n      <p class=\"dim\">DP : défaite en prolongation ou en tirs de barrage (1 point)<\/p>`;\n  }\n\n  schedHtml() {\n    const c = this.c, s = c.season;\n    if (!s.log.length) return `<p class=\"dim\">Aucun match joué. ${s.rounds.length} matchs au calendrier.<\/p>`;\n    const G = c.pos === 'G';\n    return `<table class=\"ctable\"><tr><th>#<\/th><th>Adversaire<\/th><th>Résultat<\/th>${G ? '<th>ARR<\/th><th>TC<\/th>' : '<th>B<\/th><th>A<\/th>'}<th>Note<\/th><th><\/th><\/tr>\n      ${s.log.map((l, i) => `<tr><td>${i + 1}<\/td><td class=\"l\">${l.home ? 'c.' : 'à'} ${esc(l.opp)}<\/td><td>${l.gf > l.ga ? 'V' : 'D'} ${l.gf}-${l.ga}${l.ot ? ' (P)' : ''}<\/td><td>${G ? l.sv || 0 : l.g}<\/td><td>${G ? l.sa || 0 : l.a}<\/td><td>${l.rating.toFixed(1)}<\/td><td class=\"dim\">${l.sim ? 'simulé' : 'joué'}<\/td><\/tr>`).join('')}<\/table>\n      <p class=\"dim\">${C.gamesLeft(c)} match${C.gamesLeft(c) > 1 ? 's' : ''} à jouer.<\/p>`;\n  }\n\n  // ---------- après un match ----------\n  afterMatch(res) {\n    const c = this.c, ui = this.ui, opp = C.nextGame(c).team;\n    const out = C.recordGame(c, res);\n    this.save();\n    ui.back = null;\n    const win = res.gf > res.ga;\n    ui.show(`<h1>${win ? 'Victoire' : 'Défaite'} ${res.gf}-${res.ga}${res.ot ? ' en prolongation' : ''} <small>contre ${esc(opp.city)}${res.sim ? ' · match simulé' : ''}<\/small><\/h1>\n      <div class=\"after\">\n        <div class=\"kpi big\"><b>${res.rating.toFixed(1)}<\/b><span>Note du match<\/span><\/div>\n        <div><h4>Ta feuille de match<\/h4>\n          ${c.pos === 'G' ? `<p><b>${svLine(res.st)}<\/b>${res.st.so ? ' · <b>blanchissage !<\/b>' : ''}${res.st.a ? ` · ${res.st.a} aide` : ''}<\/p>` : `<p><b>${res.st.g}<\/b> but${res.st.g > 1 ? 's' : ''} · <b>${res.st.a}<\/b> aide${res.st.a > 1 ? 's' : ''} · ${res.st.sog} tir${res.st.sog > 1 ? 's' : ''} · ${res.st.hits} mise${res.st.hits > 1 ? 's' : ''} en échec · ${res.st.pm > 0 ? '+' : ''}${res.st.pm} · temps de glace ${mmss(res.st.toi)}<\/p>`}\n          ${res.obj.length ? `<h4>Objectifs de l'entraîneur<\/h4><ul class=\"objs\">${res.obj.map((o) => `<li class=\"${o.done ? 'ok' : 'no'}\">${o.done ? '✓' : '✗'} ${esc(o.text)}<\/li>`).join('')}<\/ul>` : ''}\n        <\/div>\n        <div><h4>Progression<\/h4>\n          <p><b>+${out.xp} XP<\/b>${res.sim ? ' <span class=\"dim\">(moitié moins qu\\'un match joué)<\/span>' : ''}<\/p>\n          ${out.levels ? `<p class=\"lvl\">Niveau ${c.level} atteint ! +${out.levels} point${out.levels > 1 ? 's' : ''} de compétence<\/p>` : ''}\n          ${out.msgs.map((m) => `<p class=\"msg\">${esc(m)}<\/p>`).join('')}\n          <p class=\"dim\">Niveau ${c.level} · ${c.xp} / ${C.xpNeed(c)} XP<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"row\"><button data-a=\"go\" data-focus class=\"primary\">Continuer<\/button>${c.sp ? '<button data-a=\"tree\">Dépenser mes points<\/button>' : ''}<\/div>`, 'career');\n    ui.on('[data-a]', (n) => { this.tab = n.dataset.a === 'tree' && c.phase === 'season' ? 'tree' : 'home'; this.route(); });\n  }\n\n  // ---------- fin de saison ----------\n  seasonEnd() {\n    const c = this.c, ui = this.ui, T = c.season.st, t = C.myTeam(c), rk = C.myRank(c);\n    ui.back = null;\n    const next = c.season.lg === 0 && !c.drafted ? 'Vers le repêchage' : c.contract.years <= 1 ? 'Négocier mon contrat' : 'Saison suivante';\n    ui.show(`<h1>Fin de la saison ${c.year}<\/h1>${this.head()}\n      <div class=\"cbody\"><p>${esc(t.city)} termine au <b>${ord(rk)} rang<\/b> de la ${LEAGUES[c.season.lg].name}${rk === 1 ? ' — champions de la saison !' : ''}.<\/p>\n      <p>Ta saison : ${T.gp} PJ · ${c.pos === 'G' ? `${svLine(T)} · <b>${T.so || 0}<\/b> blanchissage${T.so > 1 ? 's' : ''}` : `<b>${T.g}<\/b> buts · <b>${T.a}<\/b> aides · <b>${T.g + T.a}<\/b> points`} · note moyenne <b>${C.avgRating(c).toFixed(1)}<\/b><\/p>\n      ${this.tableHtml()}<\/div>\n      <div class=\"row\"><button data-a=\"go\" data-focus class=\"primary\">${next}<\/button><\/div>`, 'career');\n    ui.on('[data-a]', () => { C.endSeason(c); this.save(); this.tab = 'home'; this.route(); });\n  }\n\n  draft() {\n    const c = this.c, ui = this.ui, d = c.draft, big = leagueTeams(2), t = big[d.team];\n    ui.back = null;\n    const show = d.board.filter((p) => p.pick <= 3 || (p.pick >= d.pick - 4 && p.pick <= d.pick));\n    let prev = 0;\n    const rows = show.map((p, i) => {\n      const gap = p.pick > prev + 1 ? '<li class=\"gap\">…<\/li>' : ''; prev = p.pick;\n      return `${gap}<li class=\"${p.me ? 'me' : ''}\" style=\"animation-delay:${i * 0.45}s\"><b>${p.pick}<\/b>${logoImg(big[p.team], 'lg-s')}<span>${esc(big[p.team].city)}<\/span><em>${esc(p.name)} · ${p.pos}<\/em><\/li>`;\n    }).join('');\n    ui.show(`<h1>Repêchage de la ${LEAGUES[2].name}<\/h1>\n      <div class=\"draft\"><ul>${rows}<\/ul>\n        <div class=\"pick\" style=\"--c1:${t.colors[0]};animation-delay:${show.length * 0.45}s\">${logoImg(t, 'lg-l')}\n          <p>Avec le ${ord(d.pick)} choix au total (${ord(d.round)} ronde),<\/p><h2>${esc(t.city)} ${esc(t.name)}<\/h2><p>sélectionnent <b>${esc(c.name)}<\/b> !<\/p>\n          <p class=\"dim\">Contrat d'entrée de 3 ans. Tu te rapportes d'abord au club-école, dans la ligue mineure.<\/p><\/div><\/div>\n      <div class=\"row\"><button data-a=\"go\" data-focus class=\"primary\">Signer mon contrat d'entrée<\/button><\/div>`, 'career');\n    ui.on('[data-a]', () => { C.signEntry(c); this.save(); this.route(); });\n  }\n\n  contract() {\n    const c = this.c, ui = this.ui, big = leagueTeams(2);\n    ui.back = null;\n    ui.show(`<h1>Négociation de contrat<\/h1>\n      <p class=\"dim\">Ton contrat est échu. Trois équipes te font une offre : salaire, durée et rôle promis diffèrent.<\/p>\n      <div class=\"offers\">${c.offers.map((o, i) => {\n        const t = big[o.team];\n        return `<div class=\"offer\" style=\"--c1:${t.colors[0]}\">${logoImg(t, 'lg-l')}<h3>${esc(t.city)}<\/h3><p>${esc(t.name)} · cote ${t.rating}${o.team === c.contract.team ? ' · <b>ton équipe<\/b>' : ''}<\/p>\n          <p class=\"sal\">${money(o.salary)} <small>par saison<\/small><\/p><p>${o.years} an${o.years > 1 ? 's' : ''} · total ${money(o.salary * o.years)}<\/p><p>Rôle promis : <b>${C.lineName(c, o.line)}<\/b><\/p>\n          <button data-o=\"${i}\" ${i ? '' : 'data-focus'} class=\"primary\">Signer<\/button><\/div>`;\n      }).join('')}<\/div>`, 'career');\n    ui.on('[data-o]', (n) => { C.acceptOffer(c, +n.dataset.o); this.save(); this.route(); });\n  }\n}\n", "js/ui/commentary.js": "// Commentaires textuels en direct : description du jeu avec variété, priorités et contexte du match\nimport { PENALTY_NAMES } from '../core/config.js';\nimport { R } from '../core/util.js';\n\nconst last = (pl) => (pl ? pl.name.split(' ').slice(1).join(' ') || pl.name : '');\nconst pick = (...a) => a[Math.floor(R.f() * a.length)];\nconst ordinal = (p) => (p === 1 ? 'première' : p === 2 ? 'deuxième' : 'troisième');\n\nexport class Commentary {\n  // say(texte, priorité) : 1 = remplissage, 2 = jeu important, 3 = moment clé\n  constructor(say, card) { this.say = say; this.card = card; this.match = null; this.shot = null; this.rebound = null; }\n\n  setMatch(m) {\n    this.match = m; this.shot = null; this.rebound = null; this.whistles = 0;\n    m.on((type, d) => this.on(type, d));\n  }\n\n  score() {\n    const [a, b] = this.match.teams;\n    if (a.score === b.score) return a.score === 0 ? 'Toujours aucun but dans ce match.' : `C'est l'égalité ${a.score} à ${b.score}.`;\n    const l = a.score > b.score ? a : b, t = a.score > b.score ? b : a, d = l.score - t.score;\n    return `Les ${l.data.name} mènent ${l.score} à ${t.score}${d >= 3 ? ', une avance confortable' : d === 1 ? ', tout reste à jouer' : ''}.`;\n  }\n\n  on(type, d) {\n    const m = this.match, say = this.say;\n    switch (type) {\n      case 'faceoffWon':\n        if (R.chance(0.45)) say(pick(`${last(d.by.p)} remporte la mise au jeu.`, `Mise au jeu gagnée par ${last(d.by.p)} pour les ${d.team.data.name}.`, `${last(d.by.p)} ramène la rondelle vers l'arrière.`), 1);\n        break;\n      case 'shot': {\n        const n = last(d.by.p);\n        let txt;\n        if (d.oneT) txt = pick(`Tir sur réception de ${n}…`, `${n} frappe sur réception…`);\n        else if (d.type === 'slap') txt = d.dist > 14 ? pick(`Lancer frappé de la pointe…`, `${n} s'élance de la ligne bleue…`) : pick(`Lancer frappé de ${n}…`, `${n} y va d'un boulet…`);\n        else txt = d.dist < 6 ? pick(`${n} tire de près…`, `${n} dans l'enclave, il lance…`) : pick(`${n} décoche un tir du poignet…`, `Lancer de ${n}…`, `${n} tente sa chance…`);\n        this.shot = { txt, t: m.time, by: d.by };\n        say(txt, 2);\n        break;\n      }\n      case 'save': {\n        const g = last(d.goalie.p);\n        const how = { mitaine: ' de la mitaine', bouclier: ' du bouclier', 'jambières': ' de la jambière', corps: '' }[d.type];\n        const pre = this.shot && m.time - this.shot.t < 1.5 ? this.shot.txt + ' ' : '';\n        say(pre + (d.caught ? pick(`ARRÊT${how} ! ${g} garde la rondelle.`, `${g} dit non${how} et gèle le jeu !`, `ARRÊT de ${g} !`)\n          : pick(`ARRÊT${how} ! Il y a un retour…`, `${g} repousse${how}, la rondelle est libre !`, `ARRÊT de ${g}, retour de lancer…`)), 3);\n        this.rebound = d.caught ? null : { t: m.time, team: d.goalie.team };\n        this.shot = null;\n        break;\n      }\n      case 'miss': {\n        const pre = this.shot && m.time - this.shot.t < 1.5 ? this.shot.txt + ' ' : '';\n        say(pre + (d.high ? pick(`par-dessus le filet !`, `trop haut !`) : pick(`à côté du filet !`, `il rate la cible.`, `ça passe à côté !`)), 2);\n        this.shot = null;\n        break;\n      }\n      case 'post': {\n        const pre = this.shot && m.time - this.shot.t < 1.5 ? this.shot.txt + ' ' : '';\n        say(pre + (d.bar ? pick('LA BARRE HORIZONTALE !', 'ÇA FRAPPE LA BARRE !') : pick('LE POTEAU !', 'SUR LE POTEAU ! Quel bruit !')), 3);\n        break;\n      }\n      case 'gain':\n        if (this.rebound && m.time - this.rebound.t < 1.4 && d.by.team !== this.rebound.team && !d.by.isGoalie) {\n          say(pick(`${last(d.by.p)} saute sur le retour !`, `Le retour à ${last(d.by.p)} !`), 3);\n        }\n        this.rebound = null;\n        break;\n      case 'block': say(pick(`Tir bloqué par ${last(d.by.p)}.`, `${last(d.by.p)} se sacrifie et bloque le lancer !`, `Ça frappe ${last(d.by.p)} en plein dans la jambière.`), 2); break;\n      case 'tip': say(pick(`Déviation de ${last(d.by.p)} !`, `${last(d.by.p)} fait dévier la rondelle !`), 3); break;\n      case 'breakaway': say(pick(`ÉCHAPPÉE de ${last(d.by.p)} !`, `${last(d.by.p)} s'échappe seul devant le gardien !`, `${last(d.by.p)} file fin seul !`), 3); break;\n      case 'hit':\n        if (d.illegal) say(`${last(d.by.p)} frappe ${last(d.on.p)} loin de la rondelle…`, 2);\n        else if (d.big) say(pick(`QUELLE MISE EN ÉCHEC de ${last(d.by.p)} sur ${last(d.on.p)} !`, `${last(d.on.p)} est envoyé au tapis par ${last(d.by.p)} !`, `BOUM ! ${last(d.by.p)} ne s'est pas gêné !`), 3);\n        else if (!d.weak) say(pick(`Solide mise en échec de ${last(d.by.p)}.`, `${last(d.by.p)} applique l'épaule.`, `${last(d.by.p)} termine sa mise en échec.`), 2);\n        break;\n      case 'poke': if (R.chance(0.5)) say(pick(`${last(d.by.p)} harponne la rondelle.`, `Revirement ! ${last(d.by.p)} soutire la rondelle à ${last(d.on.p)}.`, `Beau repli de ${last(d.by.p)}.`), 1); break;\n      case 'pass':\n        if (d.saucer && R.chance(0.6)) say(pick(`Passe soulevée de ${last(d.by.p)} vers ${last(d.to.p)}.`, `Belle soucoupe de ${last(d.by.p)}.`), 1);\n        else if (R.chance(0.08) && !d.by.isGoalie) say(pick(`${last(d.by.p)} repère ${last(d.to.p)}.`, `${last(d.by.p)}, à ${last(d.to.p)}.`, `Passe de ${last(d.by.p)}.`), 1);\n        break;\n      case 'dump': say(pick(`${last(d.by.p)} dégage la rondelle.`, `${last(d.by.p)} envoie la rondelle en fond de territoire.`, `Dégagement de ${last(d.by.p)}.`), 1); break;\n      case 'deke': if (R.chance(0.35)) say(pick(`Belle feinte de ${last(d.by.p)} !`, `${last(d.by.p)} déjoue son couvreur !`, `Quelles mains de ${last(d.by.p)} !`), 2); break;\n      case 'penaltyCall': say(d.ps ? 'Le bras de l\\'arbitre est levé… ce sera un tir de pénalité !' : pick('Pénalité à retardement !', 'L\\'arbitre a le bras levé…'), 3); break;\n      case 'penalty': {\n        const o = m.other(d.team);\n        say(`Pénalité à ${d.pl.name} : ${PENALTY_NAMES[d.type].toLowerCase()}, ${d.min} minutes. Avantage numérique pour les ${o.data.name}.`, 3);\n        break;\n      }\n      case 'penaltyEnd': say(pick(`${last(d.pl)} quitte le banc des pénalités.`, `Pénalité écoulée, les ${d.team.data.name} reviennent à forces égales.`), 2); break;\n      case 'whistle': {\n        this.whistles++;\n        const line = {\n          offside: pick('Hors-jeu. Mise au jeu en zone neutre.', 'Coup de sifflet : hors-jeu.', 'Un joueur avait devancé la rondelle. Hors-jeu.'),\n          icing: pick('Dégagement refusé.', `Dégagement refusé contre les ${d.team ? d.team.data.name : 'visiteurs'}, la mise au jeu revient dans leur zone.`),\n          out: pick('La rondelle quitte la surface de jeu.', 'Par-dessus la baie vitrée ! Arrêt de jeu.'),\n        }[d.reason];\n        if (line) say(line, 2);\n        // capsule statistique de temps à autre pendant les arrêts\n        if (m.mode === 'game' && this.whistles % 4 === 0) {\n          const [a, b] = m.teams;\n          const k = R.i(0, 2);\n          if (k === 0) this.card('TIRS AU BUT', `${a.data.abbr} ${a.stats.shots} — ${b.stats.shots} ${b.data.abbr}`);\n          else if (k === 1) this.card('MISES EN ÉCHEC', `${a.data.abbr} ${a.stats.hits} — ${b.stats.hits} ${b.data.abbr}`);\n          else { const fo = a.stats.fow + b.stats.fow || 1; this.card('MISES AU JEU', `${a.data.abbr} ${Math.round(a.stats.fow / fo * 100)} % — ${Math.round(b.stats.fow / fo * 100)} % ${b.data.abbr}`); }\n        } else if (m.mode === 'game' && d.reason !== 'penalty' && R.chance(0.2)) say(this.score(), 1);\n        break;\n      }\n      case 'goal': {\n        if (!d.scorer) { say('ET LE BUT !', 3); break; }\n        const str = { AN: ' en avantage numérique', DN: ' en désavantage numérique', FD: ' dans un filet désert' }[d.str] || '';\n        const n = d.scorer.st.g;\n        const tally = n === 3 ? ' TOUR DU CHAPEAU !' : n === 2 ? ' Son deuxième du match !' : '';\n        const as = d.assists.length ? ` Aide${d.assists.length > 1 ? 's' : ''} : ${d.assists.map(last).join(' et ')}.` : '';\n        say(pick(`ET LE BUT ! ${d.scorer.name} marque pour les ${d.team.data.name}${str} !`, `IL LANCE ET COMPTE ! ${d.scorer.name}${str} !`, `C'EST DANS LE FILET ! ${d.scorer.name} fait bouger les cordages${str} !`) + tally + as, 3);\n        break;\n      }\n      case 'lastMinute': if (d.period <= 3) say(`Dernière minute de jeu en ${ordinal(d.period)} période. ${this.score()}`, 2); break;\n      case 'periodEnd': say(d.period <= 3 ? `C'est la fin de la ${ordinal(d.period)} période. ${this.score()}` : 'Fin de la prolongation : on s\\'en va en tirs de barrage !', 3); break;\n      case 'periodStart': say(d.period === 4 ? 'Prolongation à 3 contre 3 : le prochain but gagne !' : `Début de la ${ordinal(d.period)} période sur une glace fraîchement refaite.`, 2); break;\n      case 'goaliePulled': say(`Les ${d.team.data.name} retirent leur gardien pour un sixième attaquant !`, 3); break;\n      case 'fightStart': say(pick(`Les gants tombent ! ${last(d.a.p)} contre ${last(d.o.p)} !`, `Ça brasse ! ${last(d.a.p)} et ${last(d.o.p)} jettent les gants !`), 3); break;\n      case 'fightEnd': say(`${d.winner.p.name} a eu le dessus. Cinq minutes chacun.`, 2); break;\n      case 'attemptStart': say(pick(`${d.shooter.name} s'élance${d.kind === 'ps' ? ' pour le tir de pénalité' : ''}…`, `${d.shooter.name} prend son élan…`), 2); break;\n      case 'attemptEnd': say(d.result === 'goal' ? pick('ET LE BUT ! Quelle feinte !', 'IL DÉJOUE LE GARDIEN !') : d.result === 'save' ? pick('ARRÊT du gardien !', 'Le gardien ferme la porte !') : pick('Il rate la cible !', 'Raté !'), 3); break;\n      case 'final': say(`C'est terminé ! Victoire des ${m.winner.data.name} de ${m.winner.data.city}.`, 3); break;\n    }\n  }\n}\n", "js/ui/editor.js": "// Éditeur d'équipe : identité et couleurs, trios, joueurs, création d'équipes, import et export\nimport { getTeams, commitTeam, resetTeam, createTeam, deleteTeam, rerollRoster, autoLines, exportTeams, importTeams, calcOvr,\n  ATTRS, G_ATTRS, ATTR_LABELS, SKATER_STYLES, POS_LABELS, MAX_CUSTOM } from '../data/teams.js';\nimport { kitFor, jerseySvg, getLook, logoImg, logoCanvas, LOOK_OPTS, LOOK_LABELS, KIT_NAMES } from '../data/kit.js';\nimport { teamChem, chemBonus, chemLabel } from '../data/chemistry.js';\nimport { Preview3D } from '../render/preview.js';\n\nconst esc = (s) => String(s).replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst opt = (list, cur) => list.map(([v, l]) => `<option value=\"${esc(v)}\" ${String(v) === String(cur) ? 'selected' : ''}>${esc(l)}<\/option>`).join('');\nconst crest = (t) => logoImg(t, 'lg-s');\n\nexport class Editor {\n  constructor(ui) { this.ui = ui; this.msg = ''; }\n\n  note(m) { this.msg = m; }\n  takeMsg() { const m = this.msg; this.msg = ''; return m ? `<div class=\"note\">${esc(m)}<\/div>` : ''; }\n\n  // ---------- liste des équipes ----------\n  list() {\n    const ui = this.ui, teams = getTeams();\n    const nCustom = teams.filter((t) => t.custom).length;\n    ui.back = () => ui.main();\n    ui.show(`\n      <h1>Éditeur d'équipe<\/h1>\n      ${this.takeMsg()}\n      <div class=\"tgrid\">${teams.map((t, i) => `<button data-t=\"${i}\" ${i === 0 ? 'data-focus' : ''}>${crest(t)}\n        <span class=\"nm\"><b>${esc(t.city)}<\/b> ${esc(t.name)}<\/span>\n        <small>${t.custom ? 'création' : t.edited ? 'modifiée' : ''} ${t.rating}<\/small><\/button>`).join('')}<\/div>\n      <div class=\"row\">\n        <button data-a=\"new\" class=\"primary\" ${nCustom >= MAX_CUSTOM ? 'disabled' : ''}>Créer une équipe<\/button>\n        <button data-a=\"export\">Exporter dans un fichier<\/button>\n        <button data-a=\"import\">Importer un fichier<\/button>\n        <button data-a=\"back\">Retour<\/button>\n      <\/div>\n      <input type=\"file\" accept=\".json,application/json\" data-file hidden>\n      <div class=\"foot\">Les modifications sont enregistrées automatiquement dans ce navigateur. ${nCustom}/${MAX_CUSTOM} équipes créées.<\/div>`, 'editor');\n    ui.on('[data-t]', (n) => { const t = getTeams()[+n.dataset.t]; ui.app.previewTeam(t); this.team(t, 'id'); });\n    ui.on('[data-a]', (n) => {\n      const a = n.dataset.a;\n      if (a === 'back') ui.main();\n      else if (a === 'new') { const t = createTeam(); if (t) { ui.app.previewTeam(t); this.team(t, 'id'); } }\n      else if (a === 'export') {\n        const url = URL.createObjectURL(new Blob([exportTeams()], { type: 'application/json' }));\n        const link = Object.assign(document.createElement('a'), { href: url, download: 'ligue-boreale-equipes.json' });\n        link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);\n      } else if (a === 'import') ui.el.querySelector('[data-file]').click();\n    });\n    ui.on('[data-file]', async (n) => {\n      const f = n.files[0];\n      if (!f) return;\n      if (!confirm('Importer ce fichier remplacera toutes tes équipes modifiées et créées. Continuer ?')) return;\n      const k = importTeams(await f.text());\n      this.note(k < 0 ? 'Fichier illisible : ce n\\'est pas un fichier d\\'équipes de la Ligue Boréale.' : `${k} équipe(s) importée(s).`);\n      ui.sel.user = 0; ui.sel.opp = 8;\n      this.list();\n    }, 'change');\n  }\n\n  // ---------- une équipe ----------\n  team(t, tab = 'id', st = {}) {\n    const ui = this.ui;\n    ui.back = () => this.list();\n    const again = (s2 = st, focus) => { this.team(t, tab, s2); if (focus) { const f = ui.el.querySelector(focus); if (f) f.focus(); } };\n    const save = () => { if (!commitTeam(t)) this.note('Sauvegarde impossible : le stockage du navigateur est plein ou bloqué.'); };\n    const tabs = [['id', 'Identité'], ['lines', 'Alignement'], ['players', 'Joueurs']];\n    const body = tab === 'id' ? this.idHtml(t, st) : tab === 'lines' ? this.linesHtml(t, st) : this.playersHtml(t, st);\n    const scroll = ['.epanel', '.plist'].map((q) => ui.el.querySelector(q)?.scrollTop || 0); // conserve le défilement\n    setTimeout(() => ['.epanel', '.plist'].forEach((q, i) => { const n = ui.el.querySelector(q); if (n) n.scrollTop = scroll[i]; }), 0);\n    ui.show(`\n      <h1>${crest(t)} ${esc(t.city)} ${esc(t.name)} <small>cote ${t.rating}<\/small><\/h1>\n      <div class=\"tabs\">${tabs.map(([k, l]) => `<button data-tab=\"${k}\" class=\"${k === tab ? 'cur' : ''}\">${l}<\/button>`).join('')}\n        <button data-tab=\"back\">Retour aux équipes<\/button><\/div>\n      ${this.takeMsg()}\n      <div class=\"epanel\">${body}<\/div>`, 'editor');\n    ui.on('[data-tab]', (n) => { if (n.dataset.tab === 'back') this.list(); else this.team(t, n.dataset.tab); });\n    if (tab === 'id') this.idBind(t, save, again, st);\n    else if (tab === 'lines') this.linesBind(t, st, again);\n    else this.playersBind(t, st, save, again);\n  }\n\n  // ----- identité, chandails, logo et aréna -----\n  idHtml(t, st) {\n    const other = getTeams().find((o) => o !== t).colors[0];\n    const L = getLook(t), num = t.players[t.lines.F[0][1]].num, cur = st.kit || 'home';\n    const lsel = (k) => `<label>${LOOK_LABELS[k]} <select data-l=\"${k}\">${opt(Object.entries(LOOK_OPTS[k]), L[k])}<\/select><\/label>`;\n    return `<div class=\"ecols\">\n      <div class=\"col\">\n        <h4>Identité<\/h4>\n        <label>Ville <input type=\"text\" data-f=\"city\" maxlength=\"22\" value=\"${esc(t.city)}\"><\/label>\n        <label>Nom <input type=\"text\" data-f=\"name\" maxlength=\"18\" value=\"${esc(t.name)}\"><\/label>\n        <label>Abréviation <input type=\"text\" data-f=\"abbr\" maxlength=\"4\" value=\"${esc(t.abbr)}\" class=\"short\"><\/label>\n        <label>Association <select data-f=\"conf\">${opt([['Est', 'Est'], ['Ouest', 'Ouest']], t.conf)}<\/select><\/label>\n        <h4>Couleurs<\/h4>\n        <label>Principale <input type=\"color\" data-c=\"0\" value=\"${t.colors[0]}\"><\/label>\n        <label>Secondaire <input type=\"color\" data-c=\"1\" value=\"${t.colors[1]}\"><\/label>\n        <label>Tertiaire <input type=\"color\" data-c=\"2\" value=\"${t.colors[2]}\"><\/label>\n        <h4>Aréna<\/h4>\n        <label>Couleur de la glace <input type=\"color\" data-lc=\"ice\" value=\"${L.ice}\"><\/label>\n        <label>Couleur des bandes <input type=\"color\" data-lc=\"boards\" value=\"${L.boards}\"><\/label>\n      <\/div>\n      <div class=\"col\">\n        <h4>Motif du chandail<\/h4>\n        ${['stripes', 'shoulders', 'panels', 'numStyle'].map(lsel).join('')}\n        <h4>Logo<\/h4>\n        <div class=\"logorow\">${logoImg(t, 'lg-l')}<div>${['logoShape', 'logoMotif', 'logoText'].map(lsel).join('')}<\/div><\/div>\n        <h4>Alignement<\/h4>\n        <label>Force <select data-reroll>${opt([[70, 'Modeste'], [76, 'Moyenne'], [80, 'Forte'], [84, 'Élite']], 76)}<\/select><\/label>\n        <button data-a=\"reroll\">Générer 20 nouveaux joueurs<\/button>\n        ${t.custom ? '<button data-a=\"delete\">Supprimer cette équipe<\/button>'\n    : `<button data-a=\"reset\" ${t.edited ? '' : 'disabled'}>Rétablir l'équipe d'origine<\/button>`}\n      <\/div>\n      <div class=\"col pvcol\">\n        <h4>Aperçu 3D <small>${KIT_NAMES[cur]}<\/small><\/h4>\n        <div class=\"pv\" data-pv><\/div>\n        <div class=\"kits\">${['home', 'away', 'retro'].map((v) => `<button data-kit=\"${v}\" class=\"kitb ${v === cur ? 'cur' : ''}\">${jerseySvg(kitFor(t, v, other), num)}<span>${KIT_NAMES[v]}<\/span><\/button>`).join('')}<\/div>\n      <\/div><\/div>`;\n  }\n\n  idBind(t, save, again, st) {\n    const ui = this.ui, preview = () => ui.app.previewTeam(t);\n    const other = getTeams().find((o) => o !== t).colors[0];\n    // aperçu 3D : un seul canevas, replacé dans la page à chaque rafraîchissement\n    try {\n      this.pv = this.pv || new Preview3D();\n      ui.el.querySelector('[data-pv]').appendChild(this.pv.canvas);\n      this.pv.setKit({ ...kitFor(t, st.kit || 'home', other), logo: logoCanvas(t) }, t.players[t.lines.F[0][1]].num);\n    } catch { ui.el.querySelector('[data-pv]').textContent = 'Aperçu 3D indisponible sur cet appareil.'; }\n    ui.on('[data-kit]', (n) => again({ ...st, kit: n.dataset.kit }, `[data-kit=\"${n.dataset.kit}\"]`));\n    ui.on('[data-l]', (n) => { t.look = { ...getLook(t), [n.dataset.l]: n.value }; save(); preview(); again(undefined, `[data-l=\"${n.dataset.l}\"]`); }, 'change');\n    ui.on('[data-lc]', (n) => { t.look = { ...getLook(t), [n.dataset.lc]: n.value.toLowerCase() }; save(); preview(); again(undefined, `[data-lc=\"${n.dataset.lc}\"]`); }, 'change');\n    ui.on('[data-f]', (n) => {\n      const k = n.dataset.f; let v = n.value.trim();\n      if (k === 'abbr') v = v.toUpperCase().replace(/[^A-ZÀ-Ü0-9]/g, '');\n      if (!v) { this.note('Ce champ ne peut pas être vide.'); return again(undefined, `[data-f=\"${k}\"]`); }\n      t[k] = v; save();\n      if (k === 'abbr' || k === 'name') preview();\n      again(undefined, `[data-f=\"${k}\"]`);\n    }, 'change');\n    ui.on('[data-c]', (n) => { t.colors[+n.dataset.c] = n.value.toLowerCase(); save(); preview(); again(undefined, `[data-c=\"${n.dataset.c}\"]`); }, 'change');\n    ui.on('[data-a]', (n) => {\n      const a = n.dataset.a;\n      if (a === 'reroll') {\n        if (!confirm('Remplacer les 20 joueurs de cette équipe par de nouveaux joueurs ?')) return;\n        rerollRoster(t, +ui.el.querySelector('[data-reroll]').value);\n        this.note('Nouvel alignement généré.'); again();\n      } else if (a === 'reset') {\n        if (!confirm('Annuler toutes les modifications apportées à cette équipe ?')) return;\n        const fresh = resetTeam(t);\n        ui.app.previewTeam(fresh); this.note('Équipe d\\'origine rétablie.'); this.team(fresh, 'id');\n      } else if (a === 'delete') {\n        if (!confirm(`Supprimer définitivement ${t.city} ${t.name} ?`)) return;\n        deleteTeam(t); ui.sel.user = 0; ui.sel.opp = 8;\n        this.note('Équipe supprimée.'); this.list();\n      }\n    });\n  }\n\n  // ----- alignement -----\n  linesHtml(t, st) {\n    const slot = (grp, l, k, i, role) => {\n      const p = t.players[i], key = `${grp},${l},${k}`;\n      return `<button data-slot=\"${key}\" class=\"slot ${st.pick === key ? 'cur' : ''}\"><i>${role}<\/i><b>#${p.num} ${esc(p.name)}<\/b><small>${p.pos} · ${p.ovr}<\/small><\/button>`;\n    };\n    const avg = (ix) => Math.round(ix.reduce((s, i) => s + t.players[i].ovr, 0) / ix.length);\n    const chem = teamChem(t);\n    const ch = (c) => `<small>cote ${'%AVG%'}<\/small><em class=\"chem ${c >= 62 ? 'hi' : c < 45 ? 'lo' : ''}\">chimie ${c} · ${chemBonus(c) >= 0 ? '+' : ''}${chemBonus(c)}<\/em>`;\n    const F = t.lines.F.map((ln, l) => `<div class=\"lrow\"><span title=\"${chemLabel(chem.F[l])}\">Trio ${l + 1}${ch(chem.F[l]).replace('%AVG%', avg(ln))}<\/span>${ln.map((i, k) => slot('F', l, k, i, ['AG', 'C', 'AD'][k])).join('')}<\/div>`).join('');\n    const D = t.lines.D.map((ln, l) => `<div class=\"lrow\"><span title=\"${chemLabel(chem.D[l])}\">Paire ${l + 1}${ch(chem.D[l]).replace('%AVG%', avg(ln))}<\/span>${ln.map((i, k) => slot('D', l, k, i, ['DG', 'DD'][k])).join('')}<\/div>`).join('');\n    const G = `<div class=\"lrow\"><span>Gardiens<\/span>${t.lines.G.map((i, k) => slot('G', 0, k, i, k ? 'Aux.' : 'Partant')).join('')}<\/div>`;\n    return `<p class=\"dim\">Clique sur un joueur, puis sur un autre pour les échanger. Les gardiens ne s'échangent qu'entre eux.<br>Chimie : un marqueur avec un fabricant de jeu, un joueur robuste pour les appuyer, chacun à sa position naturelle; en défense, un offensif avec un défensif. Le chiffre après la chimie s'ajoute aux passes, au sens du jeu, à la précision et au maniement.<\/p>\n      <h4>Attaquants<\/h4>${F}<h4>Défenseurs<\/h4>${D}<h4>Devant le filet<\/h4>${G}\n      <div class=\"row left\"><button data-a=\"auto\">Alignement optimal<\/button><\/div>`;\n  }\n\n  linesBind(t, st, again) {\n    const ui = this.ui;\n    const ref = (key) => { const [g, l, k] = key.split(','); return g === 'G' ? [t.lines.G, +k] : [t.lines[g][+l], +k]; };\n    ui.on('[data-slot]', (n) => {\n      const key = n.dataset.slot;\n      if (!st.pick) return again({ pick: key }, `[data-slot=\"${key}\"]`);\n      if (st.pick !== key) {\n        if ((st.pick[0] === 'G') !== (key[0] === 'G')) this.note('Un gardien ne peut être échangé qu\\'avec l\\'autre gardien.');\n        else {\n          const [a, i] = ref(st.pick), [b, j] = ref(key);\n          [a[i], b[j]] = [b[j], a[i]];\n          if (!commitTeam(t)) this.note('Sauvegarde impossible.');\n        }\n      }\n      again({}, `[data-slot=\"${key}\"]`);\n    });\n    ui.on('[data-a=\"auto\"]', () => { autoLines(t); this.note('Trios reclassés selon la cote des joueurs.'); again({}); });\n  }\n\n  // ----- joueurs -----\n  playersHtml(t, st) {\n    const order = [...t.lines.F.flat(), ...t.lines.D.flat(), ...t.lines.G];\n    const sel = st.p ?? order[0], p = t.players[sel], isG = p.pos === 'G';\n    const rows = order.map((i) => { const q = t.players[i]; return `<button data-p=\"${i}\" class=\"prow ${i === sel ? 'cur' : ''}\"><b>${q.num}<\/b><span>${esc(q.name)}<\/span><i>${q.pos}<\/i><em>${q.ovr}<\/em><\/button>`; }).join('');\n    const slider = (k) => `<label>${ATTR_LABELS[k]} <span><input type=\"range\" min=\"30\" max=\"99\" step=\"1\" data-attr=\"${k}\" value=\"${p.a[k]}\"><output>${p.a[k]}<\/output><\/span><\/label>`;\n    return `<div class=\"ecols\">\n      <div class=\"col plist\">${rows}<\/div>\n      <div class=\"col\">\n        <h4>${esc(p.name)} <small>${POS_LABELS[p.pos]} · cote <b data-ovr>${p.ovr}<\/b><\/small><\/h4>\n        <label>Nom <input type=\"text\" data-pf=\"name\" maxlength=\"26\" value=\"${esc(p.name)}\"><\/label>\n        <label>Numéro <input type=\"number\" data-pf=\"num\" min=\"1\" max=\"99\" value=\"${p.num}\" class=\"short\"><\/label>\n        <label>Âge <input type=\"number\" data-pf=\"age\" min=\"17\" max=\"45\" value=\"${p.age}\" class=\"short\"><\/label>\n        ${isG ? '' : `<label>Position <select data-pf=\"pos\">${opt(['LW', 'C', 'RW', 'D'].map((k) => [k, POS_LABELS[k]]), p.pos)}<\/select><\/label>\n        <label>Style <select data-pf=\"style\">${opt(SKATER_STYLES.map((s) => [s, s]), p.style)}<\/select><\/label>`}\n        <label>${isG ? 'Mitaine' : 'Lance de la'} <select data-pf=\"hand\">${opt([[-1, 'Gauche'], [1, 'Droite']], p.hand)}<\/select><\/label>\n        <h4>Attributs<\/h4>\n        ${(isG ? G_ATTRS : ATTRS).map(slider).join('')}\n      <\/div><\/div>`;\n  }\n\n  playersBind(t, st, save, again) {\n    const ui = this.ui, order = [...t.lines.F.flat(), ...t.lines.D.flat(), ...t.lines.G];\n    const sel = st.p ?? order[0], p = t.players[sel];\n    ui.on('[data-p]', (n) => again({ p: +n.dataset.p }, `[data-p=\"${n.dataset.p}\"]`));\n    ui.on('[data-pf]', (n) => {\n      const k = n.dataset.pf, focus = `[data-pf=\"${k}\"]`;\n      if (k === 'name') {\n        const v = n.value.trim();\n        if (!v) this.note('Le nom ne peut pas être vide.'); else p.name = v;\n      } else if (k === 'num') {\n        const v = Math.round(+n.value), other = t.players.find((q) => q !== p && q.num === v);\n        if (!(v >= 1 && v <= 99)) this.note('Le numéro doit être entre 1 et 99.');\n        else if (other) this.note(`Le numéro ${v} est déjà porté par ${other.name}.`);\n        else p.num = v;\n      } else if (k === 'age') p.age = Math.min(45, Math.max(17, Math.round(+n.value) || p.age));\n      else if (k === 'hand') p.hand = +n.value;\n      else p[k] = n.value;\n      save(); again({ p: sel }, focus);\n    }, 'change');\n    // curseurs : mise à jour immédiate de la valeur et de la cote, sauvegarde au relâchement\n    ui.on('[data-attr]', (n) => {\n      p.a[n.dataset.attr] = +n.value;\n      n.nextElementSibling.textContent = n.value;\n      ui.el.querySelector('[data-ovr]').textContent = calcOvr(p);\n    }, 'input');\n    ui.on('[data-attr]', (n) => { save(); again({ p: sel }, `[data-attr=\"${n.dataset.attr}\"]`); }, 'change');\n  }\n}\n", "js/ui/franchiseui.js": "// Écrans du mode Franchise : emplacements, tableau de bord du directeur général, intersaison\nimport * as F from '../franchise/franchise.js';\nimport { loadFranchise, saveFranchise, deleteFranchise, SAVE_SLOTS } from '../save/storage.js';\nimport { getTeams, POS_LABELS, ATTRS, ATTR_LABELS } from '../data/teams.js';\nimport { logoImg } from '../data/kit.js';\nimport { unlock, bump } from '../save/profile.js';\n\nconst esc = (s) => String(s).replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst money = (x) => `${x.toFixed(2).replace('.', ',')} M$`;\nconst ord = (n) => (n === 1 ? '1er' : n + 'e');\nconst pct = (v) => (v ? v.toFixed(3).slice(1) : '—');\nconst bar = (v, cls = '') => `<div class=\"cbar ${cls}\"><i style=\"width:${Math.round(Math.max(0, Math.min(1, v)) * 100)}%\"><\/i><\/div>`;\nconst POS = { C: 'C', LW: 'AG', RW: 'AD', D: 'D', G: 'G' };\nconst mood = (m) => (m >= 75 ? '😀' : m >= 55 ? '🙂' : m >= 35 ? '😐' : '😠');\n\nexport class FranchiseUI {\n  constructor(ui) { this.ui = ui; this.f = null; this.slot = 0; this.tab = 'home'; this.pick = null; this.tr = null; this.card = null; }\n  save() { if (!saveFranchise(this.slot, this.f)) this.f.saveErr = true; }\n  get team() { return this.f.teams[this.f.user]; }\n\n  // ---------- emplacements ----------\n  slots() {\n    const ui = this.ui;\n    ui.back = () => ui.main();\n    const cards = [];\n    for (let i = 0; i < SAVE_SLOTS; i++) {\n      const f = loadFranchise(i);\n      if (!f) { cards.push(`<div class=\"slot empty\"><h3>Emplacement ${i + 1}<\/h3><p class=\"dim\">Vide<\/p><button data-new=\"${i}\">Nouvelle franchise<\/button><\/div>`); continue; }\n      const t = f.teams[f.user], r = f.table[f.user];\n      cards.push(`<div class=\"slot\" style=\"--c1:${t.colors[0]}\"><h3>${esc(t.city)}<\/h3><p>${logoImg(t, 'lg-s')} ${esc(t.name)}<\/p>\n        <p class=\"dim\">Saison ${f.year} · ${r.w}-${r.l}-${r.otl}<\/p><p class=\"dim\">${f.history.filter((h) => h.mine).length} coupe(s)<\/p>\n        <button data-load=\"${i}\" class=\"primary\">Continuer<\/button><button data-del=\"${i}\">Effacer<\/button><\/div>`);\n    }\n    ui.show(`<h1>Franchise<\/h1><div class=\"slots\">${cards.join('')}<\/div><div class=\"row\"><button data-a=\"back\">Retour<\/button><\/div>\n      <div class=\"foot\">Dirige une équipe sur plusieurs saisons. Sauvegarde automatique après chaque match et chaque décision.<\/div>`, 'career');\n    ui.on('[data-new]', (n) => this.pickTeam(+n.dataset.new));\n    ui.on('[data-load]', (n) => { this.slot = +n.dataset.load; this.f = loadFranchise(this.slot); this.tab = 'home'; this.route(); });\n    ui.on('[data-del]', (n) => { if (n.dataset.sure) { deleteFranchise(+n.dataset.del); this.slots(); } else { n.dataset.sure = 1; n.textContent = 'Confirmer l\\'effacement'; } });\n    ui.on('[data-a]', () => ui.main());\n  }\n\n  pickTeam(slot) {\n    const ui = this.ui, teams = getTeams().slice(0, 16);\n    ui.back = () => this.slots();\n    ui.show(`<h1>Choisis ton équipe<\/h1><div class=\"tgrid\">${teams.map((t, i) => `<button data-t=\"${i}\" style=\"--c1:${t.colors[0]}\">${logoImg(t, 'lg-s')}<b>${esc(t.city)}<\/b><span>${esc(t.name)} · cote ${t.rating} · ${t.conf}<\/span><\/button>`).join('')}<\/div>\n      <div class=\"row\"><button data-a=\"back\">Retour<\/button><\/div>\n      <div class=\"foot\">Une équipe forte coûte cher : moins d'espace sous le plafond salarial. Une équipe faible repêche tôt.<\/div>`, 'career');\n    ui.on('[data-t]', (n) => { this.slot = slot; this.f = F.newFranchise(+n.dataset.t); this.tab = 'home'; this.save(); this.route(); });\n    ui.on('[data-a]', () => this.slots());\n  }\n\n  route() {\n    const p = this.f.phase;\n    if (p === 'awards') this.awards(); else if (p === 'resign') this.resign(); else if (p === 'draft') this.draft(); else this.hub();\n  }\n\n  // Après chaque avancée : succès, sauvegarde\n  after(before) {\n    const f = this.f;\n    if (f.phase === 'playoffs' && before === 'season' && F.nextGame(f)) unlock('playoffs');\n    if (f.phase === 'awards' && before !== 'awards' && f.history[0].mine) { unlock('cup'); if (bump('cups') >= 2) unlock('dynasty'); }\n    this.save();\n  }\n  afterMatch(m) { const f = this.f, b = f.phase; F.advance(f, F.fromMatch(f, m)); this.after(b); this.route(); }\n\n  head() {\n    const f = this.f, t = this.team, r = f.table[f.user], pay = F.payroll(t);\n    const mor = t.players.reduce((s, p) => s + p.morale, 0) / t.players.length, inj = t.players.filter((p) => p.inj > 0).length;\n    return `<div class=\"chead\" style=\"--c1:${t.colors[0]}\">\n      <div class=\"who\">${logoImg(t, 'lg-l')}<div><b>${esc(t.city)} ${esc(t.name)}<\/b><span>Saison ${f.year} · ${f.phase === 'playoffs' ? 'séries éliminatoires' : f.phase === 'fa' ? 'intersaison' : `match ${Math.min(f.round + 1, f.rounds.length)} de ${f.rounds.length}`}<\/span>\n        <span>${r.w}-${r.l}-${r.otl} · ${r.pts} pts · ${ord(F.rankOf(f, f.user))} rang<\/span><\/div><\/div>\n      <div class=\"kpi\"><b>${F.teamRating(t)}<\/b><span>Cote<\/span><\/div>\n      <div class=\"kpi wide\"><b>${money(pay)}<\/b>${bar(pay / f.cap, pay > f.cap ? 'bad' : '')}<span>Plafond ${f.cap} M$ · espace ${money(f.cap - pay)}<\/span><\/div>\n      <div class=\"kpi wide\"><b>Moral ${Math.round(mor)}<\/b>${bar(mor / 100, mor >= 65 ? 'good' : mor < 45 ? 'bad' : '')}<span>${t.players.length} joueurs · ${inj} blessé${inj > 1 ? 's' : ''}<\/span><\/div>\n    <\/div>`;\n  }\n\n  // ---------- tableau de bord ----------\n  hub() {\n    const f = this.f, ui = this.ui, tab = this.tab, g = F.nextGame(f), off = f.phase === 'fa';\n    ui.back = () => ui.main();\n    const tabs = [['home', 'Aperçu'], ['roster', 'Effectif'], ['table', 'Classement'], ['leaders', 'Meneurs'], ['trade', 'Échanges'], ['fa', `Agents libres (${f.fa.length})`], ['scout', 'Dépistage'], ['hist', 'Histoire']];\n    const body = this.card ? this.cardHtml() : { home: () => this.homeHtml(g), roster: () => this.rosterHtml(), table: () => this.tableHtml(), leaders: () => this.leadersHtml(),\n      trade: () => this.tradeHtml(), fa: () => this.faHtml(), scout: () => this.scoutHtml(), hist: () => this.histHtml() }[tab]();\n    const acts = off ? '<button data-a=\"start\" class=\"primary\" data-focus>Commencer la saison<\/button>'\n      : `${g ? '<button data-a=\"play\" class=\"primary\" data-focus>Jouer le match<\/button><button data-a=\"sim\">Simuler ce match<\/button>' : '<button data-a=\"sim\" class=\"primary\" data-focus>Simuler la journée des séries<\/button>'}\n         <button data-a=\"simAll\">${f.phase === 'playoffs' ? 'Simuler la fin des séries' : 'Simuler la fin de la saison'}<\/button>`;\n    ui.show(`${this.head()}\n      <div class=\"tabs\">${tabs.map(([k, l]) => `<button data-tab=\"${k}\" class=\"${k === tab && !this.card ? 'cur' : ''}\">${l}<\/button>`).join('')}<\/div>\n      <div class=\"cbody\">${this.msg ? `<p class=\"msg\">${esc(this.msg)}<\/p>` : ''}${body}<\/div>\n      <div class=\"row\">${acts}<button data-a=\"menu\">Menu principal<\/button><\/div>`, 'career');\n    this.msg = null;\n    ui.on('[data-tab]', (n) => { this.tab = n.dataset.tab; this.card = null; this.pick = null; this.hub(); });\n    ui.on('[data-card]', (n) => { this.card = n.dataset.card; this.hub(); });\n    this.bind();\n    ui.on('[data-a]', (n) => {\n      const a = n.dataset.a, b = f.phase;\n      if (a === 'menu') return ui.main();\n      if (a === 'play') { ui.hide(); ui.app.startMatch({ mode: 'game', franchise: f, teams: F.matchTeams(f) }); return; }\n      if (a === 'start') {\n        if (F.overCap(f)) { this.msg = 'Ta masse salariale dépasse le plafond : libère ou échange des joueurs avant de commencer.'; return this.hub(); }\n        F.newSeason(f); this.save(); this.tab = 'home'; return this.route();\n      }\n      if (a === 'sim') { const r = F.advance(f); if (r) this.msg = `${r.gf > r.ga ? 'Victoire' : 'Défaite'} ${r.gf}-${r.ga}${r.ot ? ' en prolongation' : ''} (match simulé).`; this.after(b); return this.route(); }\n      if (n.dataset.sure) { let k = 0; while (f.phase === b && k++ < 200) F.advance(f); this.after(b); this.route(); } else { n.dataset.sure = 1; n.textContent = 'Confirmer la simulation'; }\n    });\n  }\n\n  // Actions des onglets\n  bind() {\n    const f = this.f, ui = this.ui, t = this.team, re = () => { this.save(); this.hub(); };\n    ui.on('[data-swap]', (n) => {\n      const id = n.dataset.swap;\n      if (!this.pick) this.pick = id;\n      else { if (this.pick !== id && !F.swapLine(t, this.pick, id)) this.msg = 'Échange impossible : même groupe (attaquants, défenseurs ou gardiens) et joueurs en santé seulement.'; this.pick = null; }\n      re();\n    });\n    ui.on('[data-auto]', () => { F.setLines(f, t, false); this.msg = 'Alignement refait selon les cotes.'; re(); });\n    ui.on('[data-rel]', (n) => {\n      if (!n.dataset.sure) { n.dataset.sure = 1; n.textContent = 'Confirmer'; return; }\n      const p = F.byId(t, n.dataset.rel), g = F.group(p);\n      if (t.players.filter((q) => F.group(q) === g).length <= { F: 12, D: 6, G: 2 }[g]) this.msg = 'Impossible : il ne resterait plus assez de joueurs à cette position.';\n      else { F.release(f, p.id); this.msg = `${p.name} est libéré et devient agent libre.`; this.card = null; }\n      re();\n    });\n    ui.on('[data-sign]', (n) => { const p = f.fa.find((q) => q.id === n.dataset.sign), err = F.signFA(f, n.dataset.sign); this.msg = err || `${p.name} signe avec ton équipe.`; re(); });\n    ui.on('[data-sc]', (n) => { f.scouts[+n.dataset.sc] = +n.value; re(); }, 'change');\n    ui.on('[data-to]', (n) => { this.tr = { other: +n.value, give: new Set(), get: new Set() }; this.hub(); }, 'change');\n    ui.on('[data-tg]', (n) => { const s = this.tr[n.dataset.side]; if (n.checked) s.add(n.dataset.tg); else s.delete(n.dataset.tg); this.hub(); }, 'change');\n    ui.on('[data-offer]', () => {\n      const r = F.proposeTrade(f, this.tr.other, [...this.tr.give], [...this.tr.get]);\n      this.msg = r.why;\n      if (r.ok) { unlock('trade'); this.tr = { other: this.tr.other, give: new Set(), get: new Set() }; }\n      re();\n    });\n    ui.on('[data-back]', () => { this.card = null; this.hub(); });\n  }\n\n  homeHtml(g) {\n    const f = this.f, t = this.team, last = f.log[f.log.length - 1];\n    let next;\n    if (f.phase === 'fa') next = `<h4>Intersaison<\/h4><p>Le repêchage est terminé. Signe des agents libres, fais des échanges, puis commence la saison ${f.year + 1}.<\/p><p class=\"dim\">Au lancement, les effectifs de plus de ${F.MAX_ROSTER} joueurs sont ramenés à ${F.MAX_ROSTER} (les moins bons sont libérés).<\/p>`;\n    else if (!g) next = '<h4>Séries éliminatoires<\/h4><p>Ton équipe n\\'est plus en lice. Simule la suite pour connaître le champion.<\/p>';\n    else {\n      const o = f.teams[g.opp], r = f.table[g.opp];\n      next = `<h4>${g.series ? F.PO_ROUNDS[f.po.round] : 'Prochain match'}<\/h4><div class=\"next\">${logoImg(g.home ? o : t, 'lg-l')}<span>à<\/span>${logoImg(g.home ? t : o, 'lg-l')}<\/div>\n        <p><b>${g.home ? 'À domicile contre' : 'En visite chez'} ${esc(o.city)}<\/b><br>${esc(o.name)} (${r.w}-${r.l}-${r.otl}) · cote ${F.teamRating(o)}<\/p>\n        ${g.series ? `<p>Série 3 de 5 : <b>${g.series.a === f.user ? g.series.wa : g.series.wb}-${g.series.a === f.user ? g.series.wb : g.series.wa}<\/b><\/p>` : ''}\n        ${last && f.phase === 'season' ? `<p class=\"dim\">Dernier match : ${last.gf > last.ga ? 'victoire' : 'défaite'} ${last.gf}-${last.ga} ${last.home ? 'c.' : 'à'} ${esc(last.opp)}<\/p>` : ''}`;\n    }\n    const po = f.po ? `<h4>${F.PO_ROUNDS[f.po.round]}<\/h4><ul class=\"news\">${f.po.series.map((s) => `<li>${esc(f.teams[s.a].city)} <b>${s.wa}<\/b> – <b>${s.wb}<\/b> ${esc(f.teams[s.b].city)}${s.done ? ' ✓' : ''}<\/li>`).join('')}<\/ul>` : '';\n    const inj = t.players.filter((p) => p.inj > 0);\n    return `<div class=\"cols3\"><div>${next}<\/div>\n      <div>${po}<h4>Infirmerie<\/h4>${inj.length ? `<ul class=\"news\">${inj.map((p) => `<li>${esc(p.name)} (${POS[p.pos]}) — ${p.inj} match${p.inj > 1 ? 's' : ''}<\/li>`).join('')}<\/ul>` : '<p class=\"dim\">Aucun blessé.<\/p>'}\n        <h4>Meneurs de l'équipe<\/h4><ul class=\"news\">${[...t.players].filter((p) => p.pos !== 'G').sort((a, b) => b.st.g + b.st.a - a.st.g - a.st.a).slice(0, 3).map((p) => `<li>${esc(p.name)} — ${p.st.g} B, ${p.st.a} A<\/li>`).join('')}<\/ul><\/div>\n      <div><h4>Nouvelles<\/h4><ul class=\"news\">${f.news.slice(0, 8).map((n) => `<li>${esc(n)}<\/li>`).join('')}<\/ul><\/div><\/div>`;\n  }\n\n  slotMap() {\n    const t = this.team, m = {};\n    t.lines.F.forEach((l, i) => l.forEach((id) => { m[id] = `Trio ${i + 1}`; })); t.lines.D.forEach((l, i) => l.forEach((id) => { m[id] = `Duo ${i + 1}`; }));\n    m[t.lines.G[0]] = 'Partant'; m[t.lines.G[1]] = 'Auxiliaire';\n    return m;\n  }\n  rosterHtml() {\n    const t = this.team, m = this.slotMap(), order = F.lineupIds(t);\n    const list = [...t.players].sort((a, b) => (order.indexOf(a.id) < 0 ? 99 : order.indexOf(a.id)) - (order.indexOf(b.id) < 0 ? 99 : order.indexOf(b.id)) || b.ovr - a.ovr);\n    const row = (p) => `<tr class=\"${this.pick === p.id ? 'me' : ''}${p.inj > 0 ? ' inj' : ''}\"><td>${m[p.id] || '<i class=\"dim\">Réserve<\/i>'}<\/td>\n      <td class=\"l\"><button class=\"lnk\" data-card=\"${p.id}\">#${p.num} ${esc(p.name)}<\/button><\/td><td>${POS[p.pos]}<\/td><td>${p.age}<\/td><td><b>${p.ovr}<\/b><\/td><td>${p.pot}<\/td>\n      <td title=\"${Math.round(p.morale)}\">${mood(p.morale)}<\/td><td>${p.inj > 0 ? `🩹 ${p.inj}` : ''}<\/td><td>${money(p.con.sal)}<\/td><td>${p.con.yrs}<\/td>\n      ${p.pos === 'G' ? `<td>${p.st.gs}<\/td><td colspan=\"3\">${p.st.w} V · ${pct(p.st.sa ? 1 - p.st.ga / p.st.sa : 0)}<\/td>` : `<td>${p.st.gp}<\/td><td>${p.st.g}<\/td><td>${p.st.a}<\/td><td>${p.st.g + p.st.a}<\/td>`}\n      <td>${p.inj > 0 ? '' : `<button class=\"mini\" data-swap=\"${p.id}\">${this.pick === p.id ? 'Annuler' : this.pick ? 'Ici' : '⇄'}<\/button>`}<\/td><\/tr>`;\n    return `<p class=\"dim\">Pour changer l'alignement : clique ⇄ sur un joueur, puis « Ici » sur celui avec qui l'échanger (même groupe). Clique un nom pour sa fiche. <button class=\"mini\" data-auto>Alignement automatique<\/button><\/p>\n      <table class=\"ctable\"><tr><th>Rôle<\/th><th>Joueur<\/th><th>Pos<\/th><th>Âge<\/th><th>Cote<\/th><th>Pot.<\/th><th>Moral<\/th><th>Bl.<\/th><th>Salaire<\/th><th>Ans<\/th><th>PJ<\/th><th>B<\/th><th>A<\/th><th>PTS<\/th><th><\/th><\/tr>${list.map(row).join('')}<\/table>`;\n  }\n\n  cardHtml() {\n    const f = this.f, fa = f.fa.find((q) => q.id === this.card);\n    const x = fa ? { p: fa, t: { id: -1, abbr: 'AL', city: 'agent libre' } } : F.allPlayers(f).find((q) => q.p.id === this.card);\n    if (!x) { this.card = null; return ''; }\n    const p = x.p, mine = x.t.id === f.user, isG = p.pos === 'G', c = p.car;\n    const rows = [...p.hist, ...(p.st.gp ? [{ y: f.year, t: x.t.abbr, ...p.st }] : [])];\n    const keys = isG ? ['ref', 'pos'] : ATTRS;\n    return `<div class=\"row left\"><button class=\"mini\" data-back>← Retour<\/button>${mine ? `<button class=\"mini\" data-rel=\"${p.id}\">Libérer le joueur<\/button>` : ''}<\/div>\n      <div class=\"cols3\"><div><h4>#${p.num} ${esc(p.name)}<\/h4><p>${POS_LABELS[p.pos]} · ${esc(p.style)} · ${p.age} ans · ${esc(x.t.city)}<\/p>\n        <p>Cote <b>${p.ovr}<\/b> · potentiel ${p.pot} · moral ${Math.round(p.morale)} ${mood(p.morale)}<\/p><p>Contrat : ${money(p.con.sal)} · ${p.con.yrs} an${p.con.yrs > 1 ? 's' : ''}<\/p>\n        ${p.inj > 0 ? `<p class=\"msg\">Blessé : ${p.inj} match(s)<\/p>` : ''}${p.aw.length ? `<h4>Honneurs<\/h4><ul class=\"news\">${p.aw.map((a) => `<li>${esc(a)}<\/li>`).join('')}<\/ul>` : ''}<\/div>\n      <div><h4>Attributs<\/h4><table class=\"attrs\">${keys.map((k) => `<tr><td>${ATTR_LABELS[k]}<\/td><td>${bar((p.a[k] - 30) / 69)}<\/td><td><b>${p.a[k]}<\/b><\/td><\/tr>`).join('')}<\/table><\/div>\n      <div><h4>Carrière<\/h4><table class=\"ctable\"><tr><th>An<\/th><th>Éq.<\/th><th>PJ<\/th>${isG ? '<th>V<\/th><th>% arr.<\/th>' : '<th>B<\/th><th>A<\/th><th>PTS<\/th><th>+/-<\/th>'}<\/tr>\n        ${rows.map((r) => `<tr><td>${r.y}<\/td><td>${esc(r.t)}<\/td><td>${r.gp}<\/td>${isG ? `<td>${r.w}<\/td><td>${pct(r.sa ? 1 - r.ga / r.sa : 0)}<\/td>` : `<td>${r.g}<\/td><td>${r.a}<\/td><td>${r.g + r.a}<\/td><td>${r.pm}<\/td>`}<\/tr>`).join('')}\n        <tr class=\"tot\"><td colspan=\"2\">Total<\/td><td>${c.gp + p.st.gp}<\/td>${isG ? `<td>${c.w + p.st.w}<\/td><td>${pct(c.sa + p.st.sa ? 1 - (c.ga + p.st.ga) / (c.sa + p.st.sa) : 0)}<\/td>` : `<td>${c.g + p.st.g}<\/td><td>${c.a + p.st.a}<\/td><td>${c.g + c.a + p.st.g + p.st.a}<\/td><td><\/td>`}<\/tr><\/table>\n        <p class=\"dim\">Le total inclut les saisons jouées avant le début de la franchise.<\/p><\/div><\/div>`;\n  }\n\n  tableHtml() {\n    const f = this.f, cut = f.phase === 'season';\n    const conf = (c) => `<div><h4>Association de l'${c}<\/h4><table class=\"ctable\"><tr><th><\/th><th>Équipe<\/th><th>PJ<\/th><th>V<\/th><th>D<\/th><th>DP<\/th><th>PTS<\/th><th>BP<\/th><th>BC<\/th><\/tr>\n      ${F.standings(f, c).map((r, i) => `<tr class=\"${r.me ? 'me' : ''}${cut && i === 3 ? ' cut' : ''}\"><td>${i + 1}<\/td><td class=\"l\">${logoImg(r.team, 'lg-s')} ${esc(r.team.city)}<\/td><td>${r.gp}<\/td><td>${r.w}<\/td><td>${r.l}<\/td><td>${r.otl}<\/td><td><b>${r.pts}<\/b><\/td><td>${r.gf}<\/td><td>${r.ga}<\/td><\/tr>`).join('')}<\/table><\/div>`;\n    return `<div class=\"cols2\">${conf('Est')}${conf('Ouest')}<\/div><p class=\"dim\">Les 4 premières équipes de chaque association participent aux séries (3 de 5). DP : défaite en prolongation.<\/p>`;\n  }\n\n  leadersHtml() {\n    const f = this.f;\n    const col = (title, key, fmt) => `<div><h4>${title}<\/h4><table class=\"ctable\">${F.leaders(f, key, 8).map((x, i) => `<tr class=\"${x.t.id === f.user ? 'me' : ''}\"><td>${i + 1}<\/td><td class=\"l\"><button class=\"lnk\" data-card=\"${x.p.id}\">${esc(x.p.name)}<\/button> <i class=\"dim\">${esc(x.t.abbr)}<\/i><\/td><td><b>${fmt ? fmt(x.v) : x.v}<\/b><\/td><\/tr>`).join('')}<\/table><\/div>`;\n    return `<div class=\"cols4\">${col('Points', 'pts')}${col('Buts', 'g')}${col('Aides', 'a')}${col('Plus/moins', 'pm')}${col('Mises en échec', 'hits')}${col('Victoires (gardiens)', 'w')}${col('% d\\'arrêts', 'svp', pct)}${col('Jeux blancs', 'so')}<\/div>`;\n  }\n\n  tradeHtml() {\n    const f = this.f, t = this.team;\n    if (!this.tr) this.tr = { other: f.user === 0 ? 1 : 0, give: new Set(), get: new Set() };\n    const tr = this.tr, o = f.teams[tr.other];\n    const col = (team, side) => `<div><h4>${esc(team.city)} <small>masse ${money(F.payroll(team))} · ${ord(F.rankOf(f, team.id))} rang<\/small><\/h4><div class=\"tlist\">${[...team.players].sort((a, b) => b.ovr - a.ovr).map((p) => `<label><input type=\"checkbox\" data-tg=\"${p.id}\" data-side=\"${side}\" ${tr[side].has(p.id) ? 'checked' : ''}> ${esc(p.name)} <i>${POS[p.pos]} · ${p.age} ans · <b>${p.ovr}<\/b>/${p.pot} · ${money(p.con.sal)} × ${p.con.yrs}<\/i><\/label>`).join('')}<\/div><\/div>`;\n    const sum = (team, set) => [...set].reduce((s, id) => s + F.byId(team, id).con.sal, 0);\n    return `<p>Échanger avec <select data-to>${f.teams.map((q, i) => (i === f.user ? '' : `<option value=\"${i}\" ${i === tr.other ? 'selected' : ''}>${esc(q.city)} ${esc(q.name)}<\/option>`)).join('')}<\/select>\n      <button class=\"mini\" data-offer ${tr.give.size && tr.get.size ? '' : 'disabled'}>Proposer l'échange<\/button>\n      <span class=\"dim\">Tu cèdes ${money(sum(t, tr.give))} · tu reçois ${money(sum(o, tr.get))} · espace actuel ${money(F.capRoom(f, t))}<\/span><\/p>\n      <div class=\"cols2\">${col(t, 'give')}${col(o, 'get')}<\/div>\n      <p class=\"dim\">Chaque DG évalue l'offre selon sa situation : les équipes de tête veulent des joueurs prêts à gagner, celles du bas du classement veulent des jeunes à fort potentiel et se méfient des contrats trop chers.<\/p>`;\n  }\n\n  faHtml() {\n    const f = this.f, t = this.team, room = F.capRoom(f, t);\n    return `<p class=\"dim\">Espace sous le plafond : <b>${money(room)}<\/b> · effectif ${t.players.length}/${F.MAX_ROSTER}. Contrat de 2 ans (1 an à 32 ans et plus).<\/p>\n      <table class=\"ctable\"><tr><th>Joueur<\/th><th>Pos<\/th><th>Âge<\/th><th>Cote<\/th><th>Pot.<\/th><th>Style<\/th><th>Demande<\/th><th><\/th><\/tr>\n      ${[...f.fa].sort((a, b) => b.ovr - a.ovr).map((p) => `<tr><td class=\"l\"><button class=\"lnk\" data-card=\"${p.id}\">${esc(p.name)}<\/button><\/td><td>${POS[p.pos]}<\/td><td>${p.age}<\/td><td><b>${p.ovr}<\/b><\/td><td>${p.pot}<\/td><td>${esc(p.style)}<\/td><td>${money(F.ask(p))}<\/td>\n        <td><button class=\"mini\" data-sign=\"${p.id}\" ${F.ask(p) > room || t.players.length >= F.MAX_ROSTER ? 'disabled' : ''}>Signer<\/button><\/td><\/tr>`).join('')}<\/table>`;\n  }\n\n  prospects(pickable) {\n    const f = this.f;\n    return `<table class=\"ctable\"><tr><th>Espoir<\/th><th>Pos<\/th><th>Région<\/th><th>Cote estimée<\/th><th>Potentiel estimé<\/th><th>Rapports<\/th>${pickable ? '<th><\/th>' : ''}<\/tr>\n      ${[...f.draft].sort((a, b) => F.estimate(b).pot[0] + F.estimate(b).pot[1] - F.estimate(a).pot[0] - F.estimate(a).pot[1]).map((p) => {\n        const e = F.estimate(p);\n        return `<tr><td class=\"l\">${esc(p.name)}<\/td><td>${POS[p.pos]}<\/td><td>${REG[p.region]}<\/td><td>${e.ovr[0]}–${e.ovr[1]}<\/td><td><b>${e.pot[0]}–${e.pot[1]}<\/b><\/td><td>${bar(Math.min(1, p.seen / 27), e.err <= 3 ? 'good' : '')}<\/td>${pickable ? `<td><button class=\"mini\" data-pick=\"${p.id}\">Repêcher<\/button><\/td>` : ''}<\/tr>`;\n      }).join('')}<\/table>`;\n  }\n  scoutHtml() {\n    const f = this.f;\n    return `<p>Tes trois dépisteurs suivent chacun une région. Plus une région est suivie longtemps, plus les fourchettes de ses espoirs se resserrent.<\/p>\n      <p>${f.scouts.map((s, i) => `Dépisteur ${i + 1} <select data-sc=\"${i}\">${REG.map((r, k) => `<option value=\"${k}\" ${k === s ? 'selected' : ''}>${r}<\/option>`).join('')}<\/select>`).join(' &nbsp; ')}<\/p>\n      ${f.draft.length ? this.prospects(false) : '<p class=\"dim\">La prochaine cuvée sera connue au début de la saison.<\/p>'}`;\n  }\n\n  histHtml() {\n    const f = this.f;\n    const seasons = f.history.length ? f.history.map((h) => `<div class=\"hyear\"><b>Saison ${h.year}<\/b> — ${F.CUP} : <b class=\"${h.mine ? 'gold' : ''}\">${esc(h.champName)}<\/b> <span class=\"dim\">· ton équipe : ${ord(h.rank)} rang<\/span>\n      <ul class=\"news\">${h.awards.map((a) => `<li class=\"${a.mine ? 'gold' : ''}\">${F.TROPHIES[a.k]} : ${esc(a.name)} (${esc(a.team)}) — ${a.line}<\/li>`).join('')}<\/ul><\/div>`).join('') : '<p class=\"dim\">Aucune saison terminée.<\/p>';\n    const hof = f.hof.length ? `<table class=\"ctable\"><tr><th>Membre<\/th><th>Pos<\/th><th>Dernière équipe<\/th><th>Intronisé<\/th><th>PJ<\/th><th>B<\/th><th>A<\/th><th>PTS / V<\/th><th>Trophées<\/th><\/tr>\n      ${f.hof.map((h) => `<tr><td class=\"l\">${esc(h.name)}<\/td><td>${POS[h.pos]}<\/td><td>${esc(h.team)}<\/td><td>an ${h.year}<\/td><td>${h.gp}<\/td><td>${h.pos === 'G' ? '' : h.g}<\/td><td>${h.pos === 'G' ? '' : h.a}<\/td><td><b>${h.pos === 'G' ? h.w + ' V' : h.g + h.a}<\/b><\/td><td>${h.aw}<\/td><\/tr>`).join('')}<\/table>` : '<p class=\"dim\">Aucun membre pour l\\'instant. Les grands joueurs y entrent à leur retraite.<\/p>';\n    return `<div class=\"cols2\"><div><h4>Champions et trophées<\/h4>${seasons}<\/div><div><h4>Temple de la renommée<\/h4>${hof}<\/div><\/div>`;\n  }\n\n  // ---------- fin de saison ----------\n  awards() {\n    const f = this.f, ui = this.ui, h = f.history[0], c = f.teams[f.champ];\n    ui.back = null;\n    ui.show(`<h1>${F.CUP} — saison ${f.year}<\/h1>\n      <div class=\"draft\"><div class=\"pick\" style=\"--c1:${c.colors[0]}\">${logoImg(c, 'lg-l')}<p>Champions de la ${F.CUP}<\/p><h2>${esc(c.city)} ${esc(c.name)}<\/h2>${h.mine ? '<p class=\"lvl\">C\\'est ton équipe. Félicitations !<\/p>' : `<p class=\"dim\">Ton équipe a terminé au ${ord(h.rank)} rang.<\/p>`}<\/div>\n        <div class=\"cbody\" style=\"width:560px\"><h4>Trophées de fin de saison<\/h4><ul class=\"news\">${h.awards.map((a) => `<li class=\"${a.mine ? 'gold' : ''}\"><b>${F.TROPHIES[a.k]}<\/b><br>${esc(a.name)} (${esc(a.team)}) — ${a.line}<\/li>`).join('')}<\/ul><\/div><\/div>\n      <div class=\"row\"><button data-a=\"go\" data-focus class=\"primary\">Passer à l'intersaison<\/button><\/div>`, 'career');\n    ui.on('[data-a]', () => { F.beginOffseason(f); this.save(); this.route(); });\n  }\n\n  resign() {\n    const f = this.f, ui = this.ui, t = this.team, ex = F.expiring(f);\n    ui.back = null;\n    const hof = f.retired.filter((r) => r.hof), mine = f.retired.filter((r) => r.mine);\n    ui.show(`<h1>Intersaison — contrats échus<\/h1>${this.head()}\n      <div class=\"cbody\">${this.msg ? `<p class=\"msg\">${esc(this.msg)}<\/p>` : ''}\n        <p class=\"dim\">${f.retired.length} joueurs ont pris leur retraite dans la ligue${mine.length ? ` (dans ton équipe : ${mine.map((r) => esc(r.name)).join(', ')})` : ''}.${hof.length ? ` Intronisés au Temple de la renommée : ${hof.map((r) => esc(r.name)).join(', ')}.` : ''} Les jeunes ont progressé et les vétérans ont décliné.<\/p>\n        ${ex.length ? `<table class=\"ctable\"><tr><th>Joueur<\/th><th>Pos<\/th><th>Âge<\/th><th>Cote<\/th><th>Pot.<\/th><th>Moral<\/th><th>Ancien salaire<\/th><th>Demande<\/th><th>Prolonger<\/th><\/tr>\n          ${ex.map((p) => `<tr><td class=\"l\">${esc(p.name)}<\/td><td>${POS[p.pos]}<\/td><td>${p.age}<\/td><td><b>${p.ovr}<\/b><\/td><td>${p.pot}<\/td><td>${mood(p.morale)}<\/td><td>${money(p.con.sal)}<\/td><td><b>${money(F.ask(p))}<\/b><\/td>\n            <td>${[1, 2, 3, 4].map((y) => `<button class=\"mini\" data-rs=\"${p.id},${y}\">${y} an${y > 1 ? 's' : ''}<\/button>`).join(' ')}<\/td><\/tr>`).join('')}<\/table>\n          <p class=\"dim\">Les joueurs non prolongés deviennent agents libres. Un joueur mécontent demande 25 % de plus.<\/p>` : '<p>Tous tes joueurs sont sous contrat.<\/p>'}<\/div>\n      <div class=\"row\">${ex.length ? '<button data-all>Tout prolonger pour 2 ans<\/button>' : ''}<button data-a=\"go\" data-focus class=\"primary\">Passer au repêchage<\/button><\/div>`, 'career');\n    this.msg = null;\n    ui.on('[data-all]', () => {\n      let miss = 0;\n      for (const p of [...ex].sort((x, y) => y.ovr - x.ovr)) if (!F.resign(f, p.id, 2)) miss++;\n      if (miss) this.msg = `Plafond atteint : ${miss} joueur${miss > 1 ? 's' : ''} non prolongé${miss > 1 ? 's' : ''}.`;\n      this.save(); this.resign();\n    });\n    ui.on('[data-rs]', (n) => { const [id, y] = n.dataset.rs.split(','); if (!F.resign(f, id, +y)) this.msg = 'Pas assez d\\'espace sous le plafond salarial pour ce contrat.'; this.save(); this.resign(); });\n    ui.on('[data-a]', (n) => {\n      const left = F.expiring(f).length;\n      if (left && !n.dataset.sure) { n.dataset.sure = 1; n.textContent = `Confirmer : laisser partir ${left} joueur${left > 1 ? 's' : ''}`; return; }\n      F.endResign(f); this.save(); this.route();\n    });\n  }\n\n  draft() {\n    const f = this.f, ui = this.ui, d = f.dr;\n    ui.back = null;\n    ui.show(`<h1>Repêchage — saison ${f.year}<\/h1>\n      <p><b>À toi de choisir<\/b> : ${ord(d.pick + 1)} choix au total (${d.pick < 16 ? '1re' : '2e'} ronde). ${d.log.length ? `Déjà choisis : ${d.log.slice(-4).map((l) => `${l.n}. ${esc(l.name)} (${esc(l.team)})`).join(' · ')}` : 'Tu as le tout premier choix.'}<\/p>\n      <div class=\"cbody\">${this.prospects(true)}<\/div>\n      <div class=\"foot\">Les fourchettes viennent de tes dépisteurs : plus elles sont étroites, plus l'évaluation est sûre.<\/div>`, 'career');\n    ui.on('[data-pick]', (n) => { F.draftPick(f, n.dataset.pick); this.save(); this.tab = 'home'; this.route(); });\n  }\n}\nconst REG = F.REGIONS;\n", "js/ui/hud.js": "// Affichage en match : pointage, chronomètre, pénalités, endurance, puissance, commentaires, mini-jeux\nimport { PENALTY_NAMES } from '../core/config.js';\nimport { keyName, TOUCH } from '../engine/input.js';\n\nconst $ = (id) => document.getElementById(id);\n// n'écrit le texte que s'il change (évite de recalculer la mise en page à chaque image, utile sur t v id=\"rpT\"><\/div><div id=\"rpS\"><\/div><\/div>\n      <div id=\"star\"><\/div>\n      <div id=\"car\"><\/div>\n      <div id=\"toast\"><\/div>`;\n    this.bigT = 0; this.tickT = 0; this.toastT = 0; this.cardT = 0; this.tickP = 0; this.tickAge = 9; this.match = null;\n  }\n\n  setMatch(m) {\n    this.match = m;\n    const [a, b] = m.teams;\n    for (const [el, t] of [[$('sbA'), a], [$('sbB'), b]]) {\n      el.querySelector('.chip').style.background = t.data.colors[0];\n      el.querySelector('.chip').style.borderColor = t.data.colors[1];\n      el.querySelector('.ab').textContent = t.data.abbr;\n    }\n    $('ticker').textContent = ''; $('big').className = ''; this.bigT = 0;\n    $('fight').className = ''; $('so').innerHTML = ''; $('card').className = ''; $('rp').className = ''; $('star').className = '';\n    this.soHtml = ''; this.tickP = 0;\n    m.on((type, d) => this.onEvent(type, d));\n    this.say(m.mode === 'practice' ? 'Entraînement libre : lancers, passes et feintes à volonté.' : `${a.data.city} reçoit ${b.data.city}. Bon match !`);\n  }\n\n  // Panneau du mode Carrière (note, objectif, capacité)\n  career(html) {\n    if (this.carHtml === html) return;\n    this.carHtml = html; $('car').innerHTML = html; $('car').className = html ? 'on' : '';\n  }\n\n  big(title, sub = '', dur = 2.4, cls = '') {\n    $('bigT').textContent = title; $('bigS').textContent = sub;\n    $('big').className = 'on ' + cls; this.bigT = dur;\n  }\n  // Bandeau de commentaires : une ligne moins importante ne remplace pas tout de suite un moment clé\n  say(txt, prio = 2) {\n    if (prio < this.tickP && this.tickAge < 1.4) return;\n    const t = $('ticker'); t.textContent = txt; t.className = 'on' + (prio >= 3 ? ' key' : '');\n    this.tickT = prio >= 3 ? 5.5 : 4; this.tickP = prio; this.tickAge = 0;\n  }\n  card(title, text) { $('cardT').textContent = title; $('cardS').textContent = text; $('card').className = 'on'; this.cardT = 4.5; }\n  replay(r) {\n    const el = $('rp');\n    this.root.classList.toggle('replaying', !!r);\n    if (!r) { el.className = ''; return; }\n    $('rpT').textContent = r.title;\n    $('rpS').textContent = `${r.shot.label} · angle ${r.n}/${r.total} · ${TOUCH.on ? 'touche « Passer » pour la sauter' : `[${keyName(this.set.keys.slap)}] pour passer`}`;\n    el.className = 'on';\n  }\n  star(rank, e) {\n    const el = $('star');\n    this.root.classList.toggle('replaying', !!e);\n    if (!e) { el.className = ''; return; }\n    const st = e.pl.st, line = e.pl.pos === 'G' ? `${st.sv} arrêts sur ${st.sa} tirs` : `${st.g} but${st.g > 1 ? 's' : ''}, ${st.a} aide${st.a > 1 ? 's' : ''}, ${st.sog} tir${st.sog > 1 ? 's' : ''}`;\n    el.innerHTML = `<div class=\"rk\">${'★'.repeat(4 - rank)}<\/div><div class=\"lb\">${rank === 1 ? 'PREMIÈRE' : rank === 2 ? 'DEUXIÈME' : 'TROISIÈME'} ÉTOILE<\/div><div class=\"nm\"><\/div><div class=\"tm\"><\/div><div class=\"ln\">${line}<\/div>`;\n    el.querySelector('.nm').textContent = `#${e.pl.num} ${e.pl.name}`;\n    el.querySelector('.tm').textContent = `${e.team.data.city} ${e.team.data.name}`;\n    el.className = 'on';\n  }\n  toast(txt) { const t = $('toast'); t.textContent = txt; t.className = 'on'; this.toastT = 1.6; }\n\n  // Grands messages et mini-jeux (les commentaires du bandeau sont dans commentary.js)\n  onEvent(type, d) {\n    const m = this.match, k = this.set.keys;\n    switch (type) {\n      case 'faceoffEarly': if (d.side == null || d.side === this.match.userTeam) this.toast('Trop tôt ! Mise au jeu perdue'); break;\n      case 'post': this.toast(d.bar ? 'Barre horizontale !' : 'Poteau !'); break;\n      case 'breakaway': if (d.by.team.isUser) this.toast('Échappée !'); break;\n      case 'penalty': this.big('PÉNALITÉ', `${d.pl.name} (${d.team.data.abbr}) — ${PENALTY_NAMES[d.type]}, ${d.min} minutes`, 2.6, 'warn'); break;\n      case 'whistle': {\n        const msg = { offside: ['HORS-JEU', 'Mise au jeu en zone neutre'], icing: ['DÉGAGEMENT REFUSÉ', 'Mise au jeu en zone défensive'],\n          out: ['RONDELLE HORS JEU', ''], freeze: ['ARRÊT DE JEU', 'Le gardien immobilise la rondelle'] }[d.reason];\n        if (msg) this.big(msg[0], msg[1], 1.7);\n        break;\n      }\n      case 'offsideDelayed': this.toast('Hors-jeu à retardement'); break;\n      case 'goal': {\n        const as = d.assists.length ? ` (${d.assists.map(last).join(', ')})` : ' (sans aide)';\n        this.big('BUT !', d.scorer ? `${d.scorer.name}${m.mode === 'practice' ? '' : as}` : '', 4.2, 'goal');\n        const el = $(d.team.idx === 0 ? 'sbA' : 'sbB'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');\n        break;\n      }\n      case 'periodEnd': this.big(d.period <= 3 ? `FIN DE LA ${periodName(d.period).toUpperCase()} PÉRIODE` : 'FIN DE LA PROLONGATION', `${m.teams[0].data.abbr} ${m.teams[0].score} — ${m.teams[1].score} ${m.teams[1].data.abbr}`, 3.6); break;\n      case 'goaliePulled': this.toast(`${d.team.data.abbr} : filet désert`); break;\n      case 'lineChange': if (d.team.isUser) this.toast('Changement de trio'); break;\n      case 'fightStart':\n        $('fgA').textContent = d.a.p.name; $('fgB').textContent = d.o.p.name;\n        $('fgHelp').textContent = d.userSide >= 0 ? `[${keyName(k.wrist)}] Frapper   [${keyName(k.pass)}] Bloquer (quand l'adversaire arme son coup)` : '';\n        $('fight').className = 'on'; break;\n      case 'fightWindup': if (m.fight && m.fight.userSide >= 0) this.toast('Il arme son coup — BLOQUE !'); break;\n      case 'fightEnd': $('fight').className = ''; this.big('FIN DU COMBAT', `${d.winner.p.name} l'emporte — 5 minutes chacun`, 2.4, 'warn'); break;\n      case 'shootoutStart': this.big('TIRS DE BARRAGE', '', 2); break;\n      case 'attemptStart': if (d.kind === 'ps') this.big('TIR DE PÉNALITÉ', d.shooter.name, 1.4, 'warn'); break;\n      case 'attemptEnd': this.big(d.result === 'goal' ? 'BUT !' : d.result === 'save' ? 'ARRÊT !' : 'RATÉ !', d.shooter.name, 2, d.result === 'goal' ? 'goal' : ''); break;\n      case 'final': this.big('MATCH TERMINÉ', `${m.winner.data.city} ${m.winner.data.name} l'emportent !`, 5, 'goal'); break;\n    }\n  }\n\n  update(m, dt) {\n    const [a, b] = m.teams, k = this.set.keys;\n    setText($('sbA').querySelector('.sc'), a.score); setText($('sbB').querySelector('.sc'), b.score);\n    setText($('sbPer'), m.mode === 'practice' ? 'ENTR.' : periodName(m.period));\n    setText($('sbClk'), m.mode === 'practice' || m.period === 5 ? '—' : mmss(m.clock));\n    // pénalités et avantage numérique\n    let info = '';\n    if (m.mode === 'game') {\n      const na = m.skaterCount(a) - (a.pulled ? 1 : 0), nb = m.skaterCount(b) - (b.pulled ? 1 : 0);\n      const pens = (t) => t.pens.map((q) => `<span class=\"pen\">#${q.pl.num} ${mmss(q.remain)}<\/span>`).join('');\n      const mid = na !== nb ? `<b class=\"pp\">${na > nb ? a.data.abbr : b.data.abbr} — AVANTAGE NUMÉRIQUE ${Math.max(na, nb)} c. ${Math.min(na, nb)}<\/b>` : (a.pens.length || b.pens.length) && na < m.set.skaters ? `<b>${na} c. ${nb}<\/b>` : '';\n      const en = (a.pulled ? `<b class=\"pp\">${a.data.abbr} FILET DÉSERT<\/b>` : '') + (b.pulled ? `<b class=\"pp\">${b.data.abbr} FILET DÉSERT<\/b>` : '');\n      info = `<div>${pens(a)}<\/div><div>${mid}${en}<\/div><div>${pens(b)}<\/div>`;\n    }\n    if (this.infoHtml !== info) { this.infoHtml = info; $('sbInfo').innerHTML = info; }\n    let fl = '';\n    if (m.pending.length && m.state === 'play') fl += '<span class=\"warn\">PÉNALITÉ À RETARDEMENT<\/span>';\n    if ((m.offD[0] || m.offD[1]) && m.state === 'play') fl += '<span>HORS-JEU À RETARDEMENT<\/span>';\n    if (this.flHtml !== fl) { this.flHtml = fl; $('flags').innerHTML = fl; }\n    // joueur contrôlé\n    const ub = m.userBody, pl = $('pl');\n    if (ub && ub.active && ub.p) {\n      pl.className = 'on';\n      setText($('plName'), `#${ub.p.num} ${ub.p.name} · ${ub.role === 'X' ? 'ATT' : ub.role.replace('LD', 'DG').replace('RD', 'DD').replace('LW', 'AG').replace('RW', 'AD')}`);\n      c  de choix des équipes\nimport { getTeams } from '../data/teams.js';\nimport { hostGame, joinGame, cleanCode } from '../net/peer.js';\nimport { DIFFS } from '../core/config.js';\n\nconst esc = (s) => String(s).replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n// une équipe reçue de l'autre ordinateur doit avoir la forme attendue par le moteur\nconst validTeam = (t) => t && typeof t === 'object' && Array.isArray(t.players) && t.players.length === 20 && t.lines && t.lines.F && t.lines.F.length === 4\n  && t.lines.D && t.lines.D.length === 3 && t.lines.G && t.lines.G.length === 2 && Array.isArray(t.colors) && t.colors.length === 3;\nconst RULES = ['periodMin', 'skaters', 'offside', 'icing', 'penalties', 'autoLines', 'difficulty'];\n\nexport class OnlineUI {\n  constructor(ui) { this.ui = ui; this.link = null; this.role = null; this.pick = 0; this.theirs = null; this.pending = null; this.inLobby = false;\n    addEventListener('pagehide', () => { if (this.link) this.link.send({ k: 'bye' }); }); // fermeture de l'onglet : prévenir l'ami\n  }\n  get app() { return this.ui.app; }\n\n  // ---------- accueil ----------\n  menu(msg = '') {\n    const ui = this.ui;\n    this.leave();\n    ui.back = () => ui.main();\n    ui.show(`<h1>Jouer en ligne<\/h1>\n      <div class=\"online\">\n        <div class=\"ocard\"><h3>Créer une partie<\/h3><p>Tu obtiens un code de 5 lettres à donner à ton ami.<\/p><button data-a=\"host\" class=\"primary\" data-focus>Créer une partie<\/button><\/div>\n        <div class=\"ocard\"><h3>Rejoindre une partie<\/h3><p>Entre le code que ton ami t'a donné.<\/p>\n          <input type=\"text\" data-code maxlength=\"7\" placeholder=\"CODE\" autocomplete=\"off\" autocapitalize=\"characters\" autocorrect=\"off\" enterkeyhint=\"go\" spellcheck=\"false\">\n          <div class=\"row\">${navigator.clipboard && navigator.clipboard.readText ? '<button data-a=\"paste\">Coller<\/button>' : ''}<button data-a=\"join\">Rejoindre<\/button><\/div><\/div>\n      <\/div>\n      ${msg ? `<p class=\"msg\">${esc(msg)}<\/p>` : ''}\n      <div class=\"row\"><button data-a=\"back\">Retour<\/button><\/div>\n      <div class=\"foot\">Chacun joue sur son ordinateur, sa tablette ou son téléphone. L'hôte fait tourner la partie : il doit garder la fenêtre du jeu visible.<\/div>`, 'career');\n    const inp = ui.el.querySelector('[data-code]');\n    inp.addEventListener('input', () => { const p = inp.selectionStart; inp.value = cleanCode(inp.value); inp.setSelectionRange(p, p); });\n    inp.addEventListener('keydown', (e) => { if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.key === 'Enter') { e.preventDefault(); this.join(inp.value); } e.stopPropagation(); });\n    ui.on('[data-a]', (n) => {\n      const a = n.dataset.a;\n      if (a === 'back') ui.main(); else if (a === 'host') this.host();\n      else if (a === 'paste') navigator.clipboard.readText().then((x) => { inp.value = cleanCode(x); if (inp.value.length === 5) this.join(inp.value); }).catch(() => inp.focus());\n      else this.join(inp.value);\n    });\n  }\n\n  wait(title, text, code = '') {\n    const ui = this.ui;\n    ui.back = () => this.menu();\n    ui.show(`<h1>${esc(title)}<\/h1>${code ? `<div class=\"bigcode\">${esc(code)}<\/div><div class=\"row\"><button data-a=\"copy\">Copier le code<\/button>${/^https?:$/.test(location.protocol) ? '<button data-a=\"copylink\">Copier le lien<\/button>' : ''}${navigator.share ? '<button data-a=\"share\">Partager<\/button>' : ''}<\/div>` : ''}\n      <p class=\"dim spin\">${esc(text)}<\/p><div class=\"row\"><button data-a=\"cancel\" ${code ? '' : 'data-focus'}>Annuler<\/button><\/div>`, 'career');\n    ui.on('[data-a=\"copy\"]', (n) => {\n      const ok = () => { n.textContent = 'Code copié ✓'; }, ko = () => { n.textContent = 'Copie impossible : note le code'; };\n      try { const p = navigator.clipboard.writeText(code); if (p && p.then) p.then(ok, ko); else ok(); } catch { ko() ding) { this.pending.cancel(); this.pending = null; }\n    if (this.link) { const l = this.link; this.link = null; l.send({ k: 'bye' }); setTimeout(() => l.close(), 200); }\n    this.theirs = null; this.inLobby = false;\n  }\n\n  connected(link) {\n    this.link = link; this.pending = null; this.theirs = null;\n    link.onMessage = (msg) => this.onMessage(msg);\n    link.onClose = () => this.lost('La connexion avec ton ami a été perdue.');\n    this.sendPick();\n    this.lobby();\n  }\n\n  lost(text) {\n    if (!this.link) return;\n    this.link = null;\n    if (this.app.net) this.app.endOnline();\n    this.menu(text);\n  }\n\n  onMessage(msg) {\n    const app = this.app;\n    if (app.net && (msg.k === 'f' || msg.k === 'S' || msg.k === 'e' || msg.k === 'i')) { app.net.onMessage(msg); return; }\n    if (msg.k === 'pick' && validTeam(msg.team)) { this.theirs = msg.team; if (this.inLobby) this.lobby(); }\n    else if (msg.k === 'start' && this.role === 'guest' && validTeam(msg.home) && validTeam(msg.away)) this.startGuest(msg);\n    else if (msg.k === 'lobby' && app.net) { app.endOnline(); this.lobby(msg.why === 'quit' ? 'Ton ami a quitté le match.' : ''); }\n    else if (msg.k === 'bye') { const l = this.link; this.link = null; if (l) l.close(); if (app.net) app.endOnline(); this.menu('Ton ami a quitté la partie.'); }\n  }\n\n  myTeam() { const t = getTeams(); if (this.pick >= t.length) this.pick = 0; return t[this.pick]; }\n  sendPick() { if (this.link) this.link.send({ k: 'pick', team: this.myTeam() }); }\n\n  // ---------- salon ----------\n  lobby(msg = '') {\n    const ui = this.ui, host = this.role === 'host', me = this.myTeam(), th = this.theirs, st = this.app.settings;\n    if (!this.link) return this.menu();\n    this.inLobby = true;\n    ui.back = () => this.menu();\n    const same = th && th.city === me.city && th.name === me.name;\n    const ping = (this.link.ping ? `${Math.round(this.link.ping)} ms` : '…') + (this.link.via === 'relais' ? ' · via le relais' : ' · connexion directe');\n    const rules = `Périodes de ${st.periodMin} min · ${st.skaters} contre ${st.skaters} · hors-jeu ${st.offside ? 'oui' : 'non'} · dégagement refusé ${st.icing ? 'oui' : 'non'} · pénalités ${st.penalties ? 'oui' : 'non'}`;\n    ui.show(`<h1>Salon en ligne <small>${host ? 'tu es l\\'hôte' : 'tu es l\\'invité'} · ping ${ping}<\/small><\/h1>\n      <div class=\"vs\">\n        <div class=\"pick\"><button data-d=\"-1\">◀<\/button>${ui.teamCard(me, host ? 'TOI · domicile' : 'TOI · visiteur')}<button data-d=\"1\">▶<\/button><\/div>\n        <div class=\"mid\">VS<\/div>\n        <div class=\"pick\">${th ? ui.teamCard(th, host ? 'TON AMI · visiteur' : 'TON AMI · domicile') : '<div class=\"card\"><p class=\"dim\">Ton ami choisit son équipe…<\/p><\/div>'}<\/div>\n      <\/div>\n      ${msg ? `<p class=\"msg\">${esc(msg)}<\/p>` : ''}${same ? '<p class=\"msg\">Vous avez choisi la même équipe : l\\'un de vous doit en changer.<\/p>' : ''}\n      <div class=\"row\">${host ? `<button data-a=\"go\" class=\"primary\" data-focus ${th && !same ? '' : 'disabled'}>Sur la glace !<\/button>` : '<p class=\"dim\">L\\'hôte lancera la partie quand vous serez prêts.<\/p>'}<button data-a=\"quit\">Quitter le salon<\/button><\/div>\n      <div class=\"foot\">${host ? `Règles de la partie (tes options) : ${rules}` : 'Les règles et la durée des périodes sont celles de l\\'hôte.'} · pas de bagarres ni de reprises en ligne<\/div>`, 'select');\n    if (!host || !th) { const f = ui.el.querySelector('[data-d=\"1\"]'); if (f) f.focus(); }\n    ui.on('[data-d]', (n) => { const n2 = getTeams().length; this.pick = (this.pick + +n.dataset.d + n2) % n2; this.sendPick(); this.lobby(); const b = ui.el.querySelector(`[data-d=\"${n.dataset.d}\"]`); if (b) b.focus(); });\n    ui.on('[data-a]', (n) => {\n      if (n.dataset.a === 'quit') return this.menu();\n      // l'hôte lance : il envoie les deux équipes et ses règles\n      const set = {}; for (const k of RULES) set[k] = st[k];\n
