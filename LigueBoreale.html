<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ligue Boréale">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <title>Ligue Boréale — Hockey 3D</title>
  <style>
:root { --ink: #eaf3ff; --dim: #8fa6c4; --acc: #35c8ff; --gold: #ffd21f; --panel: rgba(8, 16, 30, .82); --line: rgba(120, 170, 230, .25); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#boot { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #05070b; }
#boot b { font-size: 44px; font-style: italic; font-weight: 900; letter-spacing: 1px; } #boot b span { color: var(--acc); }
#boot small { color: var(--dim); letter-spacing: 3px; text-transform: uppercase; font-size: 12px; animation: blink .7s infinite alternate; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; display: none; }
#hud.on { display: block; }
#sb { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); font-weight: 800; }
#sb .tm { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 20px; min-width: 132px; }
#sbB { justify-content: flex-end; }
#sb .chip { width: 16px; height: 26px; border-radius: 3px; border: 3px solid #fff; }
#sb .sc { font-size: 28px; min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
#sbMid { background: rgba(53, 200, 255, .12); padding: 5px 18px; text-align: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 96px; }
#sbPer { font-size: 12px; letter-spacing: 2px; color: var(--acc); }
#sbClk { font-size: 24px; font-variant-numeric: tabular-nums; }
#sbInfo { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; font-size: 13px; font-weight: 700; white-space: nowrap; }
#sbInfo > div { display: flex; gap: 6px; }
#sbInfo .pen { background: #a3261c; padding: 2px 7px; border-radius: 4px; font-variant-numeric: tabular-nums; }
#sbInfo b { background: var(--panel); padding: 2px 9px; border-radius: 4px; }
#sbInfo b.pp { background: var(--gold); color: #1a1400; }
#flags { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
#flags span { background: rgba(30, 60, 120, .85); padding: 3px 9px; border-radius: 4px; animation: blink .7s infinite alternate; }
#flags .warn { background: rgba(190, 70, 20, .9); }
@keyframes blink { to { opacity: .45; } }
#big { position: absolute; top: 24%; left: 50%; transform: translate(-50%, -50%) scale(.8); text-align: center; opacity: 0; transition: opacity .25s, transform .25s; text-shadow: 0 4px 22px rgba(0, 0, 0, .8); }
#big.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#bigT { font-size: 62px; font-weight: 900; font-style: italic; letter-spacing: 2px; }
#bigS { font-size: 22px; font-weight: 600; margin-top: 2px; }
#big.goal #bigT { color: var(--gold); font-size: 96px; animation: pulse .5s infinite alternate; }
#big.warn #bigT { color: #ff8a4a; }
@keyframes pulse { to { transform: scale(1.07); } }
#ticker { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--acc); padding: 9px 22px; border-radius: 6px; font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .3s; max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ticker.on { opacity: 1; }
#pl { position: absolute; left: 22px; bottom: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; width: 250px; opacity: 0; transition: opacity .2s; }
#pl.on { opacity: 1; }
#plName { font-weight: 800; font-size: 16px; margin-bottom: 6px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#plLine { font-size: 11px; color: var(--dim); margin-top: 5px; }
.barRow { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); margin-top: 4px; }
.barRow span { width: 66px; }
.bar { flex: 1; height: 9px; background: rgba(255, 255, 255, .12); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 50%; background: #3ddc84; border-radius: 5px; }
.bar.pw i { background: linear-gradient(90deg, #ffd21f, #ff5a3c); width: 0; }
#fo { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); width: 420px; text-align: center; opacity: 0; transition: opacity .2s; }
#fo.on { opacity: 1; }
#foTxt { font-weight: 700; font-size: 15px; margin-bottom: 7px; text-shadow: 0 2px 8px #000; }
#fo.bad #foTxt { color: #ff6a4a; }
.foBar { position: relative; height: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
.foBar em { position: absolute; right: 0; top: 0; bottom: 0; width: 12%; background: #3ddc84; border-radius: 0 7px 7px 0; }
.foBar i { position: absolute; top: -4px; width: 6px; height: 22px; background: #fff; border-radius: 3px; z-index: 1; }
#fight { position: absolute; top: 34%; left: 50%; transform: translateX(-50%); width: 430px; background: var(--panel); border: 2px solid #ff5a3c; border-radius: 10px; padding: 12px 18px; display: none; }
#fight.on { display: block; }
#fgTitle { text-align: center; font-weight: 900; font-style: italic; font-size: 26px; color: #ff8a4a; }
.fgRow { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-weight: 700; font-size: 14px; }
.fgRow span { width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fgRow .bar { height: 14px; } .fgRow .bar i { background: #ff5a3c; width: 100%; }
#fgHelp { text-align: center; margin-top: 10px; font-size: 13px; color: var(--gold); }
#so { position: absolute; top: 76px; right: 22px; font-weight: 800; }
#so div { background: var(--panel); margin-bottom: 4px; padding: 5px 10px; border-radius: 6px; display: flex; gap: 6px; align-items: center; min-width: 110px; }
#so i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid #fff; }
#so i.g { background: #3ddc84; } #so i.x { background: #a3261c; }
#toast { position: absolute; top: 132px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, .7); padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity .2s; }
#toast.on { opacity: 1; }

#ticker::before { content: "EN DIRECT"; font-size: 10px; letter-spacing: 2px; color: var(--acc); margin-right: 12px; vertical-align: middle; }
#ticker.key { border-left-color: var(--gold); }
#ticker.key::before { color: var(--gold); }
#sb .tm.flash { animation: sbflash 1.6s ease-out; }
@keyframes sbflash { 0%, 40% { background: var(--gold); color: #1a1400; } 100% { background: transparent; } }
#card { position: absolute; left: 22px; bottom: 150px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--acc); border-radius: 8px; padding: 9px 16px; min-width: 230px; opacity: 0; transform: translateX(-30px); transition: opacity .35s, transform .35s; }
#card.on { opacity: 1; transform: none; }
#card b { display: block; font-size: 11px; letter-spacing: 2px; color: var(--acc); }
#card span { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
#rp { position: absolute; top: 86px; left: 26px; display: none; }
#rp.on { display: block; }
#rpT { display: inline-block; background: #c8201c; padding: 6px 16px; font-weight: 900; font-style: italic; font-size: 22px; letter-spacing: 2px; border-radius: 4px; animation: blink .8s infinite alternate; }
#rpS { margin-top: 6px; font-size: 13px; font-weight: 600; text-shadow: 0 2px 6px #000; }
#star { position: absolute; left: 7vw; top: 50%; transform: translateY(-50%); background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--gold); border-radius: 10px; padding: 18px 30px; display: none; min-width: 330px; }
#star.on { display: block; animation: slidein .5s ease-out both; }
#star .rk { color: var(--gold); font-size: 30px; letter-spacing: 6px; }
#star .lb { font-size: 13px; letter-spacing: 3px; color: var(--acc); font-weight: 700; margin-top: 4px; }
#star .nm { font-size: 30px; font-weight: 900; font-style: italic; margin-top: 4px; }
#star .tm { color: var(--dim); font-size: 14px; }
#star .ln { margin-top: 8px; font-size: 17px; font-weight: 700; color: var(--gold); }

#hud.replaying #big, #hud.replaying #pl, #hud.replaying #fo, #hud.replaying #card, #hud.replaying #flags { display: none; }

/* ---------- Menus ---------- */
#screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 22px; background: radial-gradient(ellipse at 50% 40%, rgba(6, 14, 28, .55), rgba(3, 6, 12, .9)); overflow: auto; }
#screen.on { display: flex; }
#screen.mainmenu { background: linear-gradient(90deg, rgba(3, 8, 18, .92) 0%, rgba(3, 8, 18, .6) 38%, rgba(3, 8, 18, 0) 70%); align-items: flex-start; padding-left: 7vw; }
h1 { font-size: 40px; font-style: italic; font-weight: 900; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
h4 { margin: 14px 0 6px; color: var(--acc); text-transform: uppercase; letter-spacing: 2px; font-size: 13px; }
h4 small { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.title .logo { font-size: 84px; font-weight: 900; font-style: italic; line-height: .88; letter-spacing: -1px; text-shadow: 0 8px 30px rgba(0, 0, 0, .7); animation: slidein .7s ease-out both; }
.title .logo span { display: block; color: var(--acc); }
.title .tag { color: var(--dim); margin-top: 12px; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; animation: slidein .7s .15s ease-out both; }
@keyframes slidein { from { opacity: 0; transform: translateX(-40px); } }
.menu { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; width: 340px; }
.menu.small { width: 260px; margin-top: 0; }
button { font: inherit; color: var(--ink); background: rgba(16, 30, 54, .85); border: 1px solid var(--line); border-left: 4px solid transparent; padding: 12px 18px; font-size: 18px; font-weight: 700; text-align: left; border-radius: 6px; cursor: pointer; transition: transform .12s, background .12s, border-color .12s; }
.menu button { animation: slidein .5s ease-out both; }
.menu button:nth-child(2) { animation-delay: .05s; } .menu button:nth-child(3) { animation-delay: .1s; } .menu button:nth-child(4) { animation-delay: .15s; }
.menu button:nth-child(5) { animation-delay: .2s; } .menu button:nth-child(6) { animation-delay: .25s; } .menu button:nth-child(7) { animation-delay: .3s; }
button:hover:not([disabled]), button:focus-visible { background: rgba(30, 80, 140, .95); border-left-color: var(--gold); transform: translateX(6px); outline: none; }
button[disabled] { opacity: .45; cursor: default; }
button small { float: right; font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
button.primary { background: linear-gradient(90deg, #0f6fb8, #1aa3e0); border-color: #6fd3ff; }
.foot { color: var(--dim); font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.vs { display: flex; align-items: center; gap: 18px; }
.vs .mid { font-size: 34px; font-weight: 900; font-style: italic; color: var(--dim); }
.pick { display: flex; align-items: center; gap: 8px; }
.pick > button { padding: 22px 12px; text-align: center; }
.pick > button:hover, .pick > button:focus-visible { transform: none; }
.card { width: 300px; background: linear-gradient(160deg, var(--c1), #0a1220 78%); border: 1px solid var(--line); border-top: 6px solid var(--c2); border-radius: 12px; padding: 14px 18px 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
.card .lbl { font-size: 11px; letter-spacing: 2px; color: rgba(255, 255, 255, .75); font-weight: 700; }
.card .crest { width: 84px; height: 84px; margin: 10px auto; border-radius: 50%; background: var(--c2); border: 5px solid var(--c3); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(0, 0, 0, .35); }
.card .crest span { font-weight: 900; font-style: italic; font-size: 26px; color: var(--c1); }
.card h2 { margin: 0; text-align: center; font-size: 22px; } .card h3 { margin: 0; text-align: center; font-size: 28px; font-style: italic; font-weight: 900; text-transform: uppercase; }
.card .meta { text-align: center; font-size: 12px; color: rgba(255, 255, 255, .7); margin: 4px 0 8px; }
.card ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.card li { display: flex; gap: 6px; padding: 3px 0; border-top: 1px solid rgba(255, 255, 255, .1); }
.card li i { margin-left: auto; color: var(--dim); font-style: normal; }
.opts { display: flex; gap: 30px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 24px 18px; max-height: 68vh; overflow: auto; }
.opts .col { display: flex; flex-direction: column; gap: 6px; min-width: 300px; }
.opts label { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 15px; }
.opts label.chk { justify-content: flex-start; }
select, input[type=range] { font: inherit; background: #0d1a30; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; }
select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); }
.keys { display: grid; grid-template-columns: 1fr; gap: 4px; }
.keys div { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.keys button { padding: 4px 12px; font-size: 13px; min-width: 110px; text-align: center; }
.keys button.wait { background: var(--gold); color: #1a1400; }
.opts .col > button { font-size: 13px; padding: 7px 12px; margin-top: 8px; }
.scoreline { font-size: 26px; font-weight: 700; } .scoreline b { font-size: 40px; color: var(--gold); margin: 0 6px; } .scoreline small { color: var(--dim); font-size: 14px; margin-left: 10px; }
.scoreline.big b { font-size: 60px; }
.cols { display: flex; gap: 28px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
table { border-collapse: collapse; font-size: 13px; }
.tstats { background: var(--panel); border-radius: 8px; overflow: hidden; }
.tstats td, .tstats th { padding: 4px 14px; text-align: center; } .tstats td:nth-child(2) { color: var(--dim); }
.tstats th { background: rgba(53, 200, 255, .15); font-size: 15px; }
.scroll { max-height: 30vh; overflow: auto; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; background: var(--panel); border-radius: 8px; padding: 8px 12px; border: 1px solid var(--line); }
.pstats th { text-align: left; color: var(--acc); padding: 3px 7px; position: sticky; top: 0; }
.pstats td { padding: 2px 7px; border-top: 1px solid rgba(255, 255, 255, .06); font-variant-numeric: tabular-nums; }
.pstats i { color: var(--dim); font-style: normal; font-size: 11px; } .pstats .gk td { color: var(--gold); }
.goals { list-style: none; margin: 0; padding: 8px 12px; background: var(--panel); border-radius: 8px; font-size: 13px; max-width: 460px; max-height: 22vh; overflow: auto; }
.goals li { padding: 2px 0; } .goals i { color: var(--dim); font-style: normal; } .goals em { color: var(--gold); font-style: normal; font-weight: 700; }
.dim { color: var(--dim); }
.stars { display: flex; gap: 12px; }
.star { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 8px; padding: 8px 18px; text-align: center; min-width: 170px; }
.star .n { color: var(--gold); letter-spacing: 3px; } .star b { display: block; font-size: 16px; } .star span { color: var(--dim); font-size: 12px; }

/* ---------- Éditeur d'équipe ---------- */
#screen.editor { justify-content: flex-start; padding-top: 4vh; background: rgba(3, 7, 14, .8); }
h1 small { font-size: 15px; font-style: normal; color: var(--dim); letter-spacing: 0; text-transform: none; margin-left: 8px; }
.mini { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; border: 3px solid; font-size: 12px; font-weight: 900; font-style: italic; flex: none; vertical-align: middle; letter-spacing: 0; }
.tgrid { display: grid; grid-template-columns: repeat(4, minmax(210px, 1fr)); gap: 8px; max-height: 62vh; overflow: auto; padding: 4px; }
.tgrid button { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 14px; font-weight: 500; }
.tgrid button:hover, .tgrid button:focus-visible, .slot:hover, .slot:focus-visible, .prow:hover, .prow:focus-visible, .tabs button:hover, .tabs button:focus-visible { transform: none !important; }
.tgrid .nm { flex: 1; line-height: 1.2; } .tgrid .nm b { display: block; }
.tgrid small { float: none; margin: 0; text-align: right; }
.note { background: rgba(255, 210, 31, .14); border: 1px solid var(--gold); color: var(--gold); padding: 6px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; }
.tabs { display: flex; gap: 6px; }
.tabs button { padding: 8px 18px; font-size: 15px; text-align: center; border-left-width: 1px; }
.tabs button.cur { background: var(--acc); color: #04111d; border-color: var(--acc); }
.epanel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 24px 18px; max-height: 66vh; overflow: auto; width: min(900px, 94vw); }
.ecols { display: flex; gap: 30px; }
.ecols .col { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.ecols label { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 15px; }
.ecols label span { display: flex; align-items: center; gap: 8px; }
.ecols output { width: 24px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.ecols .col > button { font-size: 14px; padding: 8px 12px; margin-top: 6px; }
input[type=text], input[type=number] { font: inherit; background: #0d1a30; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; width: 200px; user-select: text; }
input.short { width: 80px; }
input[type=color] { width: 56px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; }
.kits { display: flex; gap: 18px; justify-content: center; }
.kits figure { margin: 0; text-align: center; background: rgba(255, 255, 255, .08); border-radius: 8px; padding: 8px 14px 6px; }
.kits figcaption { font-size: 12px; color: var(--dim); }
.lrow { display: flex; align-items: stretch; gap: 6px; margin-bottom: 6px; }
.lrow > span { width: 86px; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; justify-content: center; }
.lrow > span small { color: var(--dim); font-weight: 400; }
.slot { flex: 1; padding: 6px 10px; font-size: 14px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.slot i { font-style: normal; font-size: 10px; letter-spacing: 1px; color: var(--acc); }
.slot b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot small { float: none; margin: 0; text-transform: none; letter-spacing: 0; }
.slot.cur, .prow.cur { background: rgba(255, 210, 31, .22); border-color: var(--gold); border-left-color: var(--gold); }
.row.left { justify-content: flex-start; margin-top: 8px; }
.row.left button { font-size: 14px; padding: 8px 14px; }
.plist { max-height: 58vh; overflow: auto; gap: 3px !important; padding-right: 4px; margin-top: 10px; }
.prow { display: flex; gap: 8px; padding: 4px 10px; font-size: 13px; font-weight: 500; align-items: center; }
.prow b { width: 22px; text-align: right; } .prow span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow i { font-style: normal; color: var(--dim); width: 24px; } .prow em { font-style: normal; font-weight: 800; color: var(--gold); }

/* ---------- Étape 3 : logos, aperçu 3D, chimie ---------- */
.lg-s { width: 44px; height: 44px; flex: none; vertical-align: middle; }
.lg-l { width: 96px; height: 96px; flex: none; }
h1 .lg-s { width: 54px; height: 54px; margin-right: 6px; }
.card .crest { background: none; border: none; box-shadow: none; width: 96px; height: 96px; margin: 6px auto; }
.logorow { display: flex; gap: 14px; align-items: center; }
.logorow > div { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.pvcol { align-items: center; }
.pv { width: 280px; height: 340px; border-radius: 12px; background: radial-gradient(ellipse at 50% 35%, #2a4468, #0a1424 75%); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 13px; text-align: center; }
.kits { gap: 8px; }
.kitb { padding: 6px 8px 4px; display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 600; border-left-width: 1px; }
.kitb:hover, .kitb:focus-visible { transform: none; }
.kitb.cur { border-color: var(--gold); background: rgba(255, 210, 31, .18); }
.kitb svg { width: 64px; height: 80px; }
.lrow > span { width: 118px; }
.chem { font-style: normal; font-size: 11px; font-weight: 700; color: var(--dim); }

/* ---------- Écran tactile (cellulaire, tablette) ---------- */
html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body.touch { touch-action: manipulation; -webkit-touch-callout: none; }
body.touch #c { touch-action: none; }
#touch { display: none; --tk: 1; }
#touch.on { display: block; position: fixed; inset: 0; z-index: 20; pointer-events: none; }
#touch [hidden] { display: none !important; }
#tZone { position: absolute; left: 0; top: 18%; bottom: 0; width: 50%; pointer-events: auto; touch-action: none; }
#touch.lefty #tZone { left: auto; right: 0; }
#tBase { position: fixed; left: calc(env(safe-area-inset-left, 0px) + 100px * var(--tk)); top: calc(100% - env(safe-area-inset-bottom, 0px) - 100px * var(--tk)); width: calc(124px * var(--tk)); height: calc(124px * var(--tk)); margin: calc(-62px * var(--tk)) 0 0 calc(-62px * var(--tk)); border-radius: 50%; border: 2px solid rgba(255, 255, 255, .28); background: radial-gradient(circle, rgba(8, 16, 30, .30), rgba(8, 16, 30, .55)); opacity: .6; transition: opacity .15s; pointer-events: none; }
#touch.lefty #tBase { left: calc(100% - env(safe-area-inset-right, 0px) - 100px * var(--tk)); }
#tBase.on { opacity: 1; transition: none; }
#tKnob { position: absolute; left: 50%; top: 50%; width: calc(56px * var(--tk)); height: calc(56px * var(--tk)); margin: calc(-28px * var(--tk)) 0 0 calc(-28px * var(--tk)); border-radius: 50%; background: rgba(234, 243, 255, .75); box-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
#tBtns { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 14px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: calc(250px * var(--tk)); height: calc(210px * var(--tk)); }
#touch.lefty #tBtns { right: auto; left: calc(env(safe-area-inset-left, 0px) + 14px); transform: scaleX(-1); }
#touch.lefty .tb b, #touch.lefty .tb small { transform: scaleX(-1); }
.tb { position: absolute; pointer-events: auto; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0 4px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .32); border-left-width: 2px; background: rgba(16, 30, 54, .58); color: var(--ink); text-align: center; box-shadow: 0 3px 12px rgba(0, 0, 0, .4); transition: transform .06s, background .06s; }
.tb:hover:not([disabled]), .tb:focus-visible { transform: none; background: rgba(16, 30, 54, .58); border-left-color: rgba(255, 255, 255, .32); }
.tb b { display: block; font-size: calc(13px * var(--tk)); line-height: 1.05; font-weight: 800; }
.tb small { float: none; margin: 0; font-size: calc(9px * var(--tk)); letter-spacing: .5px; color: rgba(234, 243, 255, .7); }
.tb.down, .tb.down:hover { transform: scale(.9); background: rgba(255, 210, 31, .75); color: #141000; border-color: var(--gold); }
.tb.s0 { right: 0; bottom: 0; width: calc(96px * var(--tk)); height: calc(96px * var(--tk)); background: rgba(20, 130, 200, .62); border-color: rgba(111, 211, 255, .8); }
.tb.s0 b { font-size: calc(16px * var(--tk)); }
.tb.s1 { right: calc(104px * var(--tk)); bottom: 0; width: calc(72px * var(--tk)); height: calc(72px * var(--tk)); }
.tb.s2 { right: 0; bottom: calc(104px * var(--tk)); width: calc(72px * var(--tk)); height: calc(72px * var(--tk)); }
.tb.s3 { right: calc(86px * var(--tk)); bottom: calc(86px * var(--tk)); width: calc(64px * var(--tk)); height: calc(64px * var(--tk)); }
.tb.s4 { right: calc(160px * var(--tk)); bottom: calc(78px * var(--tk)); width: calc(56px * var(--tk)); height: calc(56px * var(--tk)); }
.tb.s5 { right: calc(184px * var(--tk)); bottom: calc(2px * var(--tk)); width: calc(62px * var(--tk)); height: calc(62px * var(--tk)); border-radius: 18px; }
#touch.c-fight .tb.s0 { background: rgba(200, 60, 30, .7); border-color: #ff8a4a; }
#tTop { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px); display: flex; gap: 8px; pointer-events: auto; }
.tt { width: 46px; height: 46px; padding: 0; border-radius: 50%; text-align: center; font-size: 16px; border-left-width: 1px; background: rgba(8, 16, 30, .7); touch-action: none; }
.tt:hover:not([disabled]) { transform: none; }
#tSkip { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); pointer-events: auto; font-size: 17px; padding: 16px 22px; background: linear-gradient(90deg, #7a5a00, #b88a00); border: 2px solid var(--gold); border-radius: 12px; touch-action: none; }
#touch.c-skip #tZone, #touch.c-bench #tZone, #touch.c-none #tZone, #touch.c-fight #tZone,
#touch.c-skip #tBase, #touch.c-bench #tBase, #touch.c-none #tBase, #touch.c-fight #tBase { display: none; }
body.touch #car .keys, body.touch #car .skip { display: none; }
.thelp { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.4; max-width: 420px; } .thelp b { color: var(--gold); margin-right: 4px; }
@media (hover: none) { button:hover:not([disabled]) { transform: none; } }

/* HUD sur écran tactile : rien ne doit cacher le jeu ni les boutons */
body.touch #ticker { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-width: 38vw; font-size: 13px; padding: 6px 12px; }

/* Téléphone tenu à la verticale : on demande de le tourner */
#rotate { display: none; }
@media (orientation: portrait) and (max-width: 600px) and (pointer: coarse) {
  body.ingame #rotate { display: flex; position: fixed; inset: 0; z-index: 200; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #05070b; text-align: center; font-size: 20px; font-weight: 800; padding: 30px; }

}
@keyframes rot { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(-90deg); } }
.tt svg { vertical-align: middle; }
/* écrans étroits (téléphone, tablette à la verticale) : les panneaux larges passent sur plusieurs lignes */

}

  <script type="application/json" id="mods">{"js/main.js": "// Point d'entrée : assemble moteur, simulation, rendu, audio et interface\nimport { DT } from './core/config.js';\nimport { R } from './core/util.js';\nimport { getTeams } from './data/teams.js';\nimport { Match } from './sim/match.js';\nimport { Renderer, CAM_NAMES } from './render/renderer.js';\nimport { Input } from './engine/input.js';\nimport { updateHuman } from './game/human.js';\nimport { Audio } from './audio/audio.js';\nimport { Hud } from './ui/hud.js';\nimport { Commentary } from './ui/commentary.js';\nimport { Replay } from './render/replay.js';\nimport { UI } from './ui/ui.js';\nimport { loadSettings, saveSettings } from './save/storage.js';\nimport { TouchControls, isTouchDevice } from './ui/touch.js';\nimport { Tutorial } from './ui/tutorial.js';\nimport { Gamepads } from './engine/gamepad.js';\nimport { CareerTracker } from './career/tracker.js';\nimport { ME } from './career/career.js';\nimport { keyName } from './engine/input.js';\nimport { equipped, item, unlock, bump, onUnlock } from './save/profile.js';\nimport { NetHost, NetClient } from './net/sync.js';\nimport { DEFAULT_KEYS } from './core/config.js';\n\n// touches transmises à l'hôte par l'invité (la caméra et la pause restent locales)\nconst NET_ACTIONS = Object.keys(DEFAULT_KEYS).filter((a) => a !== 'pause' && a !== 'camera');\n\nconst settings = loadSettings();\n// Premier lancement sur téléphone ou tablette : qualité graphique « mobile » (modifiable dans les options)\nif (!settings.mobileInit && isTouchDevice()) { settings.mobileInit = true; settings.quality = 'mobile'; saveSettings(settings); }\nconst canvas = document.getElementById('c');\nconst hudEl = document.getElementById('hud');\nconst input = new Input(settings.keys);\nconst renderer = new Renderer(canvas, settings);\nconst audio = new Audio(settings);\nconst hud = new Hud(hudEl, settings);\nconst commentary = new Commentary((t, p) => hud.say(t, p), (a, b) => hud.card .state === 'play') {\n      const sp = Math.hypot(b.vx, b.vz);\n      const turn = Math.abs(b.ctrl.mx * b.vz - b.ctrl.mz * b.vx) / (sp + 1);\n      sk = Math.min(0.1, sp * 0.004 + turn * 0.06) * (0.6 + 0.4 * Math.abs(Math.sin(b.stride * 2.4)));\n      // freinage ou virage serré : grattement de lames\n      this.scrapeCd = (this.scrapeCd || 0) - dt;\n      if (turn > 0.75 && sp > 4.5 && this.scrapeCd <= 0) { this.burst(5200, 0.3, 0.16, 'highpass'); this.scrapeCd = 0.6; }\n    }\n    this.skateN.g.gain.setTargetAtTime(sk, t, 0.05);\n  }\n}\n", "js/career/career.js": "// Mode Carrière : logique pure (aucun affichage), testable avec Node.\n// Un joueur créé monte du junior à la grande ligue : saison, classement, XP, arbre de compétences, repêchage, contrats.\nimport { STYLE_MOD, ATTRS, G_ATTRS, calcOvr, randomName } from '../data/teams.js';\nimport { leagueTeams, teamStrength } from './leagues.js';\nimport { makeRng, clamp } from '../core/util.js';\n\nconst rnd = makeRng((Date.now() ^ 0x51ed27) >>> 0);\nexport const seedCareer = (n) => rnd.seed(n);\nconst poisson = (l) => { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= rnd.f(); } while (p > L); return k - 1; };\n\nexport const ME = 'moi';\nexport const SLOT = { LW: 0, C: 1, RW: 2 };\nexport const LINE_NAMES = { F: ['1er trio', '2e trio', '3e trio', '4e trio'], D: ['1er duo', '2e duo', '3e duo'], G: ['Gardien partant'] };\nexport const isG = (c) => c.pos === 'G';\nexport const lineName = (c, l = c.line) => LINE_NAMES[isG(c) ? 'G' : c.pos === 'D' ? 'D' : 'F'][isG(c) ? 0 : l];\nexport const maxLine = (c) => (isG(c) ? 0 : c.pos === 'D' ? 2 : 3);\n// Pourcentage d'arrêts d'un gardien (stats { sa, sv })\nexport const svPct = (st) => (st && st.sa ? st.sv / st.sa : 0);\nexport const fmtSv = (st) => (st && st.sa ? svPct(st).toFixed(3).replace(/^0/, '') : '—');\n\nexport const LOOKS = {\n  skin: [['#f1c9a5', 'Clair'], ['#e0ac84', 'Doré'], ['#c68e63', 'Hâlé'], ['#9a6a45', 'Brun'], ['#6d4a31', 'Foncé']],\n  tape: [['#11 d: 1 }, max: 3, req: 'roc2' },\n    { id: 'shield', name: 'Bouclier humain', ability: 'shield', max: 1, cost: 2 },\n  ] },\n];\n// Arbre du gardien\nexport const TREE_G = [\n  { id: 'gref', name: 'Réflexes', nodes: [\n    { id: 'gref1', name: 'Mains rapides', eff: { ref: 1 }, max: 3 },\n    { id: 'gref2', name: 'Mitaine éclair', eff: { ref: 1, acc: 1 }, max: 3, req: 'gref1' },\n    { id: 'gref3', name: 'Instinct', eff: { ref: 1 }, max: 3, req: 'gref2' },\n    { id: 'wall', name: 'Le mur', ability: 'wall', max: 1, cost: 2 },\n  ] },\n  { id: 'gpos', name: 'Positionnement', nodes: [\n    { id: 'gpos1', name: 'Angles', eff: { pos: 1 }, max: 3 },\n    { id: 'gpos2', name: 'Lecture du tireur', eff: { pos: 1, end: 1 }, max: 3, req: 'gpos1' },\n    { id: 'gpos3', name: 'Contrôle des retours', eff: { pos: 1 }, max: 3, req: 'gpos2' },\n    { id: 'glue', name: 'Mitaine de colle', ability: 'glue', max: 1, cost: 2 },\n  ] },\n  { id: 'gmob', name: 'Mobilité', nodes: [\n    { id: 'gmob1', name: 'Poussées latérales', eff: { acc: 3 }, max: 3 },\n    { id: 'gmob2', name: 'Récupération', eff: { end: 2, acc: 1 }, max: 3, req: 'gmob1' },\n    { id: 'gmob3', name: 'Relances', eff: { pas: 3 }, max: 3, req: 'gmob2' },\n    { id: 'focus', name: 'Concentration', ability: 'focus', max: 1, cost: 2 },\n  ] },\n];\nexport const treeOf = (c) => (isG(c) ? TREE_G : TREE);\nexport const ABILITY_NEED = 5; // points dans la branche avant de débloquer sa capacité\nconst NODES = Object.fromEntries([...TREE, ...TREE_G].flatMap((b) => b.nodes.map((n) => [n.id, { ...n, branch: b }])));\nexport const rank = (c, id) => c.tree[id] || 0;\nexport const branchPts = (c, b) => b.nodes.reduce((s, n) => s + (n.ability ? 0 : rank(c, n.id)), 0);\nexport function canBuy(c, id) {\n  const n = NODES[id];\n  if (!n || rank(c, id) >= n.max || c.sp < (n.cost || 1)) return false;\n  if (n.req && !rank(c, n.req)) return false;\n  if (n.ability && branchPts(c, n.branch) < ABILITY_NEED) return false;\n  return true;\n}\nexport function buy(c, id) {\n  if (!canBuy(c, id)) return false;\n  const n = NODES[id];\n  c.sp -= n.cost || 1; c.tree[id] = rank(c, id) + 1;\n  if (n.ability && !c.equip) c.equip = n.ability;\n  return true;\n}\nexport const unlocked = (c) => Object.keys(ABILITIES).filter((a) => rank(c, a));\n\n// Attributs effectifs : base (qui progresse) + bonus de l'arbre\nexport function effAttrs(c) {\n  const a = { ...c.a };\n  for (const id of Object.keys(c.tree)) {\n    const n = NODES[id];\n    if (n && n.eff) for (const k of Object.keys(n.eff)) a[k] += n.eff[k] * c.tree[id];\n  }\n  for (const k of [...ATTRS, ...G_ATTRS]) a[k] = Math.round(clamp(a[k], 30, 99));\n  return a;\n}\nexport function playerDef(c) {\n  const a = effAttrs(c);\n  const p = { id: ME, name: c.name, num: c.num, pos: c.pos, style: c.style, hand: c.hand, a, age: c.age, look: c.look, ability: c.equip };\n  p.ovr = calcOvr(p);\n  return p;\n}\nexport const ovr = (c) => playerDef(c).ovr;\n\n// ---------- XP et niveaux ----------\nexport const xpNeed = (c) => 180 + 45 * c.level;\nfunction gainXp(c, xp) {\n  c.xp += xp;\n  let ups = 0;\n  const mod = STYLE_MOD[c.style] || {};\n  const keys = isG(c) ? ['ref', 'pos', 'acc'] : ATTRS;\n  const pool = keys.flatMap((k) => Array(1 + Math.max(0, Math.round((mod[k] || 0) / 4))).fill(k));\n  while (c.xp >= xpNeed(c)) {\n    c.xp -= xpNeed(c); c.level++; c.sp++; ups++;\n    for (let i = 0; i < (isG(c) ? 1 : 3); i++) { const k = rnd.pick(pool); c.a[k] = Math.min(95, c.a[k] + 1); } // progression naturelle\n  }\n  return ups;\n}\n\n// ---------- création ----------\nexport function newCareer(o) {\n  const mod = STYLE_MOD[o.style] || {}, a = {};\n  for (const k of ATTRS) {\n    let v = 56 + (mod[k] || 0) * 0.8;\n    if (o.pos === 'D' && (k === 'chk' || k === 'sns')) v += 3;\n    if (o.pos === 'D' && (k === 'accu' || k === 'hnd')) v -= 3;\n    a[k] = Math.round(v);\n  }\n  a.ref = 30; a.pos = 30;\n  if (o.pos === 'G') { // gardien : réflexes et positionnement comptent; le reste sert peu\n    for (const k of ATTRS) a[k] = 48 + (mod[k] || 0);\n    a.ref = 57 + (mod.ref || 0); a.pos = 57 + (mod.pos || 0);\n  }\n  const c = {\n    v: 1, name: o.name, num: o.num, pos: o.pos, style: o.style, hand: o.hand, look: o.look,\n    age: 17, year: 1, a, tree: {}, equip: null, xp: 0, level: 1, sp: 1,\n    line: 1, trust: 50, earned: 0, contract: { type: 'junior', team: null, years: 1, salary: 0 },\n    drafted: null, draft: null, offers: null, phase: 'season', news: [], history: [], season: null,\n  };\n  startSeason(c, 0, o.team);\n  note(c, `Tu te joins aux ${myTeam(c).name} de ${myTeam(c).city}, dans la ligue junior. Le repêchage a lieu en fin de saison.`);\n  return c;\n}\nfunction note(c, txt) { c.news.unshift(txt); if (c.news.length > 8) c.news.length = 8; }\n\n// ---------- saison, calendrier, classement ----------\nfunction roundRobin(n) {\n  const ids = [...Array(n).keys()], out = [];\n  for (let r = 0; r < n - 1; r++) {\n    const round = [];\n    for (let i = 0; i < n / 2; i++) { const x = ids[i], y = ids[n - 1 - i]; round.push((r + i) % 2 ? [x, y] : [y, x]); }\n    out.push(round); ids.splice(1, 0, ids.pop());\n  }\n  return out;\n}\nconst zeroSt = () => ({ gp: 0, g: 0, a: 0, sog: 0, hits: 0, pim: 0, toi: 0, blk: 0, pm: 0, rat: 0, sa: 0, sv: 0, ga: 0, so: 0 });\n\nfunction startSeason(c, lg, team, fromRound = 0) {\n  const teams = leagueTeams(lg), n = teams.length;\n  let rounds = roundRobin(n);\n  if (lg === 0) rounds = rounds.concat(rounds.map((r) => r.map(([h, a]) => [a, h]))); // aller-retour\n  c.season = { lg, team, round: 0, rounds, table: teams.map(() => ({ gp: 0, w: 0, l: 0, otl: 0, pts: 0, gf: 0, ga: 0 })), log: [], st: zeroSt() };\n  for (let i = 0; i < fromRound; i++) playRound(c, null);\n}\nexport const myTeam = (c) => leagueTeams(c.season.lg)[c.season.team];\nexport const gamesLeft = (c) => c.season.rounds.length - c.season.round;\n\nexport function nextGame(c) {\n  const s = c.season;\n  if (s.round >= s.rounds.length) return null;\n  const pair = s.rounds[s.round].find((p) => p.includes(s.team));\n  const home = pair[0] === s.team, opp = home ? pair[1] : pair[0];\n  return { home, opp, team: leagueTeams(s.lg)[opp] };\n}\n\nfunction simScore(sh, sa) {\n  const d = (sh - sa) * 0.07;\n  let h = poisson(Math.max(0.6, 3.05 + d)), a = poisson(Math.max(0.6, 2.9 - d)), ot = false;\n  if (h === a) { ot = true; if (rnd.chance(0.5 + d * 0.3)) h++; else a++; }\n  return { h, a, ot };\n}\nfunction apply(table, h, a, gh, ga, ot) {\n  const H = table[h], A = table[a];\n  H.gp++; A.gp++; H.gf += gh; H.ga += ga; A.gf += ga; A.ga += gh;\n  const W = gh > ga ? H : A, L = gh > ga ? A : H;\n  W.w++; W.pts += 2;\n  if (ot) { L.otl++; L.pts++; } else L.l++;\n}\n// Joue une journée du calendrier; mine = { gf, ga, ot } pour le match du joueur (ou null : tout est simulé)\nfunction playRound(c, mine) {\n  const s = c.season, teams = leagueTeams(s.lg);\n  for (const [h, a] of s.rounds[s.round]) {\n    if (mine && (h === s.team || a === s.team)) {\n      const home = h === s.team;\n      apply(s.table, h, a, home ? mine.gf : mine.ga, home ? mine.ga : mine.gf, mine.ot);\n    } else { const r = simScore(teamStrength(teams[h]), teamStrength(teams[a])); apply(s.table, h, a, r.h, r.a, r.ot); }\n  }\n  s.round++;\n}\nexport function standings(c) {\n  const s = c.season, teams = leagueTeams(s.lg);\n  return s.table.map((r, i) => ({ ...r, i, team: teams[i], me: i === s.team }))\n    .sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);\n}\nexport const myRank = (c) => standings(c).findIndex((r) => r.me) + 1;\nexport const avgRating = (c) => (c.season.st.gp ? c.season.st.rat / c.season.st.gp : 6);\n\n// Équipes du prochain match, avec le joueur inséré à sa place dans l'alignement\nexport function withMe(team, c) {\n  const t = JSON.parse(JSON.stringify(team)), me = playerDef(c);\n  const idx = isG(c) ? t.lines.G[0] : c.pos === 'D' ? t.lines.D[Math.min(c.line, 2)][c.hand < 0 ? 0 : 1] : t.lines.F[c.line][SLOT[c.pos]];\n  const used = new Set(t.players.filter((p, i) => i !== idx).map((p) => p.num));\n  for (const p of t.players) if (p.num === me.num && p !== t.players[idx]) { let n = 2; while (used.has(n) || n === me.num) n++; p.num = n; used.add(n); }\n  t.players[idx] = me;\n  return t;\n}\nexport function matchTeams(c) {\n  const g = nextGame(c), mine = withMe(myTeam(c), c);\n  return { home: g.home ? mine : g.team, away: g.home ? g.team : mine, userHome: g.home };\n}\n\n// Match simulé : résultat et feuille de match du joueur estimés d'après sa cote et son temps de glace\nexport function simMyGame(c) {\n  const s = c.season, g = nextGame(c), teams = leagueTeams(s.lg);\n  const mineS = teamStrength(myTeam(c)), r = g.home ? simScore(mineS, teamStrength(g.team)) : simScore(teamStrength(g.team), mineS);\n  const gf = g.home ? r.h : r.a, ga = g.home ? r.a : r.h;\n  if (isG(c)) return simGoalie(c, gf, mineS, teamStrength(g.team), teams);\n  const isD = c.pos === 'D', lf = (isD ? [1.15, 0.9, 0.65] : [1.25, 1, 0.7, 0.45])[c.line];\n  const avg = teams.reduce((x, t) => x + teamStrength(t), 0) / teams.length, o = ovr(c);\n  const ex = clamp(0.7 + (o - avg) * 0.045, 0.1, 1.9) * lf * (isD ? 0.6 : 1);\n  const goals = Math.min(gf, poisson(ex * (c.style === 'Marqueur' ? 0.55 : 0.4)));\n  const ast = Math.min(Math.max(0, gf - goals), poisson(ex * 0.6));\n  const st = { g: goals, a: ast, sog: goals + poisson(1.5 * lf), hits: poisson((STYLE_MOD[c.style].chk > 5 ? 2 : 0.9) * lf),\n    pim: rnd.chance(0.07) ? 2 : 0, toi: (isD ? [22, 18, 13] : [19, 16, 12, 8])[c.line] * 60, blk: poisson(isD ? 0.9 : 0.3), pm: clamp(Math.round((gf - ga) * 0.35 * lf + rnd.g() * 0.6), -3, 3) };\n  const rating = clamp(5.45 + 1.1 * goals + 0.7 * ast + 0.1 * st.sog + rnd.g() * 0.5 + (o - avg) * 0.04 - st.pim * 0.25, 2, 10);\n  return { gf, ga, ot: r.ot, st, rating, obj: [], sim: true };\n}\n\n// Match simulé d'un gardien : tirs reçus selon l'adversaire, buts accordés selon sa cote\nfunction simGoalie(c, gf, mineS, oppS, teams) {\n  const avg = teams.reduce((x, t) => x + teamStrength(t), 0) / teams.length, o = ovr(c);\n  const sa = Math.max(12, poisson(Math.max(14, 28 + (oppS - mineS) * 0.6)));\n  const sv = clamp(0.893 + (o - avg) * 0.0035 + rnd.g() * 0.03, 0.75, 0.985);\n  const ga = Math.min(sa, poisson(sa * (1 - sv)));\n  let ot = false, f = gf;\n  if (f === ga) { ot = true; if (rnd.chance(0.5 + (o - avg) * 0.01)) f++; else ot = 'L'; }\n  const lost = ot === 'L', gaT = ga + (lost ? 1 : 0);\n  const st = { g: 0, a: rnd.chance(0.04) ? 1 : 0, sog: 0, hits: 0, pim: 0, toi: 3600, blk: 0, pm: 0, sa: sa + (lost ? 1 : 0), sv: sa - ga, ga: gaT, so: gaT ? 0 : 1 };\n  const rating = clamp(6 + (svPct(st) - 0.895) * 45 + (gaT ? 0 : 0.6) + (f > gaT ? 0.3 : 0) + rnd.g() * 0.3, 2, 10);\n  return { gf: f, ga: gaT, ot: !!ot, st, rating, obj: [], sim: true };\n}\n\n// Enregistre un match (joué ou simulé) : classement, statistiques, XP, confiance de l'entraîneur, rappel\nexport function recordGame(c, r) {\n  const s = c.season, g = nextGame(c), win = r.gf > r.ga, done = r.obj.filter((q) => q.done).length;\n  const xp = Math.round(r.sim ? 30 + r.rating * 9 + r.st.g * 20 + r.st.a * 12 + (win ? 15 : 0)\n    : 60 + r.rating * 18 + r.st.g * 40 + r.st.a * 25 + done * 50 + (win ? 30 : 0)) + (r.st.so || 0) * (r.sim ? 20 : 40);\n  playRound(c, r);\n  s.log.push({ opp: g.team.abbr, home: g.home, gf: r.gf, ga: r.ga, ot: r.ot, g: r.st.g, a: r.st.a, sa: r.st.sa || 0, sv: r.st.sv || 0, rating: +r.rating.toFixed(1), sim: !!r.sim });\n  const T = s.st;\n  T.gp++; T.rat += r.rating;\n  for (const k of ['g', 'a', 'sog', 'hits', 'pim', 'toi', 'blk', 'pm', 'sa', 'sv', 'ga', 'so']) T[k] = (T[k] || 0) + (r.st[k] || 0);\n  const out = { xp, levels: gainXp(c, xp), msgs: [], win };\n  // temps de glace selon les performances\n  c.trust = clamp(c.trust + (r.rating - 6) * 7 + done * 4, 0, 100);\n  if (c.trust >= 80 && c.line > 0) { c.line--; c.trust = 50; out.msgs.push(`L'entraîneur est impressionné : tu , 'Continentale', 66 + (b.rating - 74) * 0.5], 200 + i, 9000 + i * 577), 20, 31);\n  });\n  cache = [junior, farm];\n  return cache;\n}\n\n// Équipes d'une ligue (0 junior, 1 mineure, 2 grande ligue)\nexport function leagueTeams(lg) {\n  if (lg === 2) return getTeams().slice(0, 16);\n  return lower()[lg];\n}\nexport const teamStrength = (t) => t.players.reduce((s, p) => s + p.ovr, 0) / t.players.length;\n", "js/career/tracker.js": "// Suivi du joueur de Carrière pendant un match : note, objectifs de l'entraîneur, temps de glace\nimport { clamp } from '../core/util.js';\nimport { ABILITIES, lineName, maxLine, isG, fmtSv } from './career.js';\n\nconst OBJ = [\n  { id: 'sog', text: (n) => `Décoche ${n} tir${n > 1 ? 's' : ''} au but`, n: 2, w: (c) => (c.pos === 'D' ? 1 : 3) },\n  { id: 'hits', text: (n) => `Distribue ${n} mise${n > 1 ? 's' : ''} en échec`, n: 2, w: () => 2 },\n  { id: 'pts', text: () => 'Récolte un point', n: 1, fixed: true, w: (c) => (c.pos === 'D' ? 1 : 2) },\n  { id: 'passes', text: (n) => `Réussis ${n} passes`, n: 4, w: () => 3 },\n  { id: 'fow', text: (n) => `Gagne ${n} mises au jeu`, n: 3, w: (c) => (c.pos === 'C' ? 3 : 0) },\n  { id: 'blk', text: () => 'Bloque un tir', n: 1, fixed: true, w: (c) => (c.pos === 'D' ? 3 : 1) },\n  { id: 'take', text: () => 'Soutire une rondelle à l\\'adversaire', n: 1, fixed: true, w: () => 2 },\n  { id: 'pim', text: () => 'Reste hors du banc des pénalités', max: true, w: () => 1 },\n  { id: 'gaOn', text: () => 'Ne sois pas sur la glace pour un but adverse', max: true, w: (c) => (c.pos === 'D' ? 3 : 1) },\n];\n\n// Objectifs du gardien\nconst OBJ_G = [\n  { id: 'sv', text: (n) => `Réalise ${n} arrêts`, n: 4, w: () => 3 },\n  { id: 'ga', text: () => \"N'accorde aucun but cette période\", max: true, w: () => 3 },\n  { id: 'fz', text: (n) => `Gèle la rondelle ${n} fois`, n: 2, w: () => 2 },\n  { id: 'passes', text: () => 'Relance le jeu avec une passe réussie', n: 1, fixed: true, w: () => 2 },\n];\n\nexport class CareerTracker {\n  constructor(m, c, hud, settings) {\n    this.m = m; this.c = c; this.hud = hud; this.set = settings;\n    this.me = m.lockPl; this.team = m.teams[m.userTeam];\n    this.x = { passes: 0, take: 0, gaOn: 0, gfOn: 0, pm: 0 };\n    this.bonus = 0; this.objs = []; this.cur = null; this.pend = null; this.moved = false;\n    this.line = c.line;\n    this.newObj();\n    m.on((type, d) => this.onEvent(type, d));\n  }\n\n  get onIce() { return this.team.skaters.some((b) => b.active && b.p === this.me) || (this.team.goalie.active && this.team.goalie.p === this.me); }\n  stat(id) {\n    const s = this.me.st;\n    return id === 'pts' ? s.g + s.a : id in this.x ? this.x[id] : s[id];\n  }\n  get rating() {\n    const s = this.me.st, x = this.x;\n    if (isG(this.c)) { // gardien : % d'arrêts (la moyenne en match joué tourne autour de ,820), blanchissage, relances\n      const svp = s.sa ? s.sv / s.sa : 0.82;\n      return clamp(6 + (svp - 0.82) * 22 * Math.min(1, s.sa / 15) + (s.ga === 0 && s.sa >= 8 ? 0.6 : 0) + 0.15 * x.passes + 0.08 * (s.fz || 0)\n        + 0.6 * s.g + 0.4 * s.a - 0.25 * s.pim + this.bonus, 1, 10);\n    }\n    return clamp(6 + 1.1 * s.g + 0.7 * s.a + 0.12 * s.sog + 0.12 * s.hits + 0.2 * s.blk + 0.04 * x.passes + 0.15 * x.take + 0.03 * s.fow\n      - 0.25 * s.pim + 0.15 * x.gfOn - 0.25 * x.gaOn + this.bonus, 1, 10);\n  }\n\n  newObj() {\n    const used = new Set(this.objs.map((o) => o.id));\n    const pool = (isG(this.c) ? OBJ_G : OBJ).filter((o) => !used.has(o.id)).flatMap((o) => Array(o.w(this.c)).fill(o));\n    const o = pool[Math.floor(Math.random() * pool.length)];\n    const n = o.max ? 0 : o.fixed ? o.n : Math.max(1, Math.round(o.n * Math.min(1.5, this.set.periodMin / 4)));\n    this.cur = { id: o.id, text: o.text(n), n, max: !!o.max, base: this.stat(o.id), done: false };\n    this.objs.push(this.cur);\n    this.hud.toast('Objectif : ' + this.cur.text);\n  }\n  prog(o) { return this.stat(o.id) - o.base; }\n  closeObj() {\n    const o = this.cu ${fmtSv(s)}<\/div>`;\n      h += `<div class=\"keys\">${K('slap')} papillon (maintenir) · ${K('sprint')} poussée · ${K('check')} plongeon · ${K('wrist')} geler · ${K('pass')} passe · ${K('dump')} dégager<\/div>`;\n    }\n    if (o) {\n      const p = this.prog(o);\n      h += `<div class=\"ob${(o.max ? p > 0 : false) ? ' bad' : (!o.max && p >= o.n) ? ' ok' : ''}\">Objectif : ${o.text}${o.max ? (p > 0 ? ' ✗' : '') : ` (${Math.min(p, o.n)}/${o.n})`}<\/div>`;\n    }\n    if (me.ability) {\n      const left = (me.abUntil || 0) - m.time, cd = (me.abReady || 0) - m.time;\n      h += `<div class=\"ab${left > 0 ? ' act' : ''}\">${ABILITIES[me.ability].name} : ${left > 0 ? 'ACTIVE' : cd > 0 ? Math.ceil(cd) + ' s' : `prête [${keyName(this.set.keys.ability)}]`}<\/div>`;\n    }\n    if (!m.userBody && m.state !== 'final') {\n      h += `<div class=\"bn\">${me.unavailable > 0 ? 'AU BANC DES PÉNALITÉS' : 'SUR LE BANC'} · avance rapide<\/div>`;\n      h += `<div class=\"skip\">${skipping ? \"Simulation jusqu'à ta prochaine présence…\" : `Appuie sur <kbd>${K('skip')}<\/kbd> pour simuler jusqu'à ta prochaine présence`}<\/div>`;\n    }\n    return h;\n  }\n\n  result() {\n    const m = this.m, s = this.me.st, o = m.other(this.team);\n    if (this.cur) this.closeObj();\n    return { gf: this.team.score, ga: o.score, ot: m.period > 3, rating: this.rating, sim: false,\n      st: { g: s.g, a: s.a, sog: s.sog, hits: s.hits, pim: s.pim, toi: s.toi, blk: s.blk, pm: this.x.pm,\n        ...(isG(this.c) ? { sa: s.sa, sv: s.sv, ga: s.ga, so: s.ga === 0 && s.sa > 0 ? 1 : 0 } : {}) },\n      obj: this.objs.map((q) => ({ text: q.text, done: q.done })) };\n  }\n}\n", "js/core/config.js": "// Constantes globales du jeu (unités : mètres, secondes)\nexport const RINK = {\n  L: 30.5,        // demi-longueur\n  W: 13,          // demi-largeur\n  R: 8.5,         // rayon des coins\n  goalX: 26.6,    // ligne de but\n  blueX: 7.6,     // ligne bleue\n  netHW: 0.92,    // demi-largeur du filet\n  netH: 1.2 >>> 14)) >>> 0) / 4294967296;\n    },\n    r(a, b) { return a + (b - a) * o.f(); },\n    i(a, b) { return Math.floor(a + (b - a + 1) * o.f()); },\n    pick(arr) { return arr[Math.floor(o.f() * arr.length)]; },\n    g() { // gaussienne approx. (moyenne 0, écart-type 1)\n      return (o.f() + o.f() + o.f() + o.f() + o.f() + o.f() - 3) * 1.4142;\n    },\n    chance(p) { return o.f() < p; },\n  };\n  return o;\n}\n\n// RNG global de la simulation\nexport const R = makeRng((Date.now() ^ 0x9e3779b9) >>> 0);\n", "js/data/chemistry.js": "// Chimie entre coéquipiers d'un même trio ou d'une même paire (0 à 100).\n// Une bonne chimie améliore passes, sens du jeu, précision et maniement des joueurs concernés.\nexport const CHEM_ATTRS = ['pas', 'sns', 'accu', 'hnd'];\nconst clamp = (v, a, b) => (v < a ? a : v > b ? b : v);\n\n// Trio : players = [ailier gauche, centre, ailier droit]\nexport function trioChem(players) {\n  const slots = ['LW', 'C', 'RW'];\n  let c = 46;\n  const st = players.map((p) => p.style);\n  players.forEach((p, i) => { c += p.pos === slots[i] ? 6 : p.pos === 'D' || p.pos === 'G' ? -9 : -2; });\n  const has = (s) => st.includes(s);\n  const finisher = has('Marqueur'), maker = has('Fabricant de jeu'), muscle = has('Joueur physique') || has('Plombier');\n  if (finisher && maker) c += 16;                 // un passeur pour alimenter un marqueur\n  if (muscle && (finisher || maker)) c += 8;      // quelqu'un pour gagner les batailles\n  c += st.filter((s) => s === 'Attaquant complet').length * 4;\n  if (st[0] === st[1] && st[1] === st[2]) c -= 12; // trois profils identiques\n  if (st.filter((s) => s === 'Marqueur').length >= 2 && !maker) c -= 6;\n  return Math.round(clamp(c, 0, 100));\n}\n\n// Paire de défenseurs\nexport function pairChem(players) {\n  let c = 54;\n  const st = players.map((p) => p.style);\n  for (const p of players) if (p.pos !== 'D') c -= 10;\n  const off = st.filter((s) => s === 'Défenseur offensif').length, def = st.filter((s) => s === 'Défenseur défensif').length;\n  if (off === 1 && def === 1) c += 22;            // l'un monte, l'autre reste\n  c += st.filter((s) => s === 'Défenseur complet').length * 8;\n  if (off === 2) c -= 8;\n  if (def === 2) c -= 2;\n  return Math.round(clamp(c, 0, 100));\n}\n\nexport function teamChem(team) {\n  const P = (ix) => ix.map((i) => team.players[i]);\n  return { F: team.lines.F.map((l) => trioChem(P(l))), D: team.lines.D.map((l) => pairChem(P(l))) };\n}\n\n// Points d'attribut gagnés ou perdus : de -4 (chimie 0) à +4 (chimie 100)\nexport const chemBonus = (c) => Math.round(((c - 50) / 50) * 4);\nexport const chemLabel = (c) => (c >= 80 ? 'Excellente' : c >= 62 ? 'Bonne' : c >= 45 ? 'Correcte' : 'Faible');\n", "js/data/kit.js": "// Apparence d'une équipe : motif du chandail, uniformes (domicile, visiteur, rétro), logo généré, couleurs de l'aréna\nexport const LOOK_OPTS = {\n  stripes: { none: 'Aucune', simple: 'Simple', double: 'Double', triple: 'Triple' },\n  shoulders: { none: 'Unies', yoke: 'Contrastées' },\n  panels: { none: 'Aucun', sides: 'Côtés', sleeves: 'Manches' },\n  numStyle: { bloc: 'Bloc', contour: 'Contour', italique: 'Italique', rond: 'Arrondi' },\n  logoShape: { cercle: 'Cercle', ecu: 'Écu', losange: 'Losange', hexagone: 'Hexagone', etoile: 'Étoile' },\n  logoMotif: { aucun: 'Aucun', anneau: 'Anneau', chevron: 'Chevron', bande: 'Bande' },\n  logoText: { abbr: 'Abréviation', initiale: 'Initiale' },\n};\nexport const LOOK_LABELS = { stripes: 'Bandes', shoulders: 'Épaules', panels: 'Empiècements', numStyle: 'Style des numéros',\n  logoShape: 'Forme', logoMotif: 'Motif', logoText: 'Lettres' };\nexport const DEFAULT_LOOK = { stripes: 'simple', shoulders: 'yoke', panels: 'none', numStyle: 'bloc',\n  logoShape: 'cercle', logoMotif: 'anneau', logoText: 'abbr', ice: '#f3f8fc', boards: '#d9dee6' };\nexport const KIT_NAMES = { home: 'Domicile', away: 'Visiteur', retro: 'Rétro' };\n// ancien réglage unique « style de chandail », conservé pour les sauvegardes existantes\nexport const JERSEY_STYLES = { classique: 'Classique', bandes: 'À bandes', contraste: 'Manches contrastées' };\n\nconst HEX = /^#[0-9a-f]{6}$/i;\nconst rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));\nconst cdist = (a, b) => { const x = rgb(a), y = rgb(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); };\nconst lum = (h) => { const c = rgb(h); return 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]; };\n\n// Valide une apparence lue d'une sauvegarde ou d'un fichier importé\nexport function sanitizeLook(raw, legacyJersey) {\n  const l = { ...DEFAULT_LOOK };\n  if (!raw || typeof raw !== 'object') {\n    if (legacyJersey === 'bandes') l.stripes = 'double';\n    if (legacyJersey === 'contraste') l.panels = 'sleeves';\n    return l;\n  }\n  for (const k of Object.keys(LOOK_OPTS)) if (typeof raw[k] === 'string' && LOOK_OPTS[k][raw[k]]) l[k] = raw[k];\n  for (const k of ['ice', 'boards']) if (typeof raw[k] === 'string' && HEX.test(raw[k])) l[k] = raw[k].toLowerCase();\n  return l;\n}\nexport const getLook = (team) => team.look || sanitizeLook(null, team.jersey);\n\n// Apparence de départ, variée d'une équipe à l'autre\nexport function defaultLook(idx) {\n  const pick = (k, n) => Object.keys(LOOK_OPTS[k])[n % Object.keys(LOOK_OPTS[k]).length];\n  return { ...DEFAULT_LOOK, stripes: pick('stripes', idx + 1), shoulders: idx % 3 === 1 ? 'none' : 'yoke', panels: pick('panels', idx * 2),\n    numStyle: pick('numStyle', idx >> 1), logoShape: pick('logoShape', idx), logoMotif: pick('logoMotif', idx * 3 + 1) };\n}\n\n// kit = { jersey, trim, accent, pants, helmet, number, stripes, shoulders, panels, numStyle }\n// variant : 'home', 'away' ou 'retro' (true / false acceptés pour domicile / visiteur)\nexport function kitFor(team, variant, oppPrimary) {\n  const v = variant === true ? 'home' : variant === false ? 'away' : variant;\n  const [c1, c2, c3] = team.colors, L = getLook(team);\n  const pat = { stripes: L.stripes, shoulders: L.shoulders, panels: ctx.lineTo(x, y); else ctx.moveTo(x, y);\n    }\n    ctx.closePath();\n  };\n  if (shape === 'ecu') {\n    ctx.moveTo(cx - r * 0.86, cy - r * 0.9); ctx.lineTo(cx + r * 0.86, cy - r * 0.9); ctx.lineTo(cx + r * 0.86, cy + r * 0.1);\n    ctx.quadraticCurveTo(cx + r * 0.8, cy + r * 0.75, cx, cy + r); ctx.quadraticCurveTo(cx - r * 0.8, cy + r * 0.75, cx - r * 0.86, cy + r * 0.1);\n    ctx.closePath();\n  } else if (shape === 'losange') poly(4, -Math.PI / 2);\n  else if (shape === 'hexagone') poly(6, 0);\n  else if (shape === 'etoile') poly(16, -Math.PI / 2, 0.8);\n  else ctx.arc(cx, cy, r, 0, Math.PI * 2);\n}\n\nexport function drawLogo(ctx, team, cx, cy, r) {\n  const [c1, c2, c3] = team.colors, L = getLook(team);\n  ctx.save();\n  ctx.lineJoin = 'round';\n  shapePath(ctx, L.logoShape, cx, cy, r);\n  ctx.fillStyle = c1; ctx.fill();\n  ctx.save(); ctx.clip();\n  ctx.fillStyle = c3; ctx.strokeStyle = c3;\n  if (L.logoMotif === 'chevron') {\n    ctx.lineWidth = r * 0.22; ctx.beginPath();\n    ctx.moveTo(cx - r * 1.1, cy + r * 0.15); ctx.lineTo(cx, cy + r * 0.85); ctx.lineTo(cx + r * 1.1, cy + r * 0.15); ctx.stroke();\n  } else if (L.logoMotif === 'bande') {\n    ctx.translate(cx, cy); ctx.rotate(-0.5); ctx.fillRect(-r * 1.5, r * 0.34, r * 3, r * 0.26); ctx.setTransform(1, 0, 0, 1, 0, 0);\n  } else if (L.logoMotif === 'anneau') {\n    ctx.lineWidth = r * 0.07; shapePath(ctx, L.logoShape, cx, cy, r * 0.8); ctx.stroke();\n  }\n  ctx.restore();\n  shapePath(ctx, L.logoShape, cx, cy, r);\n  ctx.lineWidth = r * 0.11; ctx.strokeStyle = cdist(c2, c1) > 70 ? c2 : '#ffffff'; ctx.stroke();\n  const text = L.logoText === 'initiale' ? (team.name || '?').charAt(0).toUpperCase() : team.abbr;\n  const size = r * (text.length <= 1 ? 1.15 : text.length === 2 ? 0.82 : text.length === 3 ? 0.62 : 0.5);\n  ctx.font = `italic 900 ${size}px Arial, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n  ctx.lineWidth = size * 0.14; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.strokeText(text, cx, cy + size * 0.04);\n  ctx.fillStyle = cdist(c2, c1) > 70 ? c2 : '#ffffff'; ctx.fillText(text, cx, cy + size * 0.04);\n  ctx.restore();\n}\n\nconst logoCache = new Map();\nconst logoKey = (t) => [t.colors.join(''), t.abbr, (t.name || '').charAt(0), getLook(t).logoShape, getLook(t).logoMotif, getLook(t).logoText].join('|');\nexport function logoCanvas(team) {\n  const k = logoKey(team);\n  let c = logoCache.get(k);\n  if (!c) {\n    c = document.createElement('canvas'); c.width = c.height = 160;\n    drawLogo(c.getContext('2d'), team, 80, 80, 70);\n    c.url = c.toDataURL();\n    if (logoCache.size > 80) logoCache.clear();\n    logoCache.set(k, c);\n  }\n  return c;\n}\nexport const logoUrl = (team) => logoCanvas(team).url;\nexport const logoImg = (team, cls = 'lg-s') => `<img class=\"${cls}\" src=\"${logoUrl(team)}\" alt=\"\">`;\n\n// Aperçu 2D d'un uniforme (vue de dos) pour les menus\nexport function jerseySvg(kit, num) {\n  const sleeve = kit.panels === 'sleeves' ? kit.trim : kit.jersey;\n  const n = { none: 0, simple: 1, double: 2, triple: 3 }[kit.stripes] || 0;\n  let bands = '';\n  for (let i = 0; i < n; i++) {\n    const col = i % 2 ? kit.accent : kit.trim, y = 58 - i * 9;\n    bands += `<rect x=\"6\" y=\"${y}\" width=\"20\" height=\"6\" fill=\"${col}\"/><rect x=\"94\" y=\"${y}\" width=\"20\" height=\"6\" fill=\"${col}\"/><rect x=\"28\" y=\"${97 - i * 9}\" width=\"64\" height=\"6\" fill=\"${col}\"/>`;\n  }\n  const sides = kit.panels === 'sides' ? `<rect x=\"28\" y=\"36\" width=\"9\" height=\"68\" fill=\"${kit.trim}\"/><rect x=\"83\" y=\"36\" width=\"9\" height=\"68\" fill=\"${kit.trim}\"/>` : '';\n  const yoke = kit.shoulders === 'yoke' ? `<rect x=\"6\" y=\"22\" width=\"108\" height=\"13\" rx=\"6\" fill=\"${kit.trim}\"/>` : '';\n  return `<svg viewBox=\"0 0 120 150\" width=\"96\" height=\"120\" aria-hidden=\"true\">\n    <rect x=\"38\" y=\"104\" width=\"44\" height=\"34\" rx=\"4\" fill=\"${kit.pants}\" stroke=\"#000\" stroke-opacity=\".4\"/>\n e'];\n\n// Modificateurs d'attributs par style\nexport const STYLE_MOD = {\n  'Marqueur': { sht: 8, accu: 9, hnd: 3, pas: -3, chk: -8 },\n  'Fabricant de jeu': { pas: 10, hnd: 7, sns: 6, sht: -5, chk: -9 },\n  'Joueur physique': { chk: 13, sht: 3, end: 3, hnd: -7, pas: -5, spd: -3 },\n  'Attaquant complet': { sns: 5, end: 4, chk: 2 },\n  'Plombier': { chk: 8, end: 8, sns: 2, accu: -6, hnd: -6 },\n  'Défenseur offensif': { pas: 8, sht: 6, spd: 4, hnd: 5, chk: -6 },\n  'Défenseur défensif': { chk: 11, sns: 6, sht: -6, hnd: -7, pas: -3 },\n  'Défenseur complet': { sns: 4, end: 3 },\n  'Gardien': {},\n  'Gardien hybride': { ref: 2, pos: 2 },\n  'Gardien papillon': { pos: 6, ref: -1, acc: -3 },\n  'Gardien athlétique': { ref: 6, pos: -2, acc: 4 },\n};\n\nfunction genPlayer(rng, pos, base, used, id) {\n  let name;\n  do { name = rng.pick(FIRST) + ' ' + rng.pick(LAST); } while (used.names.has(name));\n  used.names.add(name);\n  let num;\n  do { num = pos === 'G' ? rng.pick([1, 29, 30, 31, 33, 35, 40, 41, 70, 72]) : rng.i(2, 98); } while (used.nums.has(num));\n  used.nums.add(num);\n  const style = pos === 'G' ? 'Gardien' : pos === 'D' ? rng.pick(D_STYLES) : rng.pick(F_STYLES);\n  const mod = STYLE_MOD[style];\n  const a = {};\n  for (const k of ['spd', 'acc', 'sht', 'accu', 'hnd', 'pas', 'chk', 'end', 'sns']) {\n    let v = base + rng.g() * 5 + (mod[k] || 0);\n    if (pos === 'D' && (k === 'chk' || k === 'sns')) v += 4;\n    if (pos === 'D' && (k === 'accu' || k === 'hnd')) v -= 4;\n    a[k] = Math.round(clamp(v, 40, 99));\n  }\n  a.ref = Math.round(clamp(pos === 'G' ? base + 2 + rng.g() * 4 : 30, 30, 99));\n  a.pos = Math.round(clamp(pos === 'G' ? base + 2 + rng.g() * 4 : 30, 30, 99));\n  const ovr = pos === 'G' ? Math.round((a.ref + a.pos) / 2)\n    : Math.round((a.spd + a.acc + a.sht + a.accu + a.hnd + a.pas + a.chk + a.end + a.sns) / 9);\n  return { id, name, num, pos, style, hand: rng.chance(0.62) ? -1 : 1, a, ovr, age: rng.i(19, 36) };\n}\n\nexport const ATTRS = ['spd', 'acc', 'sht', 'accu', 'hnd', 'pas', 'chk', 'end', 'sns'];\nexport const G_ATTRS = ['ref', 'pos'];\nexport const ATTR_LABELS = { spd: 'Vitesse', acc: 'Accélération', sht: 'Puissance du lancer', accu: 'Précision', hnd: 'Maniement',\n  pas: 'Passes', chk: 'Mise en échec', end: 'Endurance', sns: 'Sens du jeu', ref: 'Réflexes', pos: 'Positionnement' };\nexport const SKATER_STYLES = [...F_STYLES, ...D_STYLES];\nexport const POS_LABELS = { LW: 'Ailier gauche', C: 'Centre', RW: 'Ailier droit', D: 'Défenseur', G: 'Gardien' };\n\nexport function calcOvr(p) {\n  const a = p.a;\n  return p.pos === 'G' ? Math.round((a.ref + a.pos) / 2) : Math.round(ATTRS.reduce((s, k) => s + a[k], 0) / ATTRS.length);\n}\n// Cote d'équipe : moyenne des joueurs, ramenée sur l'échelle des cotes d'origine\nexport const calcRating = (t) => Math.round(t.players.reduce((s, p) => s + p.ovr, 0) / t.players.length + RATING_OFFSET);\nconst RATING_OFFSET = 1;\n\nexport function generateTeam(def, idx, seed = 1000 + idx * 7919) {\n  const [city, name, abbr, c1, c2, c3, conf, rating] = def;\n  const rng = makeRng(seed);\n  const used = { names: new Set(), nums: new Set() };\n  const players = [];\n  const mk = (pos, base) => { const p = genPlayer(rng, pos, base, used, `${abbr}-${players.length}`); players.push(p); return players.length - 1; };\n  const F = [], D = [], Gk = [];\n  for (let l = 0; l < 4; l++) {\n    const b = rating + 4 - l * 4.5;\n    F.push([mk('LW', b), mk('C', b + 1), mk('RW', b)]);\n  }\n  for (let l = 0; l < 3; l++) { const b = rating + 3 - l * 4.5; D.push([mk('D', b), mk('D', b)]); }\n  Gk.push(mk('G', rating + 3), mk('G', rating - 5));\n  return {\n    id: idx, city, name, abbr, conf, rating,\n    colors: [c1, c2, c3], jersey: 'classique', look: defaultLook(idx),\n    players, lines: { F, D, G: Gk },\n  };\n}\n\n// ---------- équipes modifiées et créées (éditeur d'équipe) ----------\nconst HEX = /^#[0-9a-f]{6}$/i;\nconst txt = (v, max, def) => (typeof v === 'string' && v.trim() ? v.t
